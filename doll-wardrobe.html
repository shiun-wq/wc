async function saveArchive(){
  const k=S.items.findIndex(x=>x.id===MV.id);if(k<0)return;
  const i=S.items[k],mates=MV.withSet?setMates(i):[];
  // 價格記在使用者按的那一件；整套一起移時，其他件標記屬於哪一筆
  const move=[i,...mates];
  move.forEach(x=>{
    Object.assign(x,{archivedAt:MV.date||today(),reason:MV.reason,soldPrice:x===i&&MV.reason==='賣掉了'?MV.price:'',memo:x===i?MV.memo:'',groupOf:x===i?null:i.id});
    S.items=S.items.filter(y=>y.id!==x.id);S.memory.push(x);
  });
  const gone=new Set(move.map(x=>x.id));
  UI.canvas=UI.canvas.filter(p=>!gone.has(p.itemId));
  await save();closeSheet();renderCloset();if(UI.tab==='home')renderHome();
  toast(move.length>1?`${move.length} 件一起放進回憶箱了`:'已放進回憶箱');
}
// 修補舊資料：套裝已經在回憶箱，拆出來的單品還留在衣櫃
async function moveSetMates(id){
  const i=S.memory.find(x=>x.id===id);if(!i)return;
  const mates=setMates(i);if(!mates.length)return;
  mates.forEach(x=>{Object.assign(x,{archivedAt:i.archivedAt||today(),reason:i.reason,soldPrice:'',memo:'',groupOf:i.id});S.items=S.items.filter(y=>y.id!==x.id);S.memory.push(x)});
  const gone=new Set(mates.map(x=>x.id));UI.canvas=UI.canvas.filter(p=>!gone.has(p.itemId));
  await save();renderMemory();toast(`${mates.length} 件一起移進回憶箱了`);
}
function renderMemory(){
  const el=document.getElementById('memoryView');
  const all=S.memory.slice().sort((a,b)=>(b.archivedAt||'').localeCompare(a.archivedAt||''));
  // 跟著套裝一起移進來的單品，收在套裝那張卡片裡
  const list=all.filter(i=>!(i.groupOf&&S.memory.some(x=>x.id===i.groupOf)));
  const back=all.reduce((a,i)=>a+money(i.soldPrice),0);
  if(!list.length){el.innerHTML=`<div class="empty"><strong>回憶箱是空的</strong>賣掉、送人或壞掉的娃衣，可以在單品頁按「移到回憶箱」，留下它們的故事</div>`;return}
  el.innerHTML=`<div class="stat">
      <div><b>${list.length}</b><span>件娃衣的回憶</span></div>
      <div><b>${back?fmt$(back):'—'}</b><span>賣出回收</span></div></div>
    ${list.map(i=>{
      const ws=S.wears.filter(w=>w.itemIds.includes(i.id));
      const dl={};ws.forEach(w=>{const n=(S.dolls.find(d=>d.id===w.dollId)||{}).name||w.dollName;if(n)dl[n]=(dl[n]||0)+1});
      const fav=Object.entries(dl).sort((a,b)=>b[1]-a[1])[0];
      const stay=i.createdAt?Math.max(1,Math.round((new Date(i.archivedAt)-i.createdAt)/864e5)):null;
      return `<div class="memcard">
        <div class="th memth">${img(i)?`<img src="${img(i)}" alt="">`:""}</div>
        <div class="bd"><b>${esc(i.name)}</b>
          <div class="lmeta"><span class="dchip none">${esc(i.reason||'回憶')}</span><span>${esc(i.archivedAt||'')}</span></div>
          ${(()=>{const g=all.filter(x=>x.groupOf===i.id);return g.length?`<div class="hint" style="margin:2px 0 4px">含 ${g.map(x=>esc(x.category)).join('、')}</div>`:''})()}
          ${setMates(i).length?`<button class="btn sm quiet" style="margin:4px 0" onclick="moveSetMates('${i.id}')">這套還有 ${setMates(i).length} 件在衣櫃，一起移進來</button>`:''}
          <span>${stay?`陪伴了 ${stay} 天・`:''}穿過 ${ws.length} 次${fav?`・最常穿在 ${esc(fav[0])} 身上`:''}${i.soldPrice?`・賣了 ${fmt$(money(i.soldPrice))}`:''}</span>
          ${i.memo?`<p class="memo">「${esc(i.memo)}」</p>`:''}
          <div class="row" style="margin-top:6px"><button class="btn sm ghost" onclick="restoreItem('${i.id}')">找回來</button>
            <button class="btn sm ghost" style="color:var(--muted)" onclick="delMemory('${i.id}')">刪除</button></div>
        </div></div>`}).join('')}`;
}
/* ---- 出售貼文：壓箱底的娃衣一鍵做成出售圖 + 可以直接貼的文字 ----
   圖一定會附註「App 建檔時的圖，實際衣況以賣家說明為準」，因為衣況一定跟建檔時不一樣 */
const SELL_COND=['全新未拆','近全新','良好','有使用痕跡','有小瑕疵'];
let SELL={};
function openSell(ids){
  const pressed=S.items.filter(isPressed).map(i=>i.id);
  const pool=[...new Set([...(ids||[]),...pressed])];
  if(!pool.length){toast('目前沒有壓箱底的娃衣');return}
  SELL={pool,sel:new Set(ids&&ids.length?ids:pressed.slice(0,1)),info:SELL.info||{},showWear:SELL.showWear||false,showSet:SELL.showSet!==false,lay:SELL.lay||'grid'};
  drawSell();
}
function sellInfo(id){return SELL.info[id]=SELL.info[id]||{price:'',cond:'良好',note:''}}
function drawSell(){
  const items=SELL.pool.map(id=>S.items.find(x=>x.id===id)).filter(Boolean);
  openSheet(`<h3>出售貼文</h3>
    <p class="hint" style="margin:-6px 0 12px">勾選要賣的娃衣，填價格和現在的衣況，就會做出一張出售圖和可以直接貼的文字。</p>
    <div class="blist">${items.map(i=>{const on=SELL.sel.has(i.id),f=sellInfo(i.id),c=wearCount(i.id);
      return `<div class="rowitem" style="display:block">
        <label class="row" style="gap:10px;align-items:center;cursor:pointer"><input type="checkbox" ${on?'checked':''} onchange="sellToggle('${i.id}',this.checked)">
          <div class="th" style="width:44px;height:44px;flex:0 0 44px">${img(i)?`<img src="${img(i)}" alt="">`:''}</div>
          <div class="tx"><b>${esc(i.name)}</b><span>${esc(i.category)}${(i.sizes||[]).length?'・'+i.sizes.map(esc).join('/'):''}・穿過 ${c} 次${isPressed(i)?'・📦':''}</span></div></label>
        ${on?`<div class="split" style="margin-top:10px">
          <label class="f" style="margin:0"><span>價格</span><input type="number" inputmode="decimal" placeholder="例如 350" value="${esc(f.price)}" oninput="sellInfo('${i.id}').price=this.value"></label>
          <label class="f" style="margin:0"><span>衣況</span><select onchange="sellInfo('${i.id}').cond=this.value">${SELL_COND.map(x=>`<option ${x===f.cond?'selected':''}>${x}</option>`).join('')}</select></label></div>
          <input type="text" style="margin-top:8px" maxlength="40" placeholder="衣況補充（選填），例如 領口有一點起毛球" value="${esc(f.note)}" oninput="sellInfo('${i.id}').note=this.value">`:''}
      </div>`}).join('')}</div>
    <div class="f" style="margin:14px 0 0"><span>圖片樣式</span>
      <div class="swap" id="sellLay">${[['grid','多件放一張'],['single','每件一張大圖']].map(([k,l])=>`<button data-k="${k}" class="${SELL.lay===k?'on':''}" onclick="SELL.lay='${k}';document.querySelectorAll('#sellLay button').forEach(b=>b.classList.toggle('on',b.dataset.k==='${k}'))">${l}</button>`).join('')}</div>
      <small class="hint">多件放一張適合一次po很多件；每件一張大圖看得比較清楚，適合讓買家參考細節。</small></div>
    <label class="remember" style="margin:12px 0 0"><input type="checkbox" ${SELL.showWear?'checked':''} onchange="SELL.showWear=this.checked"> 讓買家知道穿過幾次</label>
    <label class="remember" style="margin:6px 0 0"><input type="checkbox" ${SELL.showSet?'checked':''} onchange="SELL.showSet=this.checked"> 標出是哪一套的（有的話）</label>
    <div class="note" style="margin-top:12px">出售圖用的是建檔時的貼圖，圖上會註明「實際衣況請以賣家說明為準」。賣之前建議再拍一張現在的實拍一起放。</div>
    <button class="btn wide" style="margin-top:12px" onclick="makeSell()">做出售圖和文字</button>`);
}
function sellToggle(id,on){if(on)SELL.sel.add(id);else SELL.sel.delete(id);drawSell()}
function sellList(){return [...SELL.sel].map(id=>S.items.find(x=>x.id===id)).filter(Boolean)}
function sellText(list){
  const lines=['【出售｜娃衣】',''];
  list.forEach((i,k)=>{const f=sellInfo(i.id),sn=SELL.showSet&&i.setId?setName(i.setId):'';
    lines.push(`${list.length>1?(k+1)+'. ':''}${i.name}`);
    if((i.sizes||[]).length)lines.push(`　尺寸：${i.sizes.join(' / ')}`);
    if(sn&&!i.name.startsWith(sn))lines.push(`　套裝：${sn}`);
    lines.push(`　價格：${f.price?'$'+money(f.price).toLocaleString():'私訊詢問'}`);
    lines.push(`　衣況：${f.cond}${SELL.showWear?`（穿過 ${wearCount(i.id)} 次）`:''}${f.note?`，${f.note}`:''}`);
    lines.push('');
  });
  lines.push('※ 圖片為 App 建檔時的照片，實際衣況以私訊確認、實拍為準，歡迎詢問。');
  return lines.join('\n');
}
async function makeSell(){
  const list=sellList();if(!list.length){toast('先勾選要賣的娃衣');return}
  prog('製作出售圖中…');
  SELL.canvases=SELL.lay==='single'?await Promise.all(list.map(i=>drawSellBig(i))):[await drawSellCard(list)];
  SELL.text=sellText(list);
  const many=SELL.canvases.length>1;
  openSheet(`<h3>出售圖和文字</h3>
    ${many?`<p class="hint" style="margin:-6px 0 8px">共 ${SELL.canvases.length} 張，左右滑動看</p>`:''}
    <div class="${many?'sellstrip':''}">${SELL.canvases.map((c,k)=>`<div class="scwrap"><img src="${c.toDataURL('image/png')}" alt="出售圖 ${k+1}"></div>`).join('')}</div>
    <label class="f" style="margin-top:12px"><span>貼文文字（可以直接改）</span><textarea id="sellTxt" rows="8" oninput="SELL.text=this.value">${esc(SELL.text)}</textarea></label>
    <div class="row">
      <button class="btn ghost grow" onclick="sellDownload()">下載${many?' '+SELL.canvases.length+' 張':'圖片'}</button>
      <button class="btn ghost grow" onclick="sellCopy()">複製文字</button>
      ${navigator.share?`<button class="btn grow" onclick="sellShare()">分享</button>`:''}
    </div>
    <button class="btn ghost wide sm" style="margin-top:8px" onclick="drawSell()">回去修改</button>
    <p class="hint" style="margin:12px 0 6px">賣掉了嗎？移到回憶箱，會記下賣出價格。</p>
    <div class="parts" style="margin-top:0">${list.map(i=>`<button type="button" onclick="archiveItem('${i.id}');setTimeout(()=>{MV.price=sellInfo('${i.id}').price;const e=document.querySelector('#mv_p input');if(e)e.value=MV.price},50)">${esc(i.name)} 賣掉了</button>`).join('')}</div>`);
  document.getElementById('toast').classList.remove('on');
}
async function drawSellCard(list){
  const T=CARD_THEMES.cream,W=1080,n=Math.min(list.length,9),cols=n===1?1:n<=4?2:3,rows=Math.ceil(n/cols);
  const P=64,headH=236,footH=200,cellW=(W-P*2-(cols-1)*24)/cols,imgH=cols===1?620:cols===2?330:230,cellH=imgH+(cols===1?190:170);
  const H=Math.max(1350,headH+rows*cellH+(rows-1)*24+footH+P);
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const serif='"Noto Serif TC","Songti TC",serif',num='"Cormorant Garamond","Noto Serif TC",serif',sans=getComputedStyle(document.body).fontFamily;
  try{await document.fonts.ready}catch(e){}
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,T.bg[0]);g.addColorStop(1,T.bg[1]);x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle=T.accent;x.font=`600 30px ${num}`;x.letterSpacing='10px';x.fillText('FOR SALE',P,P+34);x.letterSpacing='0px';
  x.fillStyle=T.ink;x.font=`700 76px ${serif}`;x.fillText(n>1?`娃衣出售 ${n} 件`:'娃衣出售',P,P+124);
  const ims=await Promise.all(list.slice(0,n).map(i=>img(i)?loadImg(img(i)).catch(()=>null):null));
  list.slice(0,n).forEach((i,k)=>{
    const f=sellInfo(i.id),cx=P+(k%cols)*(cellW+24),cy=headH+Math.floor(k/cols)*(cellH+24);
    x.save();x.shadowColor='rgba(0,0,0,.08)';x.shadowBlur=24;x.shadowOffsetY=8;x.fillStyle=T.card;rrect(x,cx,cy,cellW,cellH,28);x.fill();x.restore();
    const im=ims[k];
    if(im){const s=Math.min((cellW-40)/im.width,(imgH-20)/im.height);x.drawImage(im,cx+(cellW-im.width*s)/2,cy+14+(imgH-im.height*s)/2,im.width*s,im.height*s)}
    let ty=cy+imgH+(cols===1?64:48);
    x.fillStyle=T.ink;x.font=`600 ${cols===3?26:32}px ${sans}`;x.fillText(fitText(x,i.name,cellW-36),cx+18,ty);
    ty+=cols===3?40:48;
    x.fillStyle=T.accent;x.font=`700 ${cols===3?36:46}px ${num}`;const pr=f.price?'$'+money(f.price).toLocaleString():'私訊';x.fillText(pr,cx+18,ty);
    const pw=x.measureText(pr).width;
    x.font=`500 ${cols===3?20:24}px ${sans}`;const tag=f.cond+(SELL.showWear?`・穿 ${wearCount(i.id)} 次`:'');const tw=Math.min(x.measureText(tag).width+28,cellW-pw-52);
    if(tw>40){x.fillStyle=T.soft;rrect(x,cx+30+pw,ty-(cols===3?26:32),tw,cols===3?34:42,17);x.fill();x.fillStyle=T.accent;x.fillText(fitText(x,tag,tw-28),cx+44+pw,ty-(cols===3?3:4))}
    if((i.sizes||[]).length){ty+=cols===3?34:40;x.fillStyle=T.sub;x.font=`500 ${cols===3?20:24}px ${sans}`;x.fillText(fitText(x,i.sizes.join(' / ')+(SELL.showSet&&i.setId&&!i.name.startsWith(setName(i.setId))?'・'+setName(i.setId):''),cellW-36),cx+18,ty)}
  });
  // 一定要有的提醒
  const fy=H-footH+6;
  x.fillStyle=T.soft;rrect(x,P,fy,W-P*2,98,20);x.fill();
  x.fillStyle=T.ink;x.font=`600 26px ${sans}`;x.fillText('※ 此圖由「娃衣衣櫃」App 以建檔時的照片製作',P+26,fy+42);
  x.fillStyle=T.sub;x.font=`500 24px ${sans}`;x.fillText('實際衣況請以賣家說明與實拍為準，購買前請再次確認',P+26,fy+78);
  x.textAlign='right';x.fillStyle=T.sub;x.font=`600 26px ${serif}`;x.fillText('娃衣衣櫃',W-P,H-P+8);x.textAlign='left';
  return c;
}
// 每件一張大圖：貼圖放大、下面是名稱、價格、衣況、尺寸，最下面一樣有衣況提醒
async function drawSellBig(i){
  const T=CARD_THEMES.cream,W=1080,H=1350,P=64,f=sellInfo(i.id);
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const serif='"Noto Serif TC","Songti TC",serif',num='"Cormorant Garamond","Noto Serif TC",serif',sans=getComputedStyle(document.body).fontFamily;
  try{await document.fonts.ready}catch(e){}
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,T.bg[0]);g.addColorStop(1,T.bg[1]);x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle=T.accent;x.font=`600 30px ${num}`;x.letterSpacing='10px';x.fillText('FOR SALE',P,P+34);x.letterSpacing='0px';
  // 大圖
  const AY=P+70,AH=720;
  x.save();x.shadowColor='rgba(0,0,0,.08)';x.shadowBlur=30;x.shadowOffsetY=10;x.fillStyle=T.card;rrect(x,P,AY,W-P*2,AH,36);x.fill();x.restore();
  const im=img(i)?await loadImg(img(i)).catch(()=>null):null;
  if(im){const s=Math.min((W-P*2-80)/im.width,(AH-80)/im.height);x.drawImage(im,(W-im.width*s)/2,AY+(AH-im.height*s)/2,im.width*s,im.height*s)}
  let y=AY+AH+86;
  x.fillStyle=T.ink;x.font=`700 54px ${serif}`;x.fillText(fitText(x,i.name,W-P*2),P,y);
  y+=84;x.fillStyle=T.accent;x.font=`700 72px ${num}`;const pr=f.price?'$'+money(f.price).toLocaleString():'私訊詢價';x.fillText(pr,P,y);
  const pw=x.measureText(pr).width;x.font=`500 30px ${sans}`;const tag=f.cond+(SELL.showWear?`・穿過 ${wearCount(i.id)} 次`:'');const tw=x.measureText(tag).width+40;
  x.fillStyle=T.soft;rrect(x,P+pw+24,y-42,tw,52,26);x.fill();x.fillStyle=T.accent;x.fillText(tag,P+pw+44,y-6);
  const meta=[(i.sizes||[]).length?'尺寸 '+i.sizes.join(' / '):'',SELL.showSet&&i.setId&&!i.name.startsWith(setName(i.setId))?'套裝 '+setName(i.setId):'',f.note].filter(Boolean).join('・');
  if(meta){y+=56;x.fillStyle=T.sub;x.font=`500 30px ${sans}`;x.fillText(fitText(x,meta,W-P*2),P,y)}
  const fy=H-P-120;
  x.fillStyle=T.soft;rrect(x,P,fy,W-P*2,98,20);x.fill();
  x.fillStyle=T.ink;x.font=`600 26px ${sans}`;x.fillText('※ 此圖由「娃衣衣櫃」App 以建檔時的照片製作',P+26,fy+42);
  x.fillStyle=T.sub;x.font=`500 24px ${sans}`;x.fillText('實際衣況請以賣家說明與實拍為準，購買前請再次確認',P+26,fy+78);
  x.textAlign='right';x.fillStyle=T.sub;x.font=`600 26px ${serif}`;x.fillText('娃衣衣櫃',W-P,H-P+8);x.textAlign='left';
  return c;
}
function sellBlob(c){return new Promise(r=>c.toBlob(r,'image/png'))}
const sellName=k=>`娃衣出售-${today()}${SELL.canvases.length>1?'-'+(k+1):''}.png`;
async function sellDownload(){
  for(let k=0;k<SELL.canvases.length;k++){
    const a=document.createElement('a');a.href=URL.createObjectURL(await sellBlob(SELL.canvases[k]));a.download=sellName(k);a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);await new Promise(r=>setTimeout(r,350));
  }
  toast(SELL.canvases.length>1?`已下載 ${SELL.canvases.length} 張`:'圖片已下載');
}
async function sellCopy(){try{await navigator.clipboard.writeText(SELL.text);toast('文字已複製')}catch(e){const t=document.getElementById('sellTxt');t.select();document.execCommand('copy');toast('文字已複製')}}
async function sellShare(){
  const fs=await Promise.all(SELL.canvases.map(async(c,k)=>new File([await sellBlob(c)],sellName(k),{type:'image/png'})));
  try{await navigator.share(navigator.canShare&&navigator.canShare({files:fs})?{files:fs,text:SELL.text}:{text:SELL.text})}catch(e){}
}
async function restoreItem(id){
  const i=S.memory.find(x=>x.id===id);if(!i)return;
  const back=[i,...S.memory.filter(x=>x.groupOf===id)];
  back.forEach(x=>{delete x.archivedAt;delete x.reason;delete x.soldPrice;delete x.memo;delete x.groupOf;S.memory=S.memory.filter(y=>y.id!==x.id);S.items.push(x)});
  await save();renderMemory();toast(back.length>1?`${back.length} 件一起放回衣櫃`:'已放回衣櫃');
}
async function delMemory(id){
  if(!confirm('永久刪除這件的回憶？'))return;
  S.memory=S.memory.filter(x=>x.id!==id&&x.groupOf!==id);await save();renderMemory();
}

/* ============================================================
   6. 衣櫃
   ============================================================ */
function wearCount(id){return S.wears.filter(w=>w.itemIds.includes(id)).length}
function lastWear(id){const w=S.wears.filter(x=>x.itemIds.includes(id)).map(x=>x.date).sort();return w.length?w[w.length-1]:null}
function setName(id){return (S.sets.find(s=>s.id===id)||{}).name||''}
function img(it){return it.cutout||it.photo||''}
// 穿搭紀錄的縮圖：有照片用照片，沒有就把這次穿的單品貼圖拼在一起（最多 4 件）
function wearThumb(w){
  if(w.photo)return `<div class="th"><img src="${w.photo}" style="object-fit:cover;padding:0" alt=""></div>`;
  const its=w.itemIds.map(anyItem).filter(i=>i&&img(i)&&i.category!=='套裝');
  const pick=(its.length?its:w.itemIds.map(anyItem).filter(i=>i&&img(i))).slice(0,4);
  if(pick.length<2)return `<div class="th">${pick[0]?`<img src="${img(pick[0])}" alt="">`:''}</div>`;
  return `<div class="th col c${pick.length}">${pick.map(i=>`<img src="${img(i)}" alt="">`).join('')}</div>`;
}

function renderCloset(){
  const keep=['catchips','viewchips','sizechips','tagchips'].map(k=>[k,document.getElementById(k).scrollLeft]);
  const FILTERS=visibleFilters(),FMAP=fmap();
  if(!FILTERS.includes(UI.cat))UI.cat='全部';
  document.getElementById('catchips').innerHTML=FILTERS.map(f=>`<button class="chip ${UI.cat===f?'on':''}" onclick="UI.cat=decodeURIComponent('${encodeURIComponent(f)}');renderCloset()">${esc(f)}</button>`).join('');
  const modes=['全部','壓箱底','從未穿過','收藏紀念','節日服','最近新增'];
  document.getElementById('viewchips').innerHTML=modes.map(f=>`<button class="chip ${UI.mode===f?'on':''}" onclick="UI.mode='${f}';UI.hol='';renderCloset()">${f}</button>`).join('');
  const sz=['全部尺寸',...sizes()];
  if(!sz.includes(UI.size))UI.size='全部尺寸';

    <p class="hint" style="margin:0 0 10px">節日服一年穿一次，超過 13 個月沒穿才會算壓箱底。</p>`:'';

const ORIGINS=['中國','台灣','日本','韓國','泰國','越南'];

const parseTags=v=>[...new Set(String(v||'').split(/[,，、#\s]+/).map(t=>t.trim()).filter(Boolean))].slice(0,12);
const originList=()=>[...new Set([...ORIGINS,...S.items.map(i=>(i.origin||'').trim()).filter(Boolean)])];

const BATCH={brand:['品牌','brand'],origin:['產地','origin'],buy:['購入日期','buyDate'],cat:['類型','category'],holiday:['節日主題','holiday'],tag:['標籤','tags'],untag:['標籤','tags']};
function openBatch(kind){
  const ids=[...UI.msel];if(!ids.length)return;
  if(!['origin','buy'].includes(kind))return openBatch2(kind,ids);
  const cur=ids.map(id=>(S.items.find(x=>x.id===id)||{})[kind==='origin'?'origin':'buyDate']||'');
  const same=cur.every(v=>v===cur[0])?cur[0]:'';
  openSheet(kind==='origin'?`<h3>批次改產地</h3>
    <p class="hint" style="margin:-6px 0 12px">一次改 ${ids.length} 件娃衣的產地。</p>
    <label class="f"><span>產地</span><input type="text" id="b_val" value="${esc(same)}" placeholder="例如 中國" maxlength="20"></label>

    <div class="row"><button class="btn ghost grow" onclick="applyBatch('buy',true)">清空日期</button><button class="btn grow" onclick="applyBatch('buy')">套用到 ${ids.length} 件</button></div>`);
}
function openBatch2(kind,ids){
  const its=ids.map(id=>S.items.find(x=>x.id===id)).filter(Boolean);
  const back=`<div class="sethead"><button onclick="openBatchMenu()">‹ 批次修改</button></div>`;
  const apply=(clear)=>`<div class="row"><button class="btn ghost grow" onclick="applyBatch('${kind}',true)">${clear}</button><button class="btn grow" onclick="applyBatch('${kind}')">套用到 ${ids.length} 件</button></div>`;
  let h='';
  if(kind==='brand'){const brands=[...new Set(S.items.map(i=>(i.brand||'').trim()).filter(Boolean))];
    h=`<h3>批次改品牌</h3><label class="f"><span>品牌</span><input type="text" id="b_val" maxlength="30" placeholder="例如 某某娃衣屋"></label>
    ${brands.length?`<div class="parts" style="margin:-4px 0 12px">${brands.map(o=>`<button type="button" onclick="document.getElementById('b_val').value=this.textContent">${esc(o)}</button>`).join('')}</div>`:''}${apply('清空品牌')}`}
  if(kind==='cat')h=`<h3>批次改類型</h3><p class="hint" style="margin:-6px 0 12px">想要新的類型（例如 日卡套裝、和服），先到 設定 → 衣櫃類別 新增。</p>
    <label class="f"><span>類型</span><select id="b_val">${allCats().filter(c=>c!=='套裝').map(c=>`<option>${esc(c)}</option>`).join('')}</select></label>${apply('取消').replace(`applyBatch('cat',true)`,'openBatchMenu()')}`;
  if(kind==='holiday')h=`<h3>批次設定節日主題</h3><p class="hint" style="margin:-6px 0 12px">節日服一年才穿一次，壓箱底會放寬到 13 個月；節日前 3 週首頁會提醒你。</p>
    <label class="f"><span>節日</span><select id="b_val">${HOL_NAMES.map(n=>`<option>${n}</option>`).join('')}</select></label>${apply('拿掉節日主題')}`;
  if(kind==='tag'){const tags=allTags();
    h=`<h3>加標籤</h3><p class="hint" style="margin:-6px 0 12px">標籤可以放作品、系列、活動，例如「戀與深空」「日卡」。一件可以有很多個標籤，衣櫃上方可以用標籤篩選。</p>
    <label class="f"><span>標籤（多個用逗號分開）</span><input type="text" id="b_val" placeholder="例如 戀與深空、日卡"></label>
    ${tags.length?`<div class="parts" style="margin:-4px 0 12px">${tags.map(o=>`<button type="button" onclick="const e=document.getElementById('b_val');e.value=(e.value?e.value+'、':'')+this.textContent">${esc(o)}</button>`).join('')}</div>`:''}
    <button class="btn wide" onclick="applyBatch('tag')">加到 ${ids.length} 件</button>`}
  if(kind==='untag'){const tags=[...new Set(its.flatMap(i=>i.tags||[]))];
    h=`<h3>移除標籤</h3>${tags.length?`<p class="hint" style="margin:-6px 0 12px">點要從這 ${ids.length} 件拿掉的標籤。</p><div class="parts">${tags.map(t=>`<button type="button" onclick="applyBatch('untag',false,decodeURIComponent('${encodeURIComponent(t)}'))">#${esc(t)} ×</button>`).join('')}</div>`:'<p class="hint">選到的娃衣都還沒有標籤。</p>'}`}
  openSheet(back+h);
}
async function applyBatch(kind,clear,arg){
  if(['brand','cat','holiday','tag','untag'].includes(kind)){
    const ids=kind==='cat'?[...UI.msel]:batchIds(),v=arg||(clear?'':(document.getElementById('b_val')||{}).value||'').trim();
    if(!clear&&!v&&kind!=='untag'){toast('先填內容');return}
    ids.forEach(id=>{const i=S.items.find(x=>x.id===id);if(!i)return;
      if(kind==='brand')i.brand=v;
      if(kind==='cat'&&v)i.category=v;
      if(kind==='holiday')i.holiday=clear?'':v;
      if(kind==='tag')i.tags=[...new Set([...(i.tags||[]),...parseTags(v)])];
      if(kind==='untag')i.tags=(i.tags||[]).filter(t=>t!==v);
    });
    await save();closeSheet();renderCloset();
    toast(kind==='untag'?`已從 ${ids.length} 件拿掉 #${v}`:`已${clear?'清空':'更新'} ${ids.length} 件的${BATCH[kind][0]}`);return;
  }
  const v=clear?'':document.getElementById('b_val').value.trim();
  if(!clear&&!v){toast(kind==='origin'?'先填產地':'先選日期');return}
  if(kind==='buy'&&v>today()){toast('購入日期不能是未來');return}
  const ids=batchIds();
  ids.forEach(id=>{const i=S.items.find(x=>x.id===id);if(i){if(kind==='origin')i.origin=v;else i.buyDate=v}});
  await save();closeSheet();renderCloset();
  toast(`已${clear?'清空':'更新'} ${ids.length} 件的${kind==='origin'?'產地':'購入日期'}`);
}

// 套裝和拆出來的單品共用的欄位：改套裝時，改了哪幾個就同步到單品（單品自己不一樣的欄位不會被蓋掉）
const SET_SHARED=['brand','shop','buyDate','origin','holiday','season','sizes','tags'];
function syncToMates(i,before){
  const mates=setMates(i);if(!mates.length)return 0;
  SET_SHARED.forEach(f=>{
    const a=JSON.stringify(before[f]??''),b=JSON.stringify(i[f]??'');if(a===b)return;
    mates.forEach(m=>{
      if(f==='tags'){const add=(i.tags||[]).filter(t=>!(before.tags||[]).includes(t)),del=(before.tags||[]).filter(t=>!(i.tags||[]).includes(t));
        m.tags=[...new Set([...(m.tags||[]).filter(t=>!del.includes(t)),...add])]}
      else m[f]=Array.isArray(i[f])?i[f].slice():i[f];
    });
  });
  return mates.length;
}
async function saveEdit(id){
  const i=S.items.find(x=>x.id===id),v=k=>document.getElementById(k).value;
  const before=JSON.parse(JSON.stringify(Object.fromEntries(SET_SHARED.map(f=>[f,i[f]]))));
  i.name=v('e_name');i.category=v('e_cat');i.season=v('e_season');i.brand=v('e_brand');i.shop=v('e_shop');
  i.buyDate=v('e_buy');i.origin=v('e_origin').trim();i.holiday=v('e_hol');i.tags=parseTags(v('e_tags'));i.price=v('e_price');i.material=v('e_mat');i.note=v('e_note');
  i.sizes=[...document.querySelectorAll('#e_sizes button.on')].map(b=>b.textContent);
  i.keepsake=document.getElementById('e_keep').classList.contains('on');
  i.keepsakeReason=v('e_kr');
  const sync=document.getElementById('e_sync');
  const n=i.category==='套裝'&&(!sync||sync.checked)?syncToMates(i,before):0;
  await save();closeSheet();renderCloset();toast(n?`已儲存，也同步到這套的 ${n} 件單品`:'已儲存');
}

async function makePartStickers(n){

// AI 整套一張：請 AI 把套裝每件分開平鋪成一排，只出 1 張圖，再在手機上依位置切開、照順序對應到每一件
const SET_PROMPT=names=>`把照片裡這套娃娃衣服的每一件單品分開，平鋪在純白色 #FFFFFF 背景上，由左到右排成一排，順序是：${names.map((n,i)=>(i+1)+'.'+n).join('　')}。每件之間留明顯的空白，不可以重疊或相碰，每件都完整不裁切。去掉背景、手、娃娃本體和雜物。不要陰影、文字、邊框、浮水印。顏色圖案材質都要跟原圖一模一樣，不要重新設計。直接輸出圖片。`;
async function aiSetCut(n){
  const q=UI.queue[n];if(!q||!needQuota('img'))return;
  q.working=true;renderQueue();
  prog(`AI 整套出圖中（${q.parts.length} 件），大約 10～60 秒，可以先去做別的事`);
  try{
    const out=extractImage(await aiChat('img',[{type:'image_url',image_url:{url:q.photo}},{type:'text',text:SET_PROMPT(q.parts.map(p=>p.name))}]));
    if(!out)throw new Error('這次沒有拿到圖片，再試一次，不扣次數');
    const im=await loadImg(out),c=drawScaled(im,1400),W=c.width,H=c.height;
    const {a,data}=bgMask(c.getContext('2d'),W,H,14,[255,255,255]);
    const groups=splitGroups(a,W,H,q.parts.length);
    if(!groups.length)throw new Error('AI 這次沒有畫出衣服，不扣次數，再試一次');
    // 整套的貼圖也順便有了（所有單品一起）
    if(!q.cutout){const all=Uint8ClampedArray.from(a);cleanMask(all,W,H);try{setCut(q,{sticker:await composeSticker(data,all,W,H),src:encSrc(data),mask:encMask(all,W,H)})}catch(e){}}
    groups.forEach((g,k)=>{
      const pt=q.parts[k];if(!pt)return;
      const pad=6,x0=Math.max(0,g.x0-pad),y0=Math.max(0,g.y0-pad),x1=Math.min(W-1,g.x1+pad),y1=Math.min(H-1,g.y1+pad);
      const w=x1-x0+1,h=y1-y0+1,src=new ImageData(w,h),m=new Uint8ClampedArray(w*h);
      for(let j=0;j<h;j++)for(let i=0;i<w;i++){
        const id=(j+y0)*W+i+x0,o=j*w+i;
        src.data.set(data.data.subarray(id*4,id*4+4),o*4);
        m[o]=g.lab[id]?a[id]:0;
      }
      g.cut={src,m,w,h};
    });
    for(let k=0;k<groups.length&&k<q.parts.length;k++){
      const {src,m,w,h}=groups[k].cut;cleanMask(m,w,h);
      setCut(q.parts[k],{sticker:await composeSticker(src,m,w,h),src:encSrc(src),mask:encMask(m,w,h)},'img');
    }
    const miss=q.parts.length-Math.min(groups.length,q.parts.length);
    // 只有每一件都切出來才扣次數；少了就算我們的，不讓使用者白花
    if(!miss)spendQuota('img');
    toast(miss?`切出 ${groups.length} 件，還有 ${miss} 件沒分出來（這次不扣次數），點小方框手動補`:`${q.parts.length} 件都切好了，不準的點小方框修`);
  }catch(e){toast('失敗：'+e.message)}
  q.working=false;renderQueue();
}
// 把遮罩切成 n 塊：最大的 n 塊當主體，其他小碎片併到最近的主體；由左到右排序
function splitGroups(a,W,H,n){
  const N=W*H,lab=new Int32Array(N),q=new Int32Array(N),comps=[];
  for(let s=0;s<N;s++){
    if(a[s]<128||lab[s])continue;
    const L=comps.length+1;let h=0,t=0,x0=W,y0=H,x1=0,y1=0,sx=0,sy=0;q[t++]=s;lab[s]=L;
    while(h<t){const id=q[h++],i=id%W,j=(id/W)|0;sx+=i;sy+=j;
      if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const x=i+dx,y=j+dy;if(x<0||y<0||x>=W||y>=H)continue;
        const m=y*W+x;if(!lab[m]&&a[m]>=128){lab[m]=L;q[t++]=m}}}
    comps.push({L,size:t,x0,y0,x1,y1,cx:sx/t,cy:sy/t});
  }
  const real=comps.filter(c=>c.size>=N*.0008).sort((p,r)=>r.size-p.size);
  const seeds=real.slice(0,n),rest=real.slice(n);
  const groups=seeds.map(c=>({ls:new Set([c.L]),x0:c.x0,y0:c.y0,x1:c.x1,y1:c.y1,cx:c.cx,cy:c.cy}));
  const gap=(c,g)=>Math.hypot(Math.max(0,g.x0-c.x1,c.x0-g.x1),Math.max(0,g.y0-c.y1,c.y0-g.y1));
  rest.forEach(c=>{
    if(!groups.length)return;
    const g=groups.reduce((b,x)=>gap(c,x)<gap(c,b)?x:b);
    g.ls.add(c.L);g.x0=Math.min(g.x0,c.x0);g.y0=Math.min(g.y0,c.y0);g.x1=Math.max(g.x1,c.x1);g.y1=Math.max(g.y1,c.y1);
  });
  groups.forEach(g=>{const m=new Uint8Array(N);for(let i=0;i<N;i++)if(lab[i]&&g.ls.has(lab[i]))m[i]=1;g.lab=m});
  // 排成一排時用 x 排；AI 排成兩排時，先依列再依 x
  const hs=groups.map(g=>g.y1-g.y0).sort((p,r)=>p-r),mh=hs[hs.length>>1]||1;
  return groups.sort((p,r)=>Math.abs(p.cy-r.cy)>mh*.8?p.cy-r.cy:p.cx-r.cx);
}
// 單件手動去背／修補：有貼圖就從遮罩接著改，沒有就從框出來的那一塊開始選

async function commitQueue(){
  // 尺寸一定要選：之後的分析、買前檢查「適合哪隻娃娃」都靠它
  const noSize=UI.queue.map((q,i)=>(q.sizes||[]).length?-1:i).filter(i=>i>=0);

    return;
  }
  const miss=UI.queue.filter(q=>q.isSet&&q.parts.length&&q.parts.some(p=>!p.img));
  if(miss.length&&!confirm('有套裝還沒逐件做貼圖，拆出來的單品會沒有自己的圖。要繼續嗎？')) return;
  let n=0;
  for(const q of UI.queue){
    const base={price:q.price||'',photo:q.photo,cutout:q.cutout,cutSrc:q.cutSrc||null,cutMask:q.cutMask||null,colors:q.colors,styles:q.styles,motifs:q.motifs,
      season:q.season,holiday:q.holiday||'',material:q.material,sizes:(q.sizes||[]).slice(),brand:'',shop:'',buyDate:'',note:'',
      keepsake:false,keepsakeReason:'',createdAt:Date.now()};
    if(q.isSet){
      const sid=uid('s'),nm=q.name||'未命名套裝';
      S.sets.push({id:sid,name:nm,createdAt:Date.now()});
      S.items.push(Object.assign({id:uid('i'),setId:sid,name:nm,category:'套裝'},base));n++;
      const seen={};
      for(const pt of q.parts){
        seen[pt.name]=(seen[pt.name]||0)+1;
        const sfx=seen[pt.name]>1?' '+String.fromCharCode(64+seen[pt.name]):'';
        S.items.push(Object.assign({},base,{
          id:uid('i'),setId:sid,name:`${nm}－${pt.name}${sfx}`,category:pt.name,
          photo:pt.crop||q.photo, cutout:pt.img||null, cutSrc:pt.cutSrc||null, cutMask:pt.cutMask||null
        }));n++;
      }
    }else{
      S.items.push(Object.assign({id:uid('i'),setId:null,name:q.name||'未命名',category:q.category},base));n++;
    }
  }
  UI.queue=[];renderQueue();await save();
  toast(`已建檔 ${n} 件`);go('closet');
}

function addToCanvas(id){
  if(UI.canvas.find(p=>p.itemId===id))return;
  UI.canvas.push({itemId:id,x:38,y:30,scale:120,rot:0});
  renderCanvas();
}
// 畫布上的一塊可以是娃衣（itemId）或娃娃本人（dollId）
function pieceSrc(p){if(p.dollId){const d=S.dolls.find(x=>x.id===p.dollId);return d&&d.photo}const it=S.items.find(x=>x.id===p.itemId);return it&&img(it)}
function pieceName(p){if(p.dollId)return (S.dolls.find(x=>x.id===p.dollId)||{}).name||'娃娃';return (S.items.find(x=>x.id===p.itemId)||{}).name||''}
const canvasItemIds=()=>UI.canvas.filter(p=>p.itemId).map(p=>p.itemId);
const canvasDoll=()=>{const p=UI.canvas.find(p=>p.dollId);return p?p.dollId:null};
function addDollToCanvas(id){
  UI.canvas=UI.canvas.filter(p=>!p.dollId);
  UI.canvas.unshift({dollId:id,x:50,y:56,scale:240,rot:0});
  UI.selPc=null;renderCanvas();toast('娃娃放在最底層，把衣服拖到身上試穿看看');
}
const pcTf=p=>`translate(-50%,-50%) rotate(${p.rot}deg)${p.flip?' scaleX(-1)':''}`;
function renderCanvas(){
  const c=document.getElementById('canvas');
  c.innerHTML=UI.canvas.map((p,n)=>{
    const src=pieceSrc(p);if(!src)return '';
    return `<div class="pc ${p.dollId?'doll':''} ${UI.selPc===n?'sel':''}" data-n="${n}" style="left:${p.x}%;top:${p.y}%;width:${p.scale}px;transform:${pcTf(p)};z-index:${n+1}">
      <img src="${src}" alt="">${UI.selPc===n?'<i class="rh" title="旋轉／縮放"></i>':''}</div>`;
  }).join('');
  bindDrag();
  const ct=document.getElementById('pcCtrl');
  if(UI.selPc!=null&&UI.canvas[UI.selPc]){
    const p=UI.canvas[UI.selPc];
    ct.style.display='block';
    document.getElementById('pcName').textContent=pieceName(p);
    document.getElementById('pcScale').value=p.scale;
    document.getElementById('pcRot').value=p.rot;
    document.getElementById('pcRotV').textContent=Math.round(p.rot)+'°';
  }else ct.style.display='none';
}
function bindDrag(){
  const c=document.getElementById('canvas');
  c.querySelectorAll('.pc').forEach(el=>{
    el.onpointerdown=e=>{
      if(e.target.classList.contains('rh'))return;
      e.preventDefault();
      const n=+el.dataset.n;
      if(UI.selPc!==n){UI.selPc=n;renderCanvas()}
      const box=c.getBoundingClientRect();
      const el2=c.querySelector(`.pc[data-n="${n}"]`);
      const move=ev=>{
        if(PINCH.on)return;
        const p=UI.canvas[n];
        p.x=Math.max(2,Math.min(98,((ev.clientX-box.left)/box.width)*100));
        p.y=Math.max(2,Math.min(98,((ev.clientY-box.top)/box.height)*100));
        el2.style.left=p.x+'%';el2.style.top=p.y+'%';
      };
      const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up)};
      document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
    };
  });
  // 右上角的把手：繞著中心拖動，同時旋轉和縮放
  const rh=c.querySelector('.pc.sel .rh');
  if(rh)rh.onpointerdown=e=>{
    e.preventDefault();e.stopPropagation();
    const n=UI.selPc,p=UI.canvas[n],el=rh.parentElement,r=el.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    const a0=Math.atan2(e.clientY-cy,e.clientX-cx),d0=Math.hypot(e.clientX-cx,e.clientY-cy),rot0=p.rot,sc0=p.scale;
    const move=ev=>{
      const a=Math.atan2(ev.clientY-cy,ev.clientX-cx),d=Math.hypot(ev.clientX-cx,ev.clientY-cy);
      p.rot=normDeg(rot0+(a-a0)*180/Math.PI);p.scale=Math.max(40,Math.min(480,sc0*d/Math.max(d0,1)));
      el.style.width=p.scale+'px';el.style.transform=pcTf(p);syncCtrl(p);
    };
    const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up)};
    document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
  };
  // 兩指：旋轉 + 縮放目前選到的那件
  if(!c._pinch){
    c._pinch=1;
    const pts=new Map();
    c.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){pts.set(e.pointerId,e);pinchStart()}});
    c.addEventListener('pointermove',e=>{if(pts.has(e.pointerId)){pts.set(e.pointerId,e);pinchMove()}});
    const end=e=>{pts.delete(e.pointerId);if(pts.size<2)PINCH.on=false};
    c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
    const pair=()=>{const [a,b]=[...pts.values()];return {ang:Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX),d:Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY)}};
    function pinchStart(){
      if(pts.size!==2||UI.selPc==null)return;
      const p=UI.canvas[UI.selPc],q=pair();Object.assign(PINCH,{on:true,a0:q.ang,d0:q.d,rot0:p.rot,sc0:p.scale});
    }
    function pinchMove(){
      if(!PINCH.on||pts.size!==2)return;
      const p=UI.canvas[UI.selPc];if(!p)return;const q=pair();
      p.rot=normDeg(PINCH.rot0+(q.ang-PINCH.a0)*180/Math.PI);p.scale=Math.max(40,Math.min(480,PINCH.sc0*q.d/Math.max(PINCH.d0,1)));
      const el=c.querySelector(`.pc[data-n="${UI.selPc}"]`);if(el){el.style.width=p.scale+'px';el.style.transform=pcTf(p)}
      syncCtrl(p);
    }
  }
}
const PINCH={on:false};
const normDeg=d=>{d=((d+180)%360+360)%360-180;return Math.round(d)};
function syncCtrl(p){
  const s=document.getElementById('pcScale'),r=document.getElementById('pcRot'),v=document.getElementById('pcRotV');
  if(s)s.value=p.scale;if(r)r.value=p.rot;if(v)v.textContent=Math.round(p.rot)+'°';
}
function turnPiece(d,flip,reset){
  const p=UI.canvas[UI.selPc];if(!p)return;
  if(reset)p.rot=0;else if(flip)p.flip=!p.flip;else p.rot=normDeg(p.rot+d);
  const el=document.querySelector(`.pc[data-n="${UI.selPc}"]`);if(el)el.style.transform=pcTf(p);
  syncCtrl(p);
}
function applyCtrl(){
  const p=UI.canvas[UI.selPc];if(!p)return;
  p.scale=+document.getElementById('pcScale').value;
  p.rot=+document.getElementById('pcRot').value;
  const el=document.querySelector(`.pc[data-n="${UI.selPc}"]`);

}
function layerPiece(d){

/* ============================================================
   8b. 搭配分析（會員功能）
   用穿著紀錄算：最常穿的 Look、最萬搭的單品、固定組合、每隻娃娃的最愛。
   ============================================================ */
const isMember=()=>!!S.settings.member;
function matchStats(){
  const items=S.items.filter(i=>i.category!=='套裝'),ok=new Set(items.map(i=>i.id));
  const partners={},wearN={},pair={};
  S.wears.forEach(w=>{
    const ids=[...new Set(w.itemIds)].filter(i=>ok.has(i));
    ids.forEach(a=>{wearN[a]=(wearN[a]||0)+1;partners[a]=partners[a]||new Set();ids.forEach(b=>{if(a!==b)partners[a].add(b)})});
    for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const k=[ids[i],ids[j]].sort().join('|');pair[k]=(pair[k]||0)+1}
  });
  const byId=id=>S.items.find(x=>x.id===id);
  const looks=S.looks.map(l=>({l,n:S.wears.filter(w=>w.lookId===l.id).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,3);
  const versatile=Object.entries(partners).map(([id,s])=>({it:byId(id),n:s.size,w:wearN[id]})).filter(x=>x.it&&x.n).sort((a,b)=>b.n-a.n||b.w-a.w).slice(0,5);
  const combos=Object.entries(pair).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,n])=>({ids:k.split('|'),n}));
  const fav=S.dolls.map(d=>{
    const ws=dollWears(d),cnt={};
    ws.forEach(w=>w.itemIds.forEach(i=>{if(ok.has(i))cnt[i]=(cnt[i]||0)+1}));
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    return top?{d,it:byId(top[0]),n:top[1]}:null;
  }).filter(Boolean);
  return {looks,versatile,combos,fav};
}
function renderMatch(){
  const el=document.getElementById('matchStats');if(el)el.innerHTML=matchSection();
}
function matchSection(){
  const head=`<h2 class="sec">搭配分析 <span class="vip">會員</span></h2>`;
  if(!isMember()){
    return head+`<div class="locked">
      <div class="lk-blur">
        <div class="rowitem"><div class="th"></div><div class="tx"><b>最萬搭：白色蕾絲襯衫</b><span>跟 12 件搭過</span></div></div>
        <div class="rowitem"><div class="th"></div><div class="tx"><b>最常穿：週末野餐</b><span>穿了 8 次</span></div></div>
        <div class="rowitem"><div class="th"></div><div class="tx"><b>固定組合：貝雷帽 × 吊帶裙</b><span>一起穿了 5 次</span></div></div>
      </div>
      <div class="lk-cover">
        <b>看看你的萬用王是哪件</b>
        <span>最萬搭的單品、最常穿的 Look、總是一起出場的組合，還有每隻娃娃最愛的那件</span>
        <button class="btn" onclick="openMember()">了解會員</button>
      </div></div>`;
  }
  if(S.wears.length<2)return head+'<div class="hint">再多記錄幾次穿搭，這裡就會開始出現分析。</div>';
  const m=matchStats(),th=it=>`<div class="th">${it&&img(it)?`<img src="${img(it)}" alt="">`:''}</div>`;
  const row=(it,b,s,on)=>`<div class="rowitem" ${on?`onclick="${on}"`:''}>${th(it)}<div class="tx"><b>${b}</b><span>${s}</span></div>${on?'<div class="rt">›</div>':''}</div>`;
  let h=head;

// 免費版：先挑一件主角，再挑同風格／同色系的其他部位；壓箱底加權
function ideaRandom(){
  const pool=ideaPool();if(pool.length<2){toast('合身的娃衣還太少');return}
  const tf=new Set(HOL_FAMS[IDEA.theme]||[]);
  const w=i=>1+(IDEA.press&&isPressed(i)?3:0)+(IDEA.theme?(i.holiday===IDEA.theme?8:0)+(i.colors||[]).filter(c=>tf.has(colorFam(c))).length*2:0);
  const pick=(list,base)=>{
    if(!list.length)return null;
    const sc=list.map(i=>{let s=w(i);if(base){
      const bs=new Set((base.styles||[]).map(x=>x.name)),bc=new Set((base.colors||[]).map(colorFam));
      s+=(i.styles||[]).filter(x=>bs.has(x.name)).length*2+(i.colors||[]).filter(c=>bc.has(colorFam(c))).length}
      return s});
    let t=Math.random()*sc.reduce((a,b)=>a+b,0);
    for(let k=0;k<list.length;k++){t-=sc[k];if(t<=0)return list[k]}
    return list[list.length-1];
  };
  const by=slot=>pool.filter(i=>slotOf(i.category)===slot);
  const dress=by('dress'),top=by('top'),bottom=by('bottom');
  const useDress=dress.length&&(!top.length||!bottom.length||Math.random()<.4);
  const base=useDress?pick(dress):pick(top.length?top:pool);
  const out=[base];
  const add=(slot,p)=>{if(Math.random()<p){const x=pick(by(slot).filter(i=>!out.includes(i)),base);if(x)out.push(x)}};
  if(!useDress&&slotOf(base.category)==='top')add('bottom',1);
  add('outer',.3);add('head',.6);add('socks',.3);add('shoes',.5);add('bag',.3);add('acc',.3);
  const styles=[...new Set(out.flatMap(i=>(i.styles||[]).map(x=>x.name)))].slice(0,2);
  const pressed=out.filter(isPressed);
  const hol=IDEA.theme?out.filter(i=>i.holiday===IDEA.theme).length:0;
  showIdea({ai:false,ids:out.map(i=>i.id),title:IDEA.theme?`${IDEA.theme}${sceneName()}搭配`:`${sceneName()}的${styles[0]||'日常'}搭配`,
    reason:`以「${base.name}」當主角${out.length>1?`，搭配${out.slice(1).map(i=>'「'+i.name+'」').join('、')}`:''}${styles.length?`，整體是${styles.join('、')}的感覺`:''}。${IDEA.theme?(hol?`用了 ${hol} 件${IDEA.theme}主題的娃衣。`:`衣櫃裡沒有${IDEA.theme}主題的娃衣，所以挑了${(HOL_FAMS[IDEA.theme]||[]).map(f=>famLabel[f]).join('、')}比較多的搭出節日感。`):''}${pressed.length?`其中 ${pressed.length} 件是壓箱底的，剛好讓它們出來透透氣。`:''}`,
    tip:SCENE_TIP[IDEA.scene]&&!IDEA.custom?SCENE_TIP[IDEA.scene]:''});
}
async function ideaAI(btn){
  if(!aiReady()){toast(aiMissing());return}
  const pool=ideaPool();if(pool.length<2){toast('合身的娃衣還太少');return}
  if(!needQuota('idea'))return;
  const old=btn.innerHTML;btn.innerHTML='<span class="spin"></span> 想一想…';btn.disabled=true;
  const d=S.dolls.find(x=>x.id===IDEA.dollId);
  const list=pool.slice(0,150).map(i=>`${i.id}|${i.name}|${i.category}|${(i.colors||[]).join('/')}|${(i.styles||[]).map(x=>x.name).join('/')}|${(i.motifs||[]).join('/')}|${isPressed(i)?'壓箱底':''}${i.holiday?'|'+i.holiday:''}`).join('\n');
  const prompt=`你是娃衣穿搭顧問。使用者要帶娃娃${d?`「${d.name}」`:''}去「${sceneName()}」拍照。
下面是衣櫃裡合身的娃衣，格式 id|名稱|類型|顏色|風格|圖案|是否壓箱底：
${list}

${IDEA.theme?`這次是「${IDEA.theme}」主題：有${IDEA.theme}主題的娃衣請優先用，沒有的話用${(HOL_FAMS[IDEA.theme]||[]).map(f=>famLabel[f]).join('、')}等節日配色搭出節日感。
`:''}請搭一套適合這個地點拍照的造型，只回傳 JSON，不要其他文字：
{"title":"10字內的造型名稱","itemIds":["只能用清單裡的id"],"reason":"60字內，說明為什麼適合這個地點","tip":"40字內的拍照小建議"}
規則：通常是 上衣+下身 或 洋裝，再視情況加帽子、外套、鞋子、配件，3到6件；不要同一個部位放兩件；${IDEA.press?'有標記「壓箱底」的請優先考慮，讓它們有機會出場；':''}每次給不一樣的組合。`;
  try{
    const r=parseJSON(await callAI('idea',prompt));
    const ids=(r.itemIds||[]).filter(i=>pool.some(x=>x.id===i));
    if(!ids.length)throw new Error('AI 沒有給出衣櫃裡的娃衣，再試一次');
    spendQuota('idea');
    showIdea({ai:true,ids,title:r.title||sceneName()+'造型',reason:r.reason||'',tip:r.tip||''});
  }catch(e){toast('建議失敗：'+e.message)}
  btn.innerHTML=old;btn.disabled=false;
}

// 主圖：穿搭照，或照畫布位置擺的平鋪貼圖；Look 可以把娃娃放在左邊
async function scArt(x,T,AX,AY,AW,AH,R,noShadow){
  if(!noShadow){x.save();x.shadowColor='rgba(0,0,0,.12)';x.shadowBlur=40;x.shadowOffsetY=14;x.fillStyle=T.card;rrect(x,AX,AY,AW,AH,R);x.fill();x.restore()}

  if(SC.photo){
    const im=await loadImg(SC.photo),s=Math.max(AW/im.width,AH/im.height);
    x.drawImage(im,AX+(AW-im.width*s)/2,AY+(AH-im.height*s)/2,im.width*s,im.height*s);
  }else{
    x.fillStyle=T.line;for(let yy=AY+24;yy<AY+AH;yy+=36)for(let xx=AX+24;xx<AX+AW;xx+=36){x.beginPath();x.arc(xx,yy,2.2,0,7);x.fill()}
    let IX=AX,IW=AW;
    const dim=SC.withDoll&&SC.doll&&SC.doll.photo?await loadImg(SC.doll.photo).catch(()=>null):null;
    if(dim){
      // 娃娃站在左邊，衣服擺在右邊
      const dw=AW*.38,s=Math.min(dw*.92/dim.width,AH*.8/dim.height);
      x.save();x.shadowColor='rgba(0,0,0,.18)';x.shadowBlur=26;x.shadowOffsetY=12;
      x.drawImage(dim,AX+(dw-dim.width*s)/2+10,AY+AH*.94-dim.height*s,dim.width*s,dim.height*s);x.restore();
      x.fillStyle=T.soft;x.globalAlpha=.6;x.beginPath();x.ellipse(AX+dw/2+10,AY+AH*.94,dw*.36,14,0,0,7);x.fill();x.globalAlpha=1;
      IX=AX+dw;IW=AW-dw;
    }
    const ims=await Promise.all(SC.items.map(i=>loadImg(img(i)).catch(()=>null)));
    x.shadowColor='rgba(0,0,0,.14)';x.shadowBlur=24;x.shadowOffsetY=10;
    if(SC.layout&&SC.layout.length){
      let rw=IW,rh=IW*4/3;if(rh>AH){rh=AH;rw=AH*3/4}
      const rx=IX+(IW-rw)/2,ry=AY+(AH-rh)/2,k=rw/SC.cw;
      const dollIms={};
      for(const p of SC.layout)if(p.dollId&&!dollIms[p.dollId]){const d=S.dolls.find(x=>x.id===p.dollId);dollIms[p.dollId]=d&&d.photo?await loadImg(d.photo).catch(()=>null):null}
      SC.layout.forEach(p=>{
        const im=p.dollId?dollIms[p.dollId]:ims[SC.items.findIndex(i=>i.id===p.itemId)];if(!im)return;
        const w=p.scale*k,h=w*im.height/im.width;
        x.save();x.translate(rx+p.x/100*rw,ry+p.y/100*rh);x.rotate(p.rot*Math.PI/180);if(p.flip)x.scale(-1,1);x.drawImage(im,-w/2,-h/2,w,h);x.restore();
      });
    }else{
      const n=Math.min(ims.length,9),cols=n<=1?1:n<=4?2:3,rows=Math.ceil(n/cols),cwid=IW/cols,chei=AH/rows;
      ims.slice(0,n).forEach((im,i)=>{if(!im)return;
        const cx=IX+cwid*(i%cols+.5),cy=AY+chei*(Math.floor(i/cols)+.5),s=Math.min(cwid/im.width,chei/im.height)*.78;
        x.save();x.translate(cx,cy);x.rotate(((i*37)%9-4)*Math.PI/180);x.drawImage(im,-im.width*s/2,-im.height*s/2,im.width*s,im.height*s);x.restore();
      });
    }
  }
  x.restore();
}

function scPills(x,T,X,Y,maxW,sans,lines){

async function scPolaroid(x,T,W,H,P,serif,num,sans){
  const d=new Date(SC.date+'T00:00:00');
  const FW=W-200,FX=100,aw=FW-64,ah=SC.ratio==='story'?aw*1.35:aw*.92,FH=32+ah+170,FY=Math.max(110,(H-150-(FH+120))/2);
  x.save();x.translate(W/2,FY+FH/2);x.rotate(-2*Math.PI/180);x.translate(-W/2,-(FY+FH/2));
  x.save();x.shadowColor='rgba(0,0,0,.18)';x.shadowBlur=40;x.shadowOffsetY=18;x.fillStyle='#FFFEFB';x.fillRect(FX,FY,FW,FH);x.restore();
  await scArt(x,Object.assign({},T,SC.theme==='night'?{card:'#F4EEEA',line:'#E6DCD4',soft:'#EADCD9'}:{}),FX+32,FY+32,aw,ah,6,true);
  x.fillStyle='#3A2E33';x.font=`600 54px ${serif}`;x.fillText(fitText(x,SC.title,FW-280),FX+40,FY+32+ah+92);
  x.textAlign='right';x.fillStyle='#8C7F85';x.font=`600 40px ${num}`;x.fillText(`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`,FX+FW-40,FY+32+ah+88);x.textAlign='left';
  if(SC.cap){x.fillStyle='#6B5A66';x.font=`500 30px ${serif}`;x.fillText(fitText(x,'「'+SC.cap+'」',FW-80),FX+40,FY+32+ah+140)}
  x.restore();
  // 紙膠帶
  x.save();x.translate(W/2,FY+6);x.rotate(3*Math.PI/180);x.fillStyle=T.accent;x.globalAlpha=.28;x.fillRect(-110,-26,220,52);x.restore();
  scPills(x,T,P,FY+FH+60,W-P*2,sans,SC.ratio==='story'?3:1);
  await scFooter(x,T,P,W,H-P,serif,sans);
}
// 雜誌：大標題刊頭 + 滿版主圖 + 編號清單
async function scMag(x,T,W,H,P,serif,num,sans){
  const d=new Date(SC.date+'T00:00:00');
  x.fillStyle=T.accent;x.font=`600 28px ${num}`;x.letterSpacing='10px';x.fillText('DOLL  WARDROBE',P,P+26);
  x.textAlign='right';x.fillStyle=T.sub;x.fillText(`NO.${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`,W-P,P+26);x.letterSpacing='0px';x.textAlign='left';
  x.fillStyle=T.ink;x.font=`700 96px ${serif}`;x.fillText(fitText(x,SC.title,W-P*2),P,P+140);
  x.fillStyle=T.ink;x.fillRect(P,P+172,W-P*2,3);
  const n=Math.min(SC.items.length,SC.ratio==='story'?10:6),rows=Math.ceil(n/2);
  const listH=rows*56+(SC.cap?80:0)+130;
  const AY=P+200,AH=H-AY-listH-P;
  await scArt(x,T,0,AY,W,AH,0,true);
  let y=AY+AH+64;
  SC.items.slice(0,n).forEach((it,i)=>{
    const cx=P+(i%2)*((W-P*2)/2),cy=y+Math.floor(i/2)*56;
    x.fillStyle=T.accent;x.font=`700 34px ${num}`;x.fillText(String(i+1).padStart(2,'0'),cx,cy);
    x.fillStyle=T.ink;x.font=`500 28px ${sans}`;x.fillText(fitText(x,it.name,(W-P*2)/2-80),cx+60,cy);
  });
  y+=rows*56+10;
  if(SC.cap){x.fillStyle=T.ink;x.font=`500 36px ${serif}`;x.fillText(fitText(x,'「'+SC.cap+'」',W-P*2),P,y+30)}
  await scFooter(x,T,P,W,H-P,serif,sans);
}
async function scDraw(){
  const T=CARD_THEMES[SC.theme],W=1080,H=SC.ratio==='story'?1920:1350,P=72;
  try{await document.fonts.ready}catch(e){}
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const serif='"Noto Serif TC","Songti TC",serif',num='"Cormorant Garamond","Noto Serif TC",serif',sans=getComputedStyle(document.body).fontFamily;
  // 背景
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,T.bg[0]);g.addColorStop(1,T.bg[1]);x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle=T.soft;x.globalAlpha=.55;x.beginPath();x.arc(W-60,120,220,0,7);x.fill();x.beginPath();x.arc(40,H-160,180,0,7);x.fill();x.globalAlpha=1;
  x.textBaseline='alphabetic';
  if(SC.ann){await scAnn(x,T,W,H,P,serif,num,sans);return c}
  if(SC.lay==='polaroid'){await scPolaroid(x,T,W,H,P,serif,num,sans);return c}
  if(SC.lay==='mag'){await scMag(x,T,W,H,P,serif,num,sans);return c}
  // 標題列
  const d=new Date(SC.date+'T00:00:00');
  x.textBaseline='alphabetic';
  x.fillStyle=T.accent;x.font=`600 30px ${num}`;
  x.letterSpacing='6px';x.fillText(SC.photo?'DAILY LOOK':'OUTFIT NOTE',P,P+30);x.letterSpacing='0px';
  x.fillStyle=T.ink;x.font=`700 76px ${serif}`;x.fillText(fitText(x,SC.title,W-P*2-260),P,P+124);
  x.textAlign='right';x.font=`600 64px ${num}`;x.fillText(`${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}`,W-P,P+110);
  x.fillStyle=T.sub;x.font=`600 26px ${num}`;x.letterSpacing='4px';x.fillText(`${d.getFullYear()}  ${WEEK[d.getDay()]}`,W-P,P+30);x.letterSpacing='0px';
  x.textAlign='left';
  // 下方資訊區的高度
  const showRow=!!SC.photo&&SC.items.length;
  const infoH=(showRow?280:120)+(SC.cap?90:0)+70;
  const AX=P,AY=P+170,AW=W-P*2,AH=H-AY-infoH-P;
  await scArt(x,T,AX,AY,AW,AH,44);
  // 下方資訊
  let y=AY+AH+48;
  if(showRow){
    const n=Math.min(SC.items.length,5),gap=20,sz=(AW-gap*4)/5;
    const ims=await Promise.all(SC.items.slice(0,n).map(i=>loadImg(img(i)).catch(()=>null)));
    ims.forEach((im,i)=>{
      const bx=AX+i*(sz+gap);
      x.fillStyle=T.card;rrect(x,bx,y,sz,sz,28);x.fill();
      if(im){const s=Math.min(sz/im.width,sz/im.height)*.8;x.drawImage(im,bx+(sz-im.width*s)/2,y+(sz-im.height*s)/2,im.width*s,im.height*s)}
      x.fillStyle=T.ink;x.font=`500 24px ${sans}`;x.textAlign='center';
      x.fillText(fitText(x,SC.items[i].name,sz),bx+sz/2,y+sz+36);x.textAlign='left';
    });
    y+=sz+120;
  }else{
    y=scPills(x,T,AX,y,AW,sans,2)+40;
  }
  if(SC.cap){
    x.fillStyle=T.ink;x.font=`500 38px ${serif}`;
    x.fillText(fitText(x,'「'+SC.cap+'」',AW),AX,y);y+=70;
  }
  await scFooter(x,T,P,W,H-P,serif,sans);
  return c;
}
async function scRender(){
  const spin=document.getElementById('scSpin');if(spin)spin.style.display='';
  const c=await scDraw();SC.canvas=c;
  const im=document.getElementById('scImg');if(im)im.src=c.toDataURL('image/png');
  if(spin)spin.style.display='none';
}
function scBlob(){return new Promise(r=>SC.canvas.toBlob(r,'image/png'))}
async function scDownload(){
  if(!SC.canvas)return;
  const a=document.createElement('a');a.href=URL.createObjectURL(await scBlob());
  a.download=`娃衣小卡-${SC.date}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('圖片已下載');
}
async function scShare(){
  if(!SC.canvas)return;
  const f=new File([await scBlob()],`娃衣小卡-${SC.date}.png`,{type:'image/png'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:SC.title});
    else scDownload();
  }catch(e){if(e.name!=='AbortError')scDownload()}
}

   10. 衣櫃洞察

function renderInsight(){
  const el=document.getElementById('insight');
  const items=S.items.filter(i=>i.category!=='套裝');
  if(items.length<3){
    el.innerHTML='<div class="empty"><strong>還需要更多資料</strong>建檔幾件娃衣、記錄幾次穿搭之後，這裡會開始回答「我到底有什麼、真正常穿什麼」</div>'+spendSection();
    return;
  }
  const buyGroup={},wearGroup={};
  items.forEach(i=>{
    const k=i.category;
    buyGroup[k]=(buyGroup[k]||0)+1;
    wearGroup[k]=(wearGroup[k]||0)+wearCount(i.id);
  });
  const buyTop=Object.entries(buyGroup).sort((a,b)=>b[1]-a[1]);
  const wearTop=Object.entries(wearGroup).sort((a,b)=>b[1]-a[1]);
  const never=items.filter(i=>wearCount(i.id)===0);
  const cold=items.filter(i=>{const l=lastWear(i.id);return !i.keepsake&&(!l||days(l)>180)});
  const totalWears=S.wears.length;

  // 飽和度：同類型 >=4 件且半年未用比例 >=60%
  const sat=buyTop.filter(([k,n])=>{
    if(n<4)return false;
    const g=items.filter(i=>i.category===k);
    const idle=g.filter(i=>{const l=lastWear(i.id);return !l||days(l)>180}).length;
    return idle/n>=.6;
  });
  // 真正的偏好：最常穿的前 5 件的共同標籤
  const ranked=items.map(i=>({i,c:wearCount(i.id)})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,5);
  const tally={};
  ranked.forEach(({i})=>{[...(i.colors||[]),...(i.motifs||[]),...(i.styles||[]).map(s=>s.name)].forEach(t=>tally[t]=(tally[t]||0)+1)});
  const traits=Object.entries(tally).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([t])=>t);

  let h=`
  <div class="stat">
    <div><b>${S.sets.length}</b><span>套裝</span></div>
    <div><b>${items.length}</b><span>單品</span></div>
    <div><b>${totalWears}</b><span>穿搭紀錄</span></div>
    <div><b>${items.length?Math.round((items.length-never.length)/items.length*100):0}%</b><span>衣櫃使用率</span></div>
  </div>`;

  if(buyTop.length&&wearTop[0]&&wearTop[0][1]>0&&buyTop[0][0]!==wearTop[0][0]){
    h+=`<div class="note">你買最多的是<strong>${esc(buyTop[0][0])}</strong>（${buyTop[0][1]} 件），但真正最常穿的是<strong>${esc(wearTop[0][0])}</strong>。喜歡買的，不一定等於喜歡穿的。</div>`;
  }
  if(traits.length){
    h+=`<div class="note">你最常穿的那幾件，共同點是：<strong>${traits.map(esc).join('、')}</strong>。下次挑娃衣時可以拿這個當參考。</div>`;
  }

  // 最常穿的單品
  const topWorn=items.map(i=>({i,c:wearCount(i.id)})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,8);
  if(topWorn.length){
    h+=`<h2 class="sec">最常穿的娃衣</h2>
    <div class="hscroll">${topWorn.map((x,k)=>`<button class="piece" onclick="openItem('${x.i.id}')">
      <div class="sw"><img src="${img(x.i)}" alt=""><span class="tag">${k===0?'👑 ':''}${x.c} 次</span></div>
      <div class="nm">${esc(x.i.name)}</div></button>`).join('')}</div>`;
  }
  // 娃娃出場排行
  const dollRank=S.dolls.map(d=>({d,n:dollWears(d).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  if(dollRank.length){
    const dm=dollRank[0].n;
    h+=`<h2 class="sec">娃娃出場排行</h2>`+dollRank.slice(0,6).map(x=>`<div class="bar"><div class="lb"><span>${esc(x.d.name)}</span><em>${x.n} 次</em></div>
      <div class="track"><i class="worn" style="width:${x.n/dm*100}%"></i></div></div>`).join('');
  }
  // 衣櫃色彩
  const fam={};
  items.forEach(i=>new Set((i.colors||[]).map(colorFam)).forEach(f=>{if(famLabel[f])fam[f]=(fam[f]||0)+1}));
  const famTop=Object.entries(fam).sort((a,b)=>b[1]-a[1]);
  if(famTop.length){
    h+=`<h2 class="sec">衣櫃色彩</h2>
    <div class="cfam">${famTop.map(([f,n])=>`<span><i style="background:${FAM_HEX[f]}"></i>${famLabel[f]}<b>${n}</b></span>`).join('')}</div>
    <p class="hint" style="margin:6px 0 0">${famTop.length>=3?`最多的是${famLabel[famTop[0][0]]}，${famTop.length<=4?'色系滿集中的':'顏色分佈很豐富'}。`:''}${['紅','橘','黃','綠','藍','紫','粉'].filter(f=>!fam[f]).slice(0,2).map(f=>famLabel[f]).join('、')?`還沒有${['紅','橘','黃','綠','藍','紫','粉'].filter(f=>!fam[f]).slice(0,2).map(f=>famLabel[f]).join('、')}的娃衣。`:''}</p>`;
  }

  h+=`<h2 class="sec">買了多少，穿了多少</h2>
  <div class="legend"><s>有穿過</s><s class="b">還沒穿</s></div>`;
  buyTop.slice(0,8).forEach(([k,n])=>{
    const g=items.filter(i=>i.category===k);
    const worn=g.filter(i=>wearCount(i.id)>0).length;
    h+=`<div class="bar"><div class="lb"><span>${esc(k)}</span><em>${worn} / ${n} 件穿過</em></div>
      <div class="track"><i class="worn" style="width:${worn/n*100}%"></i><i class="idle" style="width:${(n-worn)/n*100}%"></i></div></div>`;
  });

  if(sat.length){
    h+=`<h2 class="sec">已經很飽和的類型</h2>`;
    sat.forEach(([k,n])=>{
      const g=items.filter(i=>i.category===k);
      const idle=g.filter(i=>{const l=lastWear(i.id);return !l||days(l)>180}).length;
      h+=`<div class="note"><strong>${esc(k)}</strong>　共 ${n} 件，其中 ${idle} 件半年以上沒穿。想再買同類型之前，也許先翻翻這些。</div>`;
    });
  }

  if(cold.length){
    h+=`<h2 class="sec">最近被冷落的 ${cold.length} 件</h2>
      <div class="hint" style="margin-bottom:8px">標記為收藏／紀念品的不會出現在這裡。</div>`;
    h+=cold.slice(0,12).map(i=>{
      const l=lastWear(i.id);
      return `<div class="rowitem" onclick="openItem('${i.id}')">
        <div class="th"><img src="${img(i)}" alt=""></div>
        <div class="tx"><b>${esc(i.name)}</b><span>${esc(i.category)}</span></div>
        <div class="rt">${l?days(l)+' 天沒穿':'從未穿過'}</div></div>`;
    }).join('');
  }

  const dispose=cold.filter(i=>{
    const same=items.filter(x=>x.category===i.category).length;
    return same>=4&&wearCount(i.id)<=1;
  });
  if(dispose.length){
    h+=`<h2 class="sec">可以考慮整理</h2>
      <div class="hint" style="margin-bottom:8px">這只是資訊，不是建議你賣掉。覺得重要就標記成紀念品，之後就不會再出現。</div>`;
    h+=dispose.slice(0,8).map(i=>`<div class="rowitem" onclick="openItem('${i.id}')">
      <div class="th"><img src="${img(i)}" alt=""></div>
      <div class="tx"><b>${esc(i.name)}</b><span>同類型還有 ${items.filter(x=>x.category===i.category).length-1} 件・穿過 ${wearCount(i.id)} 次</span></div>
      <div class="rt">›</div></div>`).join('');
  }
  el.innerHTML=h+matchSection()+dollStyleSection()+habitSection(items)+spendSection();
  const c=document.getElementById('mcap');if(c)c.dataset.d=c.innerHTML;
}
const FAM_HEX={'粉':'#F2A7BC','紅':'#D9534F','橘':'#F0A04B','黃':'#F2D14B','綠':'#7FB77E','藍':'#6C9BD2','紫':'#A98BC9','米':'#E8D8BE','棕':'#9C7456','白':'#FFFFFF','黑':'#2B2B2B','灰':'#A7A7A7'};
// 每隻娃娃的穿搭輪廓：穿過哪些類型、風格、顏色（用穿搭紀錄算）
function dollProfile(d){
  const ws=dollWears(d),cat={},sty={},fam={},seen=new Set();
  ws.forEach(w=>w.itemIds.forEach(id=>{
    const i=anyItem(id);if(!i||i.category==='套裝')return;
    cat[i.category]=(cat[i.category]||0)+1;
    (i.styles||[]).forEach(x=>sty[x.name]=(sty[x.name]||0)+1);
    new Set((i.colors||[]).map(colorFam)).forEach(f=>{if(famLabel[f])fam[f]=(fam[f]||0)+1});
    seen.add(id);
  }));
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
  return {d,wears:ws.length,outs:outCount(d),items:seen.size,cats:top(cat),styles:top(sty),fams:top(fam),total:Object.values(cat).reduce((a,b)=>a+b,0)};
}

  let h=head+`<p class="mh">最常在星期${WK[top]}換裝・週末佔 ${wkend}%</p>
    <div class="wkbars">${wd.map((n,i)=>`<div><b><em>${n||''}</em><i style="height:${n?Math.max(6,n/wmax*100):0}%"></i></b><span>${WK[i]}</span></div>`).join('')}</div>`;
  const now=new Date(),mon=[];
  for(let k=5;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');mon.push({m:d.getMonth()+1,n:S.wears.filter(w=>w.date.startsWith(key)).length})}
  const mmax=Math.max(...mon.map(x=>x.n),1),diff=mon[5].n-mon[4].n;
  h+=`<p class="mh">最近 6 個月・這個月${diff>0?`比上個月多 ${diff} 次`:diff<0?`比上個月少 ${-diff} 次`:'跟上個月一樣'}</p>
    <div class="wkbars">${mon.map(x=>`<div><b><em>${x.n||''}</em><i style="height:${x.n?Math.max(6,x.n/mmax*100):0}%"></i></b><span>${x.m}月</span></div>`).join('')}</div>`;
  // 風格變化：最近 90 天建檔的 vs 之前
  const cut=Date.now()-90*864e5,recent=items.filter(i=>(i.createdAt||0)>=cut),old=items.filter(i=>(i.createdAt||0)<cut);
  const styleShare=list=>{const t={};list.forEach(i=>(i.styles||[]).forEach(x=>t[x.name]=(t[x.name]||0)+1));const n=list.length||1;return Object.fromEntries(Object.entries(t).map(([k,v])=>[k,v/n]))};
  if(recent.length>=3&&old.length>=3){
    const a=styleShare(recent),b=styleShare(old);
    const up=Object.keys(a).map(k=>({k,d:a[k]-(b[k]||0)})).filter(x=>x.d>.15).sort((x,y)=>y.d-x.d).slice(0,3);
    const down=Object.keys(b).map(k=>({k,d:b[k]-(a[k]||0)})).filter(x=>x.d>.15).sort((x,y)=>y.d-x.d).slice(0,2);
    if(up.length||down.length)h+=`<div class="note">最近 3 個月${up.length?`越來越常買<strong>${up.map(x=>esc(x.k)).join('、')}</strong>`:''}${up.length&&down.length?'，':''}${down.length?`比較少買<strong>${down.map(x=>esc(x.k)).join('、')}</strong>`:''}。</div>`;
  }
  return h;
}

const BUY={};

// 縮小成 JPEG 送給 AI，透明背景鋪白
function thumb(src,max){
  return loadImg(src).then(im=>{
    const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',.82);
  });
}
async function callAIImgs(task,prompt,imgs){
  const content=[...imgs.map(u=>({type:'image_url',image_url:{url:u}})),{type:'text',text:prompt}];
  return aiText(await aiChat(task,content));
}
// 本機比對：類型、顏色、風格、圖案重疊越多分數越高
function buyScore(t,i){
  let s=0;
  if(t.category!=='套裝'){
    if(i.category===t.category)s+=4;else if(slotOf(i.category)&&slotOf(i.category)===slotOf(t.category))s+=2;
  }
  const tc=new Set(t.colors.map(colorFam));
  s+=Math.min(4,(i.colors||[]).filter(c=>tc.has(colorFam(c))).length*2);
  const ts=new Set(t.styles.map(x=>x.name));
  s+=(i.styles||[]).filter(x=>ts.has(x.name)).length*1.5;
  const tm=new Set(t.motifs);
  s+=(i.motifs||[]).filter(m=>tm.has(m)).length*2;
  return s;
}
async function runBuy(file){

    BUY.t=t;BUY.wishId=null;

}
async function buyCompare(){
  const t=BUY.t;
  const pool=S.items.filter(i=>i.category!=='套裝'||t.isSet);
  const cands=pool.map(i=>({i,s:buyScore(t,i)})).filter(x=>x.s>=3&&img(x.i)).sort((a,b)=>b.s-a.s).slice(0,8);
  let verdict=[];
  if(cands.length){
    buyStep(`跟衣櫃裡最像的 ${cands.length} 件比對中…`);
    const imgs=[await thumb(BUY.photo,512),...await Promise.all(cands.map(x=>thumb(img(x.i),320)))];
    const prompt=`第 1 張是使用者想買的娃衣，後面第 2 到第 ${cands.length+1} 張是使用者衣櫃裡已經有的（編號 1 到 ${cands.length}）。
逐一比較想買的這件跟每一件，只回傳 JSON 陣列，不要其他文字：
[{"n":編號,"level":"same 或 recolor 或 similar 或 different","reason":"15字內的中文理由"}]
level 定義：
same：幾乎是同一件（同款式、同顏色）
recolor：同款式或同設計，但顏色不同
similar：款式不同，但風格、元素或配色很像
different：沒什麼關係`;
    try{
      const out=parseJSON(await callAIImgs('buy',prompt,imgs));
      verdict=(Array.isArray(out)?out:[]).map(v=>({...v,it:cands[(+v.n)-1]?.i})).filter(v=>v.it);
    }catch(e){toast('圖片比對失敗，先只顯示標籤統計')}
  }
  BUY.verdict=verdict;BUY.cands=cands;
  renderBuy();
}

  else if(similar.length)msg='沒有一樣的，但有幾件風格很接近，可以想想這件能不能帶來新的搭配。';

    <div id="buyWish">${BUY.wishId?`<div class="note" style="margin-top:18px">這件已經在考慮中清單裡。</div>`:''}</div>

// 這件適合給哪隻娃娃：跟每隻娃娃平常穿的類型、風格、顏色比對（在手機上算，不用 AI）
function buyDollFit(t){
  if(!S.dolls.length||t.category==='套裝'&&!t.styles.length)return '';
  const head=`<h2 class="sec">適合給哪隻娃娃 <span class="vip">會員</span></h2>`;
  if(!isMember())return head+`<div class="locked"><div class="lk-blur"><div class="rowitem"><div class="th"></div><div class="tx"><b>最適合：小白</b><span>常穿甜系、粉色系</span></div></div></div>
    <div class="lk-cover"><b>這件買給誰最適合？</b><span>依每隻娃娃平常穿的風格和顏色推薦</span><button class="btn" onclick="openMember()">了解會員</button></div></div>`;
  const tf=new Set(t.colors.map(colorFam)),ts=new Set(t.styles.map(x=>x.name));
  const rows=S.dolls.map(dollProfile).map(p=>{
    if(p.wears<2)return {p,score:-1,why:['穿搭紀錄還不夠，先多記幾次']};
    let score=0;const why=[];
    const sHit=p.styles.filter(([k])=>ts.has(k));
    if(sHit.length){score+=sHit.reduce((a,[,n])=>a+n,0)/p.total*6;why.push(`常穿${sHit.slice(0,2).map(([k])=>k).join('、')}`)}
    const fHit=p.fams.filter(([f])=>tf.has(f));
    if(fHit.length){score+=fHit.reduce((a,[,n])=>a+n,0)/p.total*4;why.push(`${fHit.slice(0,2).map(([f])=>famLabel[f]).join('、')}穿過 ${fHit.reduce((a,[,n])=>a+n,0)} 次`)}
    const c=p.cats.find(([k])=>k===t.category);
    if(c){score+=c[1]/p.total*3;why.push(`常穿${t.category}`)}
    else if(t.category!=='套裝'&&p.total>=4)why.push(`很少穿${t.category}`);
    if(!sHit.length&&!fHit.length)why.push('風格和平常不太一樣，可以當新嘗試');
    return {p,score,why};
  }).sort((a,b)=>b.score-a.score);
  const best=rows[0];
  const note=best&&best.score>0.8?`看起來最適合 <strong>${esc(best.p.d.name)}</strong>。`:rows.some(r=>r.score>=0)?'跟每隻娃娃平常的風格都不太一樣，可能會變成新風格。':'';
  return head+(note?`<div class="note">${note}</div>`:'')+`<div class="blist">${rows.slice(0,4).map((r,i)=>`<div class="rowitem" onclick="openDoll('${r.p.d.id}')">
    <div class="th">${r.p.d.photo?`<img src="${r.p.d.photo}" alt="">`:''}</div>
    <div class="tx"><b>${i===0&&r.score>0.8?'👑 ':''}${esc(r.p.d.name)}${r.p.d.size?`<small style="color:var(--muted);font-weight:400">　${esc(r.p.d.size)}</small>`:''}</b><span>${r.why.map(esc).join('・')}</span></div>
    ${r.score>=0?`<div class="rt">${r.score>2.5?'很適合':r.score>0.8?'適合':'普通'}</div>`:''}</div>`).join('')}</div>
    <p class="hint" style="margin:6px 0 0">依穿搭紀錄計算；尺寸請在建檔時再確認。</p>`;
}

/* ============================================================
   10b. 花費分析（會員功能）
   ============================================================ */
const money=v=>+String(v??'').replace(/[^\d.]/g,'')||0;
const fmt$=n=>'$'+Math.round(n).toLocaleString();
function spendStats(){
  const pi=S.items.filter(i=>money(i.price)>0);
  const clothes=pi.reduce((a,i)=>a+money(i.price),0);
  const dolls=S.dolls.reduce((a,d)=>a+money(d.price),0);
  const saved=S.wish.filter(w=>w.status==='skip').reduce((a,w)=>a+money(w.price),0);
  // 最近 12 個月，娃衣看購入日期（沒填就用建檔日），娃娃看到家日
  const now=new Date(),months=[];
  for(let k=11;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,m:d.getMonth()+1,v:0})}
  const add=(date,v)=>{const b=months.find(x=>x.key===(date||'').slice(0,7));if(b)b.v+=v};
  const ds=t=>t?new Date(t).toISOString().slice(0,10):'';
  pi.forEach(i=>add(i.buyDate||ds(i.createdAt),money(i.price)));
  S.dolls.forEach(d=>{if(money(d.price))add(d.home||ds(d.createdAt),money(d.price))});
  // 平均每穿一次的成本（套裝本身不算，穿搭紀錄記的是單品）
  const cpw=pi.filter(i=>i.category!=='套裝').map(i=>{const w=wearCount(i.id);return {it:i,p:money(i.price),w,c:money(i.price)/Math.max(w,1)}});
  const worn=cpw.filter(x=>x.w>0),wornSum=worn.reduce((a,x)=>a+x.p,0),wornN=worn.reduce((a,x)=>a+x.w,0);
  const byCat={};pi.filter(i=>i.category!=='套裝').forEach(i=>byCat[i.category]=(byCat[i.category]||0)+money(i.price));
  return {clothes,dolls,saved,months,priced:pi.length,
    avg:wornN?wornSum/wornN:0,
    best:worn.sort((a,b)=>a.c-b.c).slice(0,3),
    idle:cpw.filter(x=>x.w===0).sort((a,b)=>b.p-a.p).slice(0,3),
    cats:Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,5)};
}
// 回血：賣掉的娃衣收回多少錢（買價算整套那一筆，一起移進來的單品不重複算）
function soldStats(){
  const sold=S.memory.filter(i=>i.reason==='賣掉了'&&!i.groupOf);
  const back=sold.reduce((a,i)=>a+money(i.soldPrice),0);
  const withBoth=sold.filter(i=>money(i.price)>0&&money(i.soldPrice)>0);
  const cost=withBoth.reduce((a,i)=>a+money(i.price),0),got=withBoth.reduce((a,i)=>a+money(i.soldPrice),0);
  const spentAll=[...S.items,...S.memory].filter(i=>!i.groupOf).reduce((a,i)=>a+money(i.price),0);
  const y=today().slice(0,4),yearBack=sold.filter(i=>(i.archivedAt||'').startsWith(y)).reduce((a,i)=>a+money(i.soldPrice),0);
  return {n:sold.length,back,yearBack,rate:cost?got/cost:0,spentAll,net:spentAll-back,
    list:sold.filter(i=>money(i.soldPrice)>0).sort((a,b)=>(b.archivedAt||'').localeCompare(a.archivedAt||'')).slice(0,5)};
}
function soldSection(){
  const r=soldStats();if(!r.n)return `<p class="mh">賣出回血</p><div class="hint">賣掉的娃衣移到回憶箱時填上賣出價格，這裡會算回收了多少。</div>`;
  const th=it=>`<div class="th">${img(it)?`<img src="${img(it)}" alt="">`:''}</div>`;
  return `<p class="mh">賣出回血</p>
  <div class="stat">
    <div><b>${fmt$(r.back)}</b><span>賣出回收・${r.n} 筆</span></div>
    <div><b>${r.rate?Math.round(r.rate*100)+'%':'—'}</b><span>平均回收買價</span></div>
    <div><b>${fmt$(r.yearBack)}</b><span>今年回收</span></div>
    <div><b>${fmt$(Math.max(0,r.net))}</b><span>扣掉回血的淨花費</span></div></div>
  ${r.list.length?`<div class="blist">${r.list.map(i=>{const p=money(i.price),sp=money(i.soldPrice);return `<div class="rowitem" onclick="go('memory')">${th(i)}
    <div class="tx"><b>${esc(i.name)}</b><span>${p?`買 ${fmt$(p)} → `:''}賣 ${fmt$(sp)}${p?`・回收 ${Math.round(sp/p*100)}%`:''}・${esc(i.archivedAt||'')}</span></div><div class="rt">›</div></div>`}).join('')}</div>`:''}`;
}
function spendSection(){
  const head=`<h2 class="sec">花費分析 <span class="vip">會員</span></h2>`;
  if(!isMember())return head+`<div class="locked">
    <div class="lk-blur">

    </div>

      <span>每月花費、平均每穿一次的成本、最划算和買了還沒穿的娃衣，還有賣掉娃衣回血多少</span>
      <button class="btn" onclick="openMember()">了解會員</button></div></div>`;
  const s=spendStats(),max=Math.max(...s.months.map(m=>m.v),1),tot=s.months.reduce((a,m)=>a+m.v,0);
  if(!s.priced&&!s.dolls&&!soldStats().n)return head+`<div class="hint">在單品的「編輯」填上價格，或在娃娃資料填金額，這裡就會開始計算。</div>`;
  const peak=s.months.reduce((a,m)=>m.v>a.v?m:a,s.months[0]);
  let h=head+`<div class="stat">
    <div><b>${fmt$(s.clothes)}</b><span>娃衣花費・${s.priced} 件有價格</span></div>
    <div><b>${fmt$(s.dolls)}</b><span>娃娃花費</span></div>
    <div><b>${s.avg?fmt$(s.avg):'—'}</b><span>平均每穿一次</span></div>
    <div><b>${fmt$(s.saved)}</b><span>忍住沒買省下</span></div></div>
  <div class="mchart">
    <div class="mcap" id="mcap">最近 12 個月共 <b>${fmt$(tot)}</b></div>
    <div class="mbars">${s.months.map(m=>`<button class="mcol" data-t="${m.m} 月：${fmt$(m.v)}" aria-label="${m.m} 月花費 ${fmt$(m.v)}"
      onmouseenter="mcap(this)" onfocus="mcap(this)" onclick="mcap(this)" onmouseleave="mcap()">
      <i style="height:${m.v?Math.max(3,m.v/max*88):0}%">${m===peak&&m.v?`<em>${fmt$(m.v)}</em>`:''}</i></button>`).join('')}</div>
    <div class="mlab">${s.months.map((m,i)=>`<span>${i%2?'':m.m+'月'}</span>`).join('')}</div>
  </div>`;
  const th=it=>`<div class="th">${img(it)?`<img src="${img(it)}" alt="">`:''}</div>`;
  if(s.best.length)h+=`<p class="mh">最划算的娃衣</p><div class="blist">${s.best.map(x=>`<div class="rowitem" onclick="openItem('${x.it.id}')">${th(x.it)}
    <div class="tx"><b>${esc(x.it.name)}</b><span>每穿一次 ${fmt$(x.c)}・穿了 ${x.w} 次・${fmt$(x.p)}</span></div><div class="rt">›</div></div>`).join('')}</div>`;
  if(s.idle.length)h+=`<p class="mh">買了還沒穿過</p><div class="blist">${s.idle.map(x=>`<div class="rowitem" onclick="openItem('${x.it.id}')">${th(x.it)}
    <div class="tx"><b>${esc(x.it.name)}</b><span>${fmt$(x.p)}・穿一次就回本一點</span></div><div class="rt">›</div></div>`).join('')}</div>`;
  if(s.cats.length){const cm=s.cats[0][1];h+=`<p class="mh">花最多的類型</p>${s.cats.map(([k,v])=>`<div class="bar"><div class="lb"><span>${esc(k)}</span><em>${fmt$(v)}</em></div>
    <div class="track"><i class="worn" style="width:${v/cm*100}%"></i></div></div>`).join('')}`}
  h+=soldSection();
  return h;
}
function mcap(el){
  const c=document.getElementById('mcap');if(!c)return;
  if(el){c.innerHTML=`<b>${el.dataset.t}</b>`;document.querySelectorAll('.mcol').forEach(b=>b.classList.toggle('on',b===el))}
  else{c.innerHTML=c.dataset.d||c.innerHTML;document.querySelectorAll('.mcol').forEach(b=>b.classList.remove('on'))}
}

/* ============================================================
   12. 捲動淡入 / 頂欄陰影
   畫面多半由 innerHTML 重繪，所以用 MutationObserver 抓新節點，
   再交給 IntersectionObserver 在進入畫面時淡入。
   ============================================================ */
const Reveal=(()=>{
  const SEL='.guide,.notice,.idea,.memcard,.wcardbig,.pack,.qrow,.lookcard,.locked,.hhero,.qa,.hstat,.hcard,.hscroll,.wcard,.blist,.piece,.card,.rowitem,.note,.stat > div,.bar,h2.sec,.qcard,.empty,.drop,#canvas,.ctrl,.hero,dl.meta,.legend,#wearList';
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last={el:null,t:0};
  const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>{
    let n=0;
    es.forEach(e=>{
      if(!e.isIntersecting)return;
      e.target.style.setProperty('--d',Math.min(n++,6)*55+'ms');
      e.target.classList.add('in');
      io.unobserve(e.target);
    });
  },{rootMargin:'0px 0px -6% 0px',threshold:.08}):null;
  function tag(root,quick){
    const list=[];
    if(root.matches&&root.matches(SEL))list.push(root);
    if(root.querySelectorAll)list.push(...root.querySelectorAll(SEL));
    list.forEach(el=>{
      if(el.classList.contains('rv'))return;
      if(reduce||!io||quick){el.classList.add('rv','in');return}
      el.classList.add('rv');io.observe(el);
    });
  }
  function watch(root){
    new MutationObserver(ms=>{
      // 同一區塊短時間內連續重繪（例如搜尋框打字），直接顯示，避免一直閃
      const now=performance.now();
      ms.forEach(m=>{
        const quick=last.el===m.target&&now-last.t<700;
        last={el:m.target,t:now};
        m.addedNodes.forEach(nd=>nd.nodeType===1&&tag(nd,quick));
      });
    }).observe(root,{childList:true,subtree:true});
    tag(root);
  }
  return {watch};
})();
Reveal.watch(document.querySelector('main'));

function chipEdge(el){

  el.classList.toggle('more-r',el.scrollLeft+el.clientWidth<el.scrollWidth-4);
}
document.addEventListener('scroll',e=>{if(e.target.classList&&e.target.classList.contains('chips'))chipEdge(e.target)},true);

document.addEventListener('wheel',e=>{
  const el=e.target.closest&&e.target.closest('.chips');
  if(!el||el.scrollWidth<=el.clientWidth||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
  e.preventDefault();el.scrollLeft+=e.deltaY;
},{passive:false});
(function(){
  let el=null,x0=0,s0=0,moved=false;
  document.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse'||e.button!==0)return;
    el=e.target.closest('.chips');if(!el)return;
    x0=e.clientX;s0=el.scrollLeft;moved=false;
  });
  document.addEventListener('pointermove',e=>{
    if(!el)return;const dx=e.clientX-x0;
    if(!moved&&Math.abs(dx)>5){moved=true;el.classList.add('drag')}
    if(moved)el.scrollLeft=s0-dx;
  });
  document.addEventListener('pointerup',()=>{
    if(!el)return;
    const t=el;el=null;
    // 拖曳結束時不要順便觸發點擊
    if(moved)setTimeout(()=>t.classList.remove('drag'),0);
  });
})();

(function(){

  let y0=null,dy=0;
  g.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;y0=e.clientY;dy=0;g.setPointerCapture(e.pointerId);panel.style.transition='none'});
  g.addEventListener('pointermove',e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);panel.style.transform=`translateY(${dy}px)`});
  const end=()=>{if(y0===null)return;y0=null;panel.style.transition='transform .25s ease';panel.style.transform='';if(dy>90)closeSheet()};
  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
})();
(function(){
  const h=document.querySelector('header.top');
  const on=()=>h.classList.toggle('scrolled',scrollY>4);
  addEventListener('scroll',on,{passive:true});on();
})();

/* ============================================================
   啟動
   ============================================================ */
(async function(){
  await DB.init();
  await load();
  applyTheme();
  go('home');
  // 請瀏覽器不要自動清掉這個網站的資料（有支援的瀏覽器才會生效）
  try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(!S.settings.welcomed&&!S.items.length&&!S.dolls.length)openWelcome();
  setTimeout(notifyAnniv,1500);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){notifyAnniv();if(UI.tab==='home')renderHome()}});
})();
</script>
