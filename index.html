/* ---- 新版本檢查：iPhone 主畫面 App 常常只是從背景切回來、不會重新載入，
   所以打開或切回來時問一下 version.json，有新版就請使用者點一下更新 ---- */
const APP_VER='2026.10.01-79';
let UPD_SHOWN=false;
async function checkUpdate(){
  if(UPD_SHOWN||isApp()||!location.protocol.startsWith('http'))return;
  try{
    const v=(await (await fetch('version.json?t='+Date.now(),{cache:'no-store'})).json()).v;
    if(v&&v!==APP_VER){UPD_SHOWN=true;showUpdate()}
  }catch(e){}
}
function showUpdate(){
  const b=document.createElement('button');b.className='updbar';b.innerHTML='✨ 有新版本，點一下更新';
  b.onclick=async()=>{b.textContent='更新中…';try{const r=await navigator.serviceWorker?.getRegistration();if(r)await r.update()}catch(e){}location.reload()};
  document.body.appendChild(b);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});

async function notifyAnniv(test){
  if(!notifyReady())return;
  if(isApp())return appNotifySchedule(test);
  const done=S.settings.notified=S.settings.notified||{};
  const show=async(title,body,tag)=>{
    try{const reg=await navigator.serviceWorker?.getRegistration();if(reg){await reg.showNotification(title,{body,tag,icon:'icons/icon-192.png',badge:'icons/favicon.png'});return}}catch(e){}
    try{new Notification(title,{body,tag,icon:'icons/icon-192.png'})}catch(e){}
  };
  let n=0;
  for(const x of notifyList()){if(done[x.key])continue;await show(x.title,x.body,x.key);done[x.key]=Date.now();n++}
  if(n)save();
  else if(test===true)show('通知已開啟','紀念日、節日和好久沒換裝的娃娃，會在這裡提醒你','wc-test');
}
// App：通知的編號要是數字，用 key 算一個固定的號碼
const notifId=k=>{let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2000000000+1};
const NOTIFY_HOUR=9,NOTIFY_DAYS=30,NOTIFY_MAX=60;   // iPhone 最多只能排 64 個
async function appNotifyClear(){try{const p=await LN().getPending();if(p.notifications.length)await LN().cancel({notifications:p.notifications.map(n=>({id:n.id}))})}catch(e){}}
var NOTIFY_BUSY=false;
async function appNotifySchedule(test){
  if(NOTIFY_BUSY)return;NOTIFY_BUSY=true;
  try{
    const ln=LN();
    try{const p=(await ln.checkPermissions()).display;if(p!==S.settings.appNotify){S.settings.appNotify=p;save()}if(p!=='granted')return}catch(e){}
    const st=S.settings,done=st.notified=st.notified||{},plan=st.notifyPlan||{},now=Date.now();
    // 之前排好、時間已經過了的，算是已經提醒過
    for(const [k,t] of Object.entries(plan))if(t<=now)done[k]=t;
    const list=[],seen=new Set();
    try{
      for(let i=0;i<=NOTIFY_DAYS&&list.length<NOTIFY_MAX;i++){
        const d=new Date();d.setDate(d.getDate()+i);d.setHours(NOTIFY_HOUR,0,0,0);
        TODAY_AT=i?d.getTime():null;
        for(const x of notifyList(i>0)){
          if(done[x.key]||seen.has(x.key))continue;seen.add(x.key);
          // 今天的：還沒到 9 點就排 9 點，過了就馬上跳
          list.push({...x,at:i===0&&d.getTime()<=now?now+3000:d.getTime()});
        }
      }
    }finally{TODAY_AT=null}
    if(test===true&&!list.some(x=>x.at<now+6e4))list.push({title:'通知已開啟',body:'紀念日、節日和好久沒換裝的娃娃，會在這裡提醒你',key:'wc-test:'+now,at:now+3000});
    const use=list.slice(0,NOTIFY_MAX);
    await appNotifyClear();
    if(use.length)await ln.schedule({notifications:use.map(x=>({id:notifId(x.key),title:x.title,body:x.body,schedule:{at:new Date(x.at),allowWhileIdle:true},smallIcon:'ic_stat_wawa',iconColor:'#B5536B'}))});
    st.notifyPlan=Object.fromEntries(use.filter(x=>!x.key.startsWith('wc-test')).map(x=>[x.key,x.at]));
    await save();
  }catch(e){console.warn('notify',e)}
  finally{NOTIFY_BUSY=false}
}

const dayNum=s=>{const [y,m,d]=String(s).split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
function homeDays(d){return d.home?dayNum(today())-dayNum(d.home):null}
// 今天或接下來 7 天內的紀念日：每年到家日，和第 100／500／1000… 天
function dollAnniv(){
  const t=today(),out=[];
  liveDolls().forEach(d=>{
    // 自訂紀念日（生日、角色生日…）：每年的月／日
    (d.dates||[]).forEach(x=>{
      if(!/^\d\d-\d\d$/.test(x.md||''))return;
      const ty=+t.slice(0,4);
      for(const y of [ty,ty+1]){
        const leap=(y%4===0&&y%100!==0)||y%400===0,md=x.md==='02-29'&&!leap?'02-28':x.md;
        const left=dayNum(y+'-'+md)-dayNum(t);
        if(left>=0&&left<=7){out.push({d,kind:'custom',label:x.label||'紀念日',id:x.id,n:x.year?y-x.year:0,left,date:y+'-'+md});break}
        if(left>=0)break;
      }
    });
    if(!d.home||!/^\d{4}-\d\d-\d\d$/.test(d.home))return;
    const days=homeDays(d);if(days<0)return;
    const [hy,hm,hd]=d.home.split('-').map(Number),ty=+t.slice(0,4);
    for(const y of [ty,ty+1]){
      const leap=(y%4===0&&y%100!==0)||y%400===0;
      const md=hm===2&&hd===29&&!leap?'02-28':String(hm).padStart(2,'0')+'-'+String(hd).padStart(2,'0');
      const n=y-hy,left=dayNum(y+'-'+md)-dayNum(t);
      if(n>=1&&left>=0&&left<=7){out.push({d,kind:'year',n,left,date:y+'-'+md});break}
    }
    for(const m of [100,200,300,500,1000,1500,2000,3000]){
      const left=m-1-days; // 到家那天算第 1 天
      if(left>=0&&left<=7&&m%365)out.push({d,kind:'day',n:m,left});
    }
  });
  return out.sort((a,b)=>a.left-b.left);
}

}

/* ---- 包成 App（Capacitor）時的差異 ----
   App 裡沒有「下載」：圖片、備份檔先寫進 App 的暫存資料夾，再打開手機的分享面板（存到照片、檔案、iCloud、LINE…）。 */
const isApp=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const blobB64=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=no;r.readAsDataURL(b)});
async function appShareFiles(files){
  const {Filesystem,Share}=Capacitor.Plugins,uris=[];
  for(const f of files){
    const path='share/'+f.name.replace(/[\\/:*?"<>|]/g,'_'),CH=3*1024*1024;   // 3 的倍數，base64 分段接起來才不會壞
    try{await Filesystem.deleteFile({path,directory:'CACHE'})}catch(e){}
    for(let o=0;o<Math.max(1,f.size);o+=CH){const d=await blobB64(f.slice(o,o+CH));
      if(o===0)await Filesystem.writeFile({path,data:d,directory:'CACHE',recursive:true});else await Filesystem.appendFile({path,data:d,directory:'CACHE'})}
    uris.push((await Filesystem.getUri({path,directory:'CACHE'})).uri);
  }
  try{await Share.share({files:uris})}catch(e){}
}
// 存檔：網頁用下載，App 用分享面板
async function saveFiles(files){
  if(isApp()){try{await appShareFiles(files);return true}catch(e){toast('存檔失敗：'+(e.message||e));return false}}
  files.forEach(f=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},60000)});

}

/* ---- 娃娃履歷的月曆：把穿搭紀錄蓋成章，一天一個圖示（照特別程度挑），點日期在下面展開那天的紀錄 ---- */
const weekStart=()=>S.settings.weekStart===0?0:1;   // 預設星期一開始，設定 → 外觀可以改成星期日
const weekHead=()=>{const w='日一二三四五六',s0=weekStart();return Array.from({length:7},(_,i)=>w[(i+s0)%7])};
// 這天是不是紀念日：到家週年、到家那天、自己加的紀念日
function dayAnns(d,t){
  const out=[],md=t.slice(5);
  if(d.home&&/^\d{4}-\d\d-\d\d$/.test(d.home)){if(t===d.home)out.push('🎉 來到家裡的那天');else if(d.home.slice(5)===md&&t>d.home)out.push(`🎂 到家 ${+t.slice(0,4)-+d.home.slice(0,4)} 週年`)}
  (d.dates||[]).forEach(x=>{if(x.md===md)out.push(`🎂 ${x.label||'紀念日'}${x.year&&+t.slice(0,4)>x.year?`（${+t.slice(0,4)-x.year} 歲）`:''}`)});
  return out;
}
// 一天的紀錄：穿搭＋沒有穿搭紀錄的出門（補記的足跡）
function dayRecs(d,t){
  const ws=dollWears(d).filter(w=>w.date===t);
  const outOnly=(d.outs||[]).includes(t)&&!ws.some(w=>w.place==='出門');
  return {ws,outOnly,anns:dayAnns(d,t)};
}
function dayIcon(r){
  if(r.anns.length)return '🎂';
  if(r.outOnly||r.ws.some(w=>w.place==='出門'))return '🚶';
  const wk=r.ws.filter(isWork);
  if(wk.some(isOT))return '🌙';
  if(wk.length)return workIcon(rOf(wk[0]));
  if(r.ws.length)return '🏠';
  return '';
}
function dollCal(d){
  const m=UI.dcalM||today().slice(0,7),y=+m.slice(0,4),mo=+m.slice(5,7),n=new Date(y,mo,0).getDate();
  const lead=(new Date(y,mo-1,1).getDay()-weekStart()+7)%7,mv=k=>ymd(new Date(y,mo-1+k,1).getTime()).slice(0,7),td=today();
  const cnt={};let cells='';for(let i=0;i<lead;i++)cells+='<i></i>';
  for(let k=1;k<=n;k++){
    const t=m+'-'+String(k).padStart(2,'0'),r=dayRecs(d,t),ic=dayIcon(r),many=r.ws.length+(r.outOnly?1:0)+(r.anns.length&&(r.ws.length||r.outOnly)?1:0)>1;
    if(ic)cnt[ic]=(cnt[ic]||0)+1;
    cells+=`<button type="button" class="${t===UI.dcalSel?'sel':''} ${t===td?'td':''} ${t>td?'fut':''}" onclick="UI.dcalSel=UI.dcalSel==='${t}'?'':'${t}';dcalDraw('${d.id}')"><small>${k}</small><b>${ic||''}</b>${many?'<em></em>':''}</button>`;
  }
  const sum=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} ${v}`).join('・');
  const sel=UI.dcalSel&&UI.dcalSel.startsWith(m)?UI.dcalSel:'';
  let day='';
  if(sel){const r=dayRecs(d,sel),wd='日一二三四五六'[new Date(sel+'T12:00:00').getDay()];
    const rows=[...r.anns.map(a=>`<div class="dcrow"><span>${esc(a)}</span></div>`),
      ...r.ws.map(w=>`<button class="dcrow" onclick="openWearDetail('${w.id}')"><span>${placeTag(w)}${(w.itemIds||[]).map(i=>esc((anyItem(i)||{}).name||'')).filter(Boolean).join('、')||(isWork(w)?'':'沒有勾選衣服')}${w.note?`<small class="dcnote">✏️ ${esc(w.note)}</small>`:''}</span><em>›</em></button>`),
      ...(r.outOnly?[`<button class="dcrow" onclick="openDollFoot('${d.id}')"><span>🚶 出門${(d.outPlaces||{})[sel]?'・'+esc(spotText(spNorm(d.outPlaces[sel])||{})):''}</span><em>›</em></button>`]:[])];
    day=`<div class="dcday"><b>${+sel.slice(5,7)}/${+sel.slice(8)}（${wd}）</b>${rows.length?rows.join(''):`<p class="hint" style="margin:6px 0 0">這天沒有紀錄。</p>`}
      ${sel<=td&&isLive(d)&&!r.ws.length?`<button class="btn sm ghost" style="margin-top:8px" onclick="openWear();WEAR.date='${sel}';WEAR.dollId='${d.id}';WEAR.doll=${esc(JSON.stringify(d.name))};drawWearSheet()">幫 ${esc(d.name)} 記一筆</button>`:''}</div>`}
  return `<div class="dcal shcal" id="dcal"><div class="shhead"><button type="button" onclick="UI.dcalM='${mv(-1)}';UI.dcalSel='';dcalDraw('${d.id}')" aria-label="上個月">‹</button><b>${y} 年 ${mo} 月</b><button type="button" onclick="UI.dcalM='${mv(1)}';UI.dcalSel='';dcalDraw('${d.id}')" aria-label="下個月">›</button></div>
    ${sum?`<p class="hint" style="margin:0 0 8px;text-align:center">這個月：${sum}</p>`:`<p class="hint" style="margin:0 0 8px;text-align:center">這個月還沒有紀錄</p>`}
    <div class="calgrid dgrid">${weekHead().map(x=>`<small>${x}</small>`).join('')}${cells}</div>${day}
    ${sum&&m<=td.slice(0,7)?`<button type="button" class="btn sm ghost" style="display:block;margin:10px auto 0" onclick="openShare('month','${d.id}|${m}')">📤 分享這個月</button>`:''}</div>`;
}

// 接下來的紀念日（到家日、生日、自訂）
function dollNextDates(d){
  const out=[],t=dayNum(today()),y=+today().slice(0,4);
  const next=md=>{let x=dayNum(y+'-'+md);if(x<t)x=dayNum((y+1)+'-'+md);return x-t};
  if(d.home)out.push({ic:'🏡',label:'到家紀念日',md:d.home.slice(5),left:next(d.home.slice(5))});
  (d.dates||[]).forEach(x=>out.push({ic:'🎂',label:x.label,md:x.md,left:next(x.md)}));

function dollResume(d){
  const L=[`【${d.name}】${d.size||''}`];
  if(d.src||d.from)L.push(`來源：${[d.src,d.from].filter(Boolean).join('・')}`);
  if(d.attr==='has'&&(d.work||d.chara))L.push(`屬性：${[d.work,d.chara].filter(Boolean).join(' ')}`);
  if(d.home)L.push(`到家：${d.home.replace(/-/g,'/')}`);
  const done=(d.care||[]).filter(c=>c.status==='完成').sort((a,b)=>(a.doneDate||a.date||'').localeCompare(b.doneDate||b.date||''));
  const open=dollOpen(d);
  if(done.length){L.push('','整理紀錄：');done.forEach(c=>L.push(`・${(c.doneDate||c.date||'').replace(/-/g,'/')} ${c.type}（${c.who==='手作娘'?'手作娘'+(c.maker?' '+c.maker:''):'自己'}）${c.note?'：'+c.note:''}`))}
  if(open.length){L.push('','目前狀況：');open.forEach(c=>L.push(`・${c.type}${c.note?'：'+c.note:''}`))}
  const acc=d.acc||[];if(acc.length)L.push('',`附的配件：${acc.map(a=>`${a.name}${a.state==='在身上'||a.state==='收起來'?'':'（'+a.state+'）'}`).join('、')}`);
  return L.join('\n');
}

async function saveDoll(){
  if(!DD.name.trim()){toast('幫娃娃取個名字吧');return}
  const {isMain,view,...d}=DD;d.name=d.name.trim();
  if(d.id){const i=S.dolls.findIndex(x=>x.id===d.id);S.dolls[i]=Object.assign(S.dolls[i],d)}
  else{d.id=uid('d');d.createdAt=Date.now();S.dolls.push(d)}
  if(d.attr!=='has'){d.work='';d.chara=''}
  if(isMain)S.settings.mainDoll=d.id;
  else if(S.settings.mainDoll===d.id)S.settings.mainDoll='';
  await save();
  if(UI.tab==='dolls')renderDolls();else renderHome();
  DD={...d};drawDoll();
  toast('已儲存');
}
async function delDoll(id){
  const d=S.dolls.find(x=>x.id===id);
  if(!confirm(`刪除 ${d.name}？穿搭紀錄會保留。`))return;
  S.dolls=S.dolls.filter(x=>x.id!==id);
  if(S.settings.mainDoll===id)S.settings.mainDoll='';
  await save();closeSheet();
  if(UI.tab==='dolls')renderDolls();else renderHome();
}

function wishLine(w){
  if(!w.summary)return w.photo?'還沒跟衣櫃比對，按「再檢查」看看':'';
  const s=w.summary;
  if(s.same)return '衣櫃裡可能已經有了';
  if(s.recolor)return `有 ${s.recolor} 件同款不同色`;
  if(s.similar)return `有 ${s.similar} 件風格很像`;
  return '衣櫃裡沒有類似的';
}

const ORDER_STAGES=['開團中','已付款','製作中','運送中','已到貨'];
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

function setStage(o,st){o.stage=st;if(st==='已到貨'&&!o.arrived)o.arrived=today();if(st!=='已到貨')delete o.arrived}
const pendingOrders=()=>S.orders.filter(o=>o.stage!=='已到貨'&&!o.filed);
function orderEta(o){
  if(!o.eta)return '';
  const left=dayNum(o.eta)-dayNum(today());
  return left>31?`預計約 ${Math.round(left/30)} 個月後`:left>0?`預計 ${left} 天後`:left===0?'預計今天到':`已經超過預計 ${-left} 天`;
}
// 到貨提醒：已到貨還沒建檔的娃衣，和 7 天內要到（或已經超過預計）的
const arrivedOrders=()=>S.orders.filter(o=>!o.filed&&o.kind!=='doll'&&o.stage==='已到貨');

// 拍照建檔：先拍實物照，再帶著所有資料進建檔清單
function fileShoot(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;o.photo=await compress(f);o.photoTaken=true;orderToIntake(id)};
  inp.click();
}
// 先用商品圖建檔：不經過建檔清單，直接放進衣櫃；沒填尺寸的先問一次
function fileQuick(ids){
  const os=ids.map(id=>S.orders.find(o=>o.id===id)).filter(o=>o&&o.photo&&!o.filed);if(!os.length)return;
  const noSize=os.filter(o=>!o.size);
  if(noSize.length&&sizes().length){
    UI.fileIds=os.map(o=>o.id);UI.fileSize=buyDefSize();
    openSheet(`<h3>先建檔 ${os.length} 件</h3><p class="hint" style="margin:-6px 0 12px">有 ${noSize.length} 件沒填尺寸，這幾件是哪個尺寸？</p>
      <div class="parts" id="fqsz">${sizes().map(z=>`<button type="button" data-k="${esc(z)}" class="${UI.fileSize===z?'on':''}" onclick="UI.fileSize=this.dataset.k;document.querySelectorAll('#fqsz button').forEach(b=>b.classList.toggle('on',b.dataset.k===UI.fileSize))">${esc(z)}</button>`).join('')}</div>
      <button class="btn wide" style="margin-top:14px" onclick="fileQuickDo(UI.fileIds,UI.fileSize)">放進衣櫃</button>`);
    return;
  }
  fileQuickDo(os.map(o=>o.id),'');
}
async function fileQuickDo(ids,size){
  let n=0;
  ids.map(id=>S.orders.find(o=>o.id===id)).filter(o=>o&&o.photo&&!o.filed).forEach(o=>{
    const isSet=o.category==='套裝',sid=isSet?uid('s'):null;
    if(isSet)S.sets.push({id:sid,name:o.name||'未命名套裝',createdAt:Date.now()});

function fxBase(cur){

  const mk=cur+'>'+base,mv=+f.manual[mk]||(base==='TWD'?+f.manual[cur]:0);

// 超長截圖整張縮到 1800 會變成細長一條、字看不清楚：高度超過寬度 2.5 倍就切成幾段（上下重疊一點，商品不會被切掉），最多 4 段，每段 1 次
const SHOT_SEG=2.2,SHOT_MAX=4;
function shotParts(im){
  const W=im.width,H=im.height;
  if(H<=W*2.5)return [im];
  let seg=W*SHOT_SEG,ov=seg*.12,n=Math.ceil((H-ov)/(seg-ov));
  let tight=false;if(n>SHOT_MAX){n=SHOT_MAX;ov=W*.25;seg=(H+ov*(n-1))/n;tight=seg>W*3.2}
  const step=(H-seg)/(n-1),out=[];
  for(let k=0;k<n;k++){const y=Math.round(k*step),h=Math.round(Math.min(seg,H-y)),c=document.createElement('canvas');c.width=W;c.height=h;c.getContext('2d').drawImage(im,0,y,W,h,0,0,W,h);out.push(c)}
  out.tight=tight;return out;
}

// 從原圖剪下商品小圖（比例座標 0～1000）；另外多留一圈存成 src，剪歪了可以在單筆裡調整
function shotSrc(im,box){
  if(!Array.isArray(box)||box.length<4)return null;
  const [x,y,w,h]=box.map(Number);if(![x,y,w,h].every(isFinite)||w<20||h<20)return null;
  const W=im.width,H=im.height,side=Math.max(w/1000*W,h/1000*H),cx=(x+w/2)/1000*W,cy=(y+h/2)/1000*H,pad=side*.45;
  const ex=Math.max(0,cx-side/2-pad),ey=Math.max(0,cy-side/2-pad),ew=Math.min(W,cx+side/2+pad)-ex,eh=Math.min(H,cy+side/2+pad)-ey;
  const c=document.createElement('canvas'),s=Math.min(1,900/Math.max(ew,eh));c.width=Math.round(ew*s);c.height=Math.round(eh*s);
  c.getContext('2d').drawImage(im,ex,ey,ew,eh,0,0,c.width,c.height);
  const sd=Math.min(side,ew,eh);
  return {src:c.toDataURL('image/jpeg',.85),rect:{x:Math.max(0,cx-sd/2-ex)/ew,y:Math.max(0,cy-sd/2-ey)/eh,w:sd/ew}};
}
function shotCrop(im,box){
  if(!Array.isArray(box)||box.length<4)return null;
  let [x,y,w,h]=box.map(Number);if(![x,y,w,h].every(isFinite)||w<20||h<20)return null;
  const W=im.width,H=im.height,px=x/1000*W,py=y/1000*H,pw=w/1000*W,ph=h/1000*H;
  const c=document.createElement('canvas'),s=Math.min(1,500/Math.max(pw,ph));c.width=Math.round(pw*s);c.height=Math.round(ph*s);
  c.getContext('2d').drawImage(im,Math.max(0,px),Math.max(0,py),Math.min(pw,W-px),Math.min(ph,H-py),0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.82);
}

/* ---- 調整商品圖：方框固定，拖曳移動、滑桿或兩指縮放 ----
   src 是比較大的原圖（截圖匯入時會多留一圈），rect 是目前框的位置（比例 0～1，正方形）。 */
let CROP={};
function openCrop(src,rect,done,title){
  CROP={src,rect,done,im:null,z:1,px:0,py:0,F:0};
  openSheet(`<h3>${title||'調整商品圖'}</h3>
    <p class="hint" style="margin:-6px 0 12px">拖曳移動，用下面的滑桿或兩指放大縮小，框裡的就是存下來的樣子。</p>
    <div class="cropbox" id="cropbox"><canvas id="cropcv"></canvas></div>
    <label class="f" style="margin-top:12px"><span>放大</span><input type="range" id="cropz" min="1" max="5" step="0.01" value="1" oninput="cropZoom(+this.value)"></label>
    <button class="btn wide" onclick="cropDone()">用這個位置</button>
    <button class="btn ghost wide" style="margin-top:8px" onclick="CROP.done(null)">取消</button>`);
  loadImg(src).then(im=>{CROP.im=im;cropInit()});
}
function cropInit(){
  const box=document.getElementById('cropbox'),cv=document.getElementById('cropcv');if(!box||!CROP.im)return;
  const F=CROP.F=box.clientWidth,im=CROP.im,dpr=window.devicePixelRatio||1;
  cv.width=F*dpr;cv.height=F*dpr;cv.style.width=cv.style.height=F+'px';
  CROP.b=F/Math.min(im.width,im.height);
  const r=CROP.rect;
  if(r&&r.w>0){const side=r.w*im.width,ds=F/side;CROP.z=Math.max(1,Math.min(5,ds/CROP.b));const d=CROP.b*CROP.z;CROP.px=-r.x*im.width*d;CROP.py=-r.y*im.height*d}
  else{CROP.z=1;const d=CROP.b;CROP.px=(F-im.width*d)/2;CROP.py=(F-im.height*d)/2}
  document.getElementById('cropz').value=CROP.z;cropClamp();cropDraw();
  // 拖曳、兩指縮放
  const pts=new Map();let last=null,pinch=null;
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:CROP.z}}else last={x:e.clientX,y:e.clientY}};
  cv.onpointermove=e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&pinch){const [a,b]=[...pts.values()];cropZoom(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d);document.getElementById('cropz').value=CROP.z;return}
    if(last){CROP.px+=e.clientX-last.x;CROP.py+=e.clientY-last.y;last={x:e.clientX,y:e.clientY};cropClamp();cropDraw()}};
  cv.onpointerup=cv.onpointercancel=e=>{pts.delete(e.pointerId);pinch=null;last=pts.size===1?[...pts.values()][0]:null};
}
function cropClamp(){const im=CROP.im,d=CROP.b*CROP.z,F=CROP.F;
  CROP.px=Math.min(0,Math.max(F-im.width*d,CROP.px));CROP.py=Math.min(0,Math.max(F-im.height*d,CROP.py))}
// 以框的中心縮放
function cropZoom(z){z=Math.max(1,Math.min(5,z));const F=CROP.F,d0=CROP.b*CROP.z,d1=CROP.b*z,cx=(F/2-CROP.px)/d0,cy=(F/2-CROP.py)/d0;
  CROP.z=z;CROP.px=F/2-cx*d1;CROP.py=F/2-cy*d1;cropClamp();cropDraw()}
function cropDraw(){const cv=document.getElementById('cropcv');if(!cv||!CROP.im)return;const g=cv.getContext('2d'),s=cv.width/CROP.F,d=CROP.b*CROP.z;
  g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(CROP.im,CROP.px*s,CROP.py*s,CROP.im.width*d*s,CROP.im.height*d*s)}
function cropDone(){
  const im=CROP.im;if(!im)return;const d=CROP.b*CROP.z,sx=-CROP.px/d,sy=-CROP.py/d,sw=CROP.F/d;
  const out=document.createElement('canvas'),n=Math.min(600,Math.round(sw));out.width=out.height=n;
  const g=out.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,n,n);g.drawImage(im,sx,sy,sw,sw,0,0,n,n);
  CROP.done({photo:out.toDataURL('image/jpeg',.85),rect:{x:sx/im.width,y:sy/im.height,w:sw/im.width}});
}

   0d. 壓箱底 + 回憶箱
   壓箱底：自動判斷（從購入日期、沒填就從建檔日算，60 天以上都沒穿，或 180 天以上沒穿；紀念品不算）
   回憶箱：賣掉、送人、壞掉的娃衣移到 S.memory，衣櫃和分析都不再算它們
   ============================================================ */
// 用手機今天的日期算。使用者也可以手動放進去（press:'on'）或拿出來（press:'off'），手動的優先
const PRESS_NEW=60,PRESS_IDLE=180;
// 節日服：一年才穿一次，壓箱底改成超過 13 個月才算；節日前 3 週首頁提醒
const HOLIDAYS=[['聖誕節','🎄','12-25'],['新年','🎆','01-01'],['過年','🧧',{2026:'02-17',2027:'02-06',2028:'01-26',2029:'02-13',2030:'02-03',2031:'01-23'}],
  ['萬聖節','🎃','10-31'],['情人節','💝','02-14'],['中秋節','🥮',{2026:'09-25',2027:'09-15',2028:'10-03',2029:'09-22',2030:'09-12',2031:'10-01'}],['生日','🎂',null],['復活節','🐣',null]];
const HOL_NAMES=HOLIDAYS.map(h=>h[0]),holIcon=n=>(HOLIDAYS.find(h=>h[0]===n)||[])[1]||'🎉';
const HOL_DAYS=400;
const HOL_COLORS={'聖誕節':'紅色、綠色、白色','新年':'金色、白色、亮片','過年':'紅色、金色、中式','萬聖節':'黑色、橘色、紫色','情人節':'粉色、紅色、愛心','中秋節':'黃色、白色、中式'};
// 現在該提醒哪些節日：有節日服的在前 21 天內（分成 3 週前、前一天、當天三段）；沒有的只在一個月前那段提醒（大節日）
function holidayAlerts(){
  const out=[];
  HOL_NAMES.forEach(n=>{
    const nh=nextHoliday(n);if(!nh)return;
    const its=S.items.filter(i=>i.holiday===n&&i.category!=='套裝');
    if(its.length){
      if(nh.left>21)return;
      const stage=nh.left===0?'today':nh.left===1?'tomorrow':'weeks';
      out.push({n,its,left:nh.left,key:'hol:'+n+':'+nh.year+':'+stage});
    }else{
      if(!HOL_COLORS[n]||nh.left>30||nh.left<22)return;
      out.push({n,its,left:nh.left,key:'hol0:'+n+':'+nh.year});
    }
  });
  return out.sort((a,b)=>a.left-b.left);
}
function nextHoliday(n){
  const h=HOLIDAYS.find(x=>x[0]===n);if(!h||!h[2])return null;
  const ty=+today().slice(0,4);
  for(const y of [ty,ty+1]){const md=typeof h[2]==='string'?h[2]:h[2][y];if(!md)continue;const left=dayNum(y+'-'+md)-dayNum(today());if(left>=0)return {date:y+'-'+md,left,year:y}}
  return null;
}
function isPressed(i){
  if(i.press==='on')return true;
  if(i.press==='off'||i.keepsake)return false;
  // 套裝：拆出來的單品全部都壓箱底，整套就算壓箱底
  if(i.category==='套裝'){const m=setMates(i);if(m.length)return m.every(isPressed)}
  const l=lastWear(i.id);
  if(l)return days(l)>=(i.holiday?HOL_DAYS:PRESS_IDLE);
  return (Date.now()-pressStart(i))/864e5>=(i.holiday?HOL_DAYS:PRESS_NEW);
}
// 從哪天開始算「買來都沒穿」：有填購入日期就用購入日期（很多娃衣早在用 App 之前就買了），沒有才用建檔日
// 預購的娃衣從「到貨日」開始算（下單日可能是好幾個月前），其次是購入日期，都沒有才用建檔日
function pressStart(i){
  for(const f of [i.homeDate,i.buyDate])if(/^\d{4}-\d\d-\d\d$/.test(f||'')){const t=Date.UTC(...f.split('-').map((v,k)=>k===1?v-1:+v));if(t<=Date.now())return t-8*3600e3}
  return i.createdAt||Date.now();
}

async function saveArchive(){
  const k=S.items.findIndex(x=>x.id===MV.id);if(k<0)return;
  const i=S.items[k],mates=MV.withSet?setMates(i):[];
  // 價格記在使用者按的那一件；整套一起移時，其他件標記屬於哪一筆
  const move=[i,...mates];
  move.forEach(x=>{
    Object.assign(x,{archivedAt:MV.date||today(),reason:MV.reason,soldPrice:x===i&&MV.reason==='賣掉了'?MV.price:'',memo:x===i?MV.memo:'',groupOf:x===i?null:i.id});
    S.items=S.items.filter(y=>y.id!==x.id);S.memory.push(x);

  await save();closeSheet();renderCloset();if(UI.tab==='home')renderHome();
  toast(move.length>1?`${move.length} 件一起放進回憶箱了`:'已放進回憶箱');

// 修補舊資料：套裝已經在回憶箱，拆出來的單品還留在衣櫃

  const i=S.memory.find(x=>x.id===id);if(!i)return;

   6. 衣櫃

// 這筆穿搭有沒有穿到這件：直接勾了它；或它是套裝，而這筆把套裝裡的單品全部都勾了
// 一套的價格只算一次：拆出來的單品建檔時都複製了套裝的價格，統計時只認「套裝」那一筆（沒有套裝那筆就認第一件）
function priceOf(i){
  if(!i||!i.setId)return money(i&&i.price);
  const all=[...S.items,...S.memory].filter(x=>x.setId===i.setId),par=all.find(x=>x.category==='套裝');
  return (par?par===i:all[0]===i)?money(i.price):0;
}
// 算「穿搭」的紀錄：陪伴日常沒選衣服、也沒照片的，只算陪伴，不算換裝
const isOutfit=w=>!(isWork(w)&&!(w.itemIds||[]).length&&!w.photo);
const outfitWears=list=>(list||S.wears).filter(isOutfit);
// 同一套的單品合成一組；一組要顯示成哪一件（有「套裝」那筆就用它）
const grpKey=it=>it&&it.setId?'set:'+it.setId:it&&it.id;
function grpRep(k){if(!String(k).startsWith('set:'))return anyItem(k);const sid=k.slice(4),all=[...S.items,...S.memory].filter(x=>x.setId===sid);return all.find(x=>x.category==='套裝')||all[0]}
// 一筆穿搭拆成「組」：套裝裡的單品全部都穿到（或直接勾了套裝）才算整套；只穿一部分，就只算穿到的那幾件
function wearGroups(w){
  const ids=[...new Set(w.itemIds||[])],out=new Set(),bySet={};
  ids.forEach(id=>{const it=anyItem(id);if(!it)return;if(!it.setId){out.add(id);return}(bySet[it.setId]=bySet[it.setId]||[]).push(it)});
  Object.entries(bySet).forEach(([sid,its])=>{
    const ps=setPieceIds((grpRep('set:'+sid)||{}).id)||[...S.items,...S.memory].filter(x=>x.setId===sid&&x.category!=='套裝').map(x=>x.id);
    const full=its.some(x=>x.category==='套裝')||(ps.length&&ps.every(x=>ids.includes(x)));
    if(full)out.add('set:'+sid);else its.forEach(x=>{if(x.category!=='套裝')out.add(x.id)});
  });
  return [...out];
}
// 每一組被穿了幾次
function grpWearCount(list){const c={};(list||outfitWears()).forEach(w=>wearGroups(w).forEach(k=>c[k]=(c[k]||0)+1));return c}
// 花費用：一套被用到幾次（穿到其中任何一件就算用到這套）
function setUseCount(list){const c={};(list||outfitWears()).forEach(w=>new Set((w.itemIds||[]).map(id=>grpKey(anyItem(id))).filter(Boolean)).forEach(k=>c[k]=(c[k]||0)+1));return c}
function setPieceIds(id){const it=anyItem(id);if(!it||it.category!=='套裝'||!it.setId)return null;
  const ps=[...S.items,...S.memory].filter(x=>x.setId===it.setId&&x.category!=='套裝').map(x=>x.id);return ps.length?ps:null}
function wornIn(w,id,ps){const ids=w.itemIds||[];if(ids.includes(id))return true;ps=ps===undefined?setPieceIds(id):ps;return !!ps&&ps.every(x=>ids.includes(x))}
function wearsWith(id){const ps=setPieceIds(id);return S.wears.filter(w=>wornIn(w,id,ps))}
function wearCount(id){return wearsWith(id).length}
function lastWear(id){const w=wearsWith(id).map(x=>x.date).sort();return w.length?w[w.length-1]:null}
function setName(id){return (S.sets.find(s=>s.id===id)||{}).name||''}
function img(it){return it.cutout||it.photo||''}
// 穿搭紀錄的縮圖：有照片用照片，沒有就把這次穿的單品貼圖拼在一起（最多 4 件）
function wearThumb(w){
  if(w.photo)return `<div class="th"><img src="${w.photo}" style="object-fit:cover;padding:0" alt=""></div>`;
  const its=w.itemIds.map(anyItem).filter(i=>i&&img(i)&&i.category!=='套裝');
  const pick=(its.length?its:w.itemIds.map(anyItem).filter(i=>i&&img(i))).slice(0,4);
  if(pick.length<2)return `<div class="th">${pick[0]?`<img src="${img(pick[0])}" alt="">`:''}</div>`;
  return `<div class="th col c${pick.length}">${pick.map(i=>`<img src="${img(i)}" alt="">`).join('')}</div>`;
}

/* ---- 顏色色票：12 個色系＋花色，點一下就選，可以複選（最多 3 個，第一個當主色）----
   存的是「粉色」這種名字；AI 讀的細色名（淺粉色…）也歸在同一個色系，點色票會一起拿掉 */
const SWATCHES=[['粉色','#F2A7BC'],['紅色','#D9534F'],['橘色','#F0A04B'],['黃色','#F2D14B'],['綠色','#7FB77E'],['藍色','#6C9BD2'],['紫色','#A98BC9'],['白色','#FFFFFF'],['米色','#E8D8BE'],['棕色','#9C7456'],['灰色','#A7A7A7'],['黑色','#2B2B2B'],['花色','conic-gradient(#F2A7BC,#F2D14B,#7FB77E,#6C9BD2,#A98BC9,#F2A7BC)']];
const swFam=c=>c==='花色'||/花|多色|印花|格紋/.test(c||'')?'花色':colorFam(c);
function swatchHTML(colors,fn,small){
  const on=new Set((colors||[]).map(swFam));
  return `<div class="cpick ${small?'sm':''}">${SWATCHES.map(([k,hex])=>{const f=swFam(k);return `<button type="button" class="${on.has(f)?'on':''}" onclick="${fn}('${k}')" aria-label="${k}" title="${k}"><i style="background:${hex}"></i><span>${k.replace('色','')}</span></button>`}).join('')}</div>`;
}
// 點色票：選了就拿掉（連同同色系的細色名），沒選就加上（最多 3 個）
function toggleColor(arr,k){
  const f=swFam(k),has=arr.some(c=>swFam(c)===f);
  if(has)return arr.filter(c=>swFam(c)!==f);
  if(arr.length>=3){toast('最多選 3 個顏色，第一個是主色');return arr}
  return [...arr,k];
}

var NAMEC=null;
function nameOf(i){
  if(!i)return '';
  if(!NAMEC){NAMEC=new Map();[...S.items,...S.memory].forEach(x=>NAMEC.set(x.name,(NAMEC.get(x.name)||0)+1));setTimeout(()=>NAMEC=null,0)}
  const c=(i.colors||[])[0];if(!c||(NAMEC.get(i.name)||0)<2)return i.name;
  const l=c==='花色'?'花色':String(famLabel[colorFam(c)]||c).replace(/色$/,'');
  return String(i.name).includes(l)?i.name:`${i.name}・${l}`;
}
function missingInfo(i){
  if(!i||i.category==='套裝')return [];
  const m=[];
  if(!(i.colors||[]).length)m.push('顏色');
  if(!priceOf(i)&&!(i.setId&&[...S.items,...S.memory].some(x=>x.setId===i.setId&&priceOf(x)>0)))m.push('價格');
  if(!i.buyDate&&!i.homeDate)m.push('日期');
  if(i.autoName)m.push('名稱');
  if(i.needPhoto)m.push('實物照');
  return m;
}

async function bigDo(){

  if(kind==='del'&&BIG.word!=='刪除')return;
  if(kind==='press')its.forEach(i=>{i.press=BIG.press==='auto'?'':BIG.press});
  if(kind==='sell'){
    // 套裝和它拆出來的單品一起移時，單品收在套裝那張回憶卡片裡，價格只算在套裝上
    const host=x=>x.setId&&x.category!=='套裝'&&its.find(y=>y.setId===x.setId&&y.category==='套裝');
    const payers=its.filter(x=>!host(x)),tot=BIG.reason==='賣掉了'?money(BIG.price):0,each=Math.floor(tot/payers.length);

      S.memory.push(x);

  if(kind==='del'){
    S.items=S.items.filter(x=>!set.has(x.id));

}

async function applyBatch(kind,clear,arg){

const itip=t=>`<button type="button" class="itip" onclick="itipShow(event,this)" data-t="${esc(t)}" aria-label="說明">!</button>`;
function itipShow(e,b){
  e.preventDefault();e.stopPropagation();
  const old=document.querySelector('.itipbox');if(old){old.remove();if(old._b===b)return}
  const d=document.createElement('div');d.className='itipbox';d.textContent=b.dataset.t;d._b=b;document.body.appendChild(d);
  const r=b.getBoundingClientRect(),w=Math.min(260,innerWidth-32);d.style.width=w+'px';
  d.style.left=Math.max(16,Math.min(innerWidth-16-w,r.left+r.width/2-w/2))+'px';
  const below=r.bottom+8+d.offsetHeight<innerHeight;d.style.top=(below?r.bottom+8:r.top-8-d.offsetHeight)+'px';
  const off=()=>{d.remove();document.removeEventListener('pointerdown',close,true);document.removeEventListener('scroll',off,true)};
  const close=ev=>{if(ev.target!==b)off()};
  setTimeout(()=>{document.addEventListener('pointerdown',close,true);document.addEventListener('scroll',off,true)},0);
}

// 套裝和拆出來的單品共用的欄位：改套裝時，改了哪幾個就同步到單品（單品自己不一樣的欄位不會被蓋掉）
const SET_SHARED=['series','brand','shop','buyDate','origin','holiday','season','sizes','tags','keepsake','keepsakeReason'];
function syncToMates(i,before){
  const mates=setMates(i);if(!mates.length)return 0;
  SET_SHARED.forEach(f=>{
    const a=JSON.stringify(before[f]??''),b=JSON.stringify(i[f]??'');if(a===b)return;
    mates.forEach(m=>{
      if(f==='tags'){const add=(i.tags||[]).filter(t=>!(before.tags||[]).includes(t)),del=(before.tags||[]).filter(t=>!(i.tags||[]).includes(t));
        m.tags=[...new Set([...(m.tags||[]).filter(t=>!del.includes(t)),...add])]}
      else m[f]=Array.isArray(i[f])?i[f].slice():i[f];
    });
  });
  return mates.length;
}
// 單品名稱是「套裝名－上衣」：把前面的套裝名換成現在的名字
// 以前改過名但沒同步的，也看單品們共同的前綴來修正
function renameMates(i,oldName){
  const mates=setMates(i),pre=m=>{const k=m.name.indexOf('－');return k>0?m.name.slice(0,k):null};
  const cnt={};mates.forEach(m=>{const p=pre(m);if(p)cnt[p]=(cnt[p]||0)+1});
  const common=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  const olds=new Set([oldName,setName(i.setId),common].filter(Boolean));
  let n=0;
  mates.forEach(m=>{const p=pre(m);if(p&&p!==i.name&&olds.has(p)){m.name=i.name+m.name.slice(p.length);n++}
    // 後來才加進來、名字沒有套裝名的（例如只叫「襪子」）：補上
    else if(!p&&m.category!=='套裝'){m.name=i.name+'－'+m.name;n++}});
  return n;
}
async function saveEdit(id){
  const i=S.items.find(x=>x.id===id),v=k=>document.getElementById(k).value;
  const before=JSON.parse(JSON.stringify(Object.fromEntries(SET_SHARED.map(f=>[f,i[f]])))),oldName=i.name;
  if(v('e_name').trim()!==i.name)delete i.autoName;
  i.colors=UI.ecol.slice();
  i.name=v('e_name');i.category=v('e_cat');i.season=v('e_season');i.series=v('e_series').trim();i.brand=v('e_brand');i.shop=v('e_shop');
  i.buyDate=v('e_buy');i.homeDate=v('e_home');i.origin=v('e_origin').trim();i.holiday=v('e_hol');i.tags=parseTags(v('e_tags'));i.price=v('e_price');i.material=v('e_mat');i.note=v('e_note');
  i.sizes=[...document.querySelectorAll('#e_sizes button.on')].map(b=>txt(b));
  i.keepsake=document.getElementById('e_keep').classList.contains('on');
  i.keepsakeReason=v('e_kr');
  const sync=document.getElementById('e_sync');
  const doSync=i.category==='套裝'&&(!sync||sync.checked);
  let n=doSync?syncToMates(i,before):0;
  // 改套裝名稱：單品是「套裝名－上衣」，前面的套裝名一起換
  if(doSync&&i.name.trim()){
    const r=renameMates(i,oldName);if(r)n=Math.max(n,r);
    const st=S.sets.find(x=>x.id===i.setId);if(st)st.name=i.name;
  }

function delItem(id){

async function delItemsNow(ids){
  const set=new Set(ids),sids=new Set(S.items.filter(x=>set.has(x.id)&&x.setId).map(x=>x.setId));
  S.items=S.items.filter(x=>!set.has(x.id));
  S.wears.forEach(w=>w.itemIds=w.itemIds.filter(x=>!set.has(x)));
  S.looks.forEach(l=>{l.itemIds=l.itemIds.filter(x=>!set.has(x));l.layout=(l.layout||[]).filter(p=>!set.has(p.itemId))});
  // 整套都刪光了，套裝名稱的紀錄也拿掉
  S.sets=S.sets.filter(st=>!sids.has(st.id)||S.items.some(x=>x.setId===st.id)||S.memory.some(x=>x.setId===st.id));
  await save();closeSheet();renderCloset();toast(ids.length>1?`已刪除 ${ids.length} 件`:'已刪除');
}
// 只刪套裝那一筆：單品變單件，名字拿掉套裝名；錢原本算在套裝裡，所以價格清空（後來加進來、有自己價格的換回原價）
async function delSetOnly(id){
  const i=S.items.find(x=>x.id===id);if(!i)return;
  const sn=i.name||setName(i.setId);
  setMates(i).forEach(m=>{
    const own=money(m.ownPrice);m.setId=null;m.price=own?String(own):'';delete m.ownPrice;
    if(m.joinName){m.name=m.joinName;delete m.joinName}
    else if(sn&&m.name.startsWith(sn+'－')&&m.name.length>sn.length+1)m.name=m.name.slice(sn.length+1);
  });
  await delItemsNow([id]);
}

async function makePartStickers(n){
  const q=UI.queue[n];

    }catch(e){ if(e.message==='已取消')break; bad.push(pt.name+'：'+e.message) }

  }
  await setCover(q);q.working=false;renderQueue();

// 套裝的封面：沒有 AI 整套圖時，把每件的貼圖拼在一起，才不會只看到其中一件
async function setCover(q){
  if(!q||!q.isSet||(q.cutout&&q.cutKind==='set'))return;
  const ps=q.parts.filter(p=>p.img);if(!ps.length)return;
  try{
    const ims=await Promise.all(ps.map(p=>loadImg(p.img)));
    const cols=ims.length<=2?ims.length:ims.length<=4?2:3,rows=Math.ceil(ims.length/cols),cell=360,gap=16;
    const c=document.createElement('canvas');c.width=cols*cell+(cols-1)*gap;c.height=rows*cell+(rows-1)*gap;
    const x=c.getContext('2d');
    ims.forEach((im,k)=>{
      const r=Math.min(cell/im.width,cell/im.height),w=im.width*r,h=im.height*r;
      const cx=(k%cols)*(cell+gap),cy=((k/cols)|0)*(cell+gap);
      x.drawImage(im,cx+(cell-w)/2,cy+(cell-h)/2,w,h);
    });
    q.cutout=c.toDataURL('image/png');q.cutSrc=null;q.cutMask=null;q.cutKind='cover';
  }catch(e){}
}

  const todo=UI.queue.map((q,i)=>q.cutout?-1:i).filter(i=>i>=0);

  const mode=await pickCut(todo.length);
  for(const i of todo)await cutQ(i,mode);
}

  try{

    spendQuota('tag');
    q.name=q.name||r.name||'';
    q.category=r.isSet?'套裝':(r.category||q.category);
    q.isSet=!!r.isSet;
    q.box=!r.isSet&&Array.isArray(r.box)&&r.box.length===4?r.box:null;
    q.parts=(r.parts||[]).map(x=>typeof x==='string'?{name:x,box:null}:{name:x.name,box:x.box||null})
      .filter(x=>x.name).map(x=>({name:x.name,box:x.box,img:null,crop:null}));
    q.colors=r.colors||[];q.styles=r.styles||[];q.motifs=r.motifs||[];
    q.season=r.season||'';q.material=r.material||'';q.holiday=HOL_NAMES.includes(r.holiday)?r.holiday:'';
    // 先做了貼圖才發現是套裝：那張是當單件做的（常常只剩一件），拿掉改逐件做；花掉的 AI 次數退回
    if(q.isSet)dropOneCut(q);
  }catch(e){toast('分析失敗：'+e.message)}
  q.analyzing=false;renderQueue();return true;
}
// 建檔清單：換一張照片（例如購買中到貨，用實物照取代訂單截圖的小圖）。貼圖要重做，名稱、顏色、風格、價格都留著
function qPhoto(n){

function dropOneCut(q){
  if(!q.cutout||q.cutKind!=='one')return;
  q.cutout=null;q.cutSrc=null;q.cutMask=null;q.cutKind='';
  setTimeout(()=>toast('是套裝！剛剛的貼圖是當單件做的，已拿掉，按「逐件做貼圖」每件各自做'),400);
}
async function analyzeAll(){for(let i=0;i<UI.queue.length;i++){if(!UI.queue[i].styles.length&&await analyze(i)===false)break}}

async function commitQueue(){
  // 尺寸一定要選：之後的分析、買前檢查「適合哪隻娃娃」都靠它
  const noSize=UI.queue.map((q,i)=>(q.sizes||[]).length?-1:i).filter(i=>i>=0);
  if(noSize.length){
    renderQueue();
    toast(`有 ${noSize.length} 件還沒選尺寸，選好才能建檔`);
    const el=document.getElementById('qsize'+noSize[0]);
    if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
    return;
  }
  const miss=UI.queue.filter(q=>q.isSet&&q.parts.length&&q.parts.some(p=>!p.img));
  if(miss.length&&!confirm('有套裝還沒逐件做貼圖，拆出來的單品會沒有自己的圖。要繼續嗎？')) return;
  for(const q of UI.queue)await setCover(q);
  // 沒填名稱的：用「主色＋類型」自動取名，標記起來，衣櫃「待補資料」找得到
  // 購買中帶過來的名稱就是使用者取的，不算「可以補充」的名稱
  for(const q of UI.queue)if(!String(q.name||'').trim()){q.name=autoName(q.colors,q.isSet?'套裝':q.category);if(!q.fromShop)q.autoName=true}
  let n=0;
  for(const q of UI.queue){
    const base={price:q.price||'',photo:q.photo,cutout:q.cutout,cutSrc:q.cutSrc||null,cutMask:q.cutMask||null,colors:q.colors,styles:q.styles,motifs:q.motifs,
      season:q.season,holiday:q.holiday||'',material:q.material,sizes:(q.sizes||[]).slice(),series:q.series||'',brand:q.brand||'',shop:q.shop||'',origin:q.origin||'',buyDate:q.buyDate||'',homeDate:q.homeDate||'',note:'',
      keepsake:false,keepsakeReason:'',createdAt:Date.now(),...(q.autoName?{autoName:true}:{})};
    if(q.isSet){
      const sid=uid('s'),nm=q.name||'未命名套裝';
      S.sets.push({id:sid,name:nm,createdAt:Date.now()});
      S.items.push(Object.assign({id:uid('i'),setId:sid,name:nm,category:'套裝'},base));n++;
      const seen={};
      for(const pt of q.parts){
        seen[pt.name]=(seen[pt.name]||0)+1;
        const sfx=seen[pt.name]>1?' '+String.fromCharCode(64+seen[pt.name]):'';
        S.items.push(Object.assign({},base,{
          id:uid('i'),setId:sid,name:`${nm}－${pt.name}${sfx}`,category:partCat(pt),
          photo:pt.crop||q.photo, cutout:pt.img||null, cutSrc:pt.cutSrc||null, cutMask:pt.cutMask||null
        }));n++;
      }
    }else{
      S.items.push(Object.assign({id:uid('i'),setId:null,name:q.name||'未命名',category:q.category},base));n++;
    }
  }
  UI.queue=[];renderQueue();await save();
  toast(`已建檔 ${n} 件`);go('closet');
}

function addToCanvas(id){
  if(UI.canvas.find(p=>p.itemId===id))return;
  UI.canvas.push({itemId:id,x:38,y:30,scale:120,rot:0});
  renderCanvas();
}
// 畫布上的一塊可以是娃衣（itemId）或娃娃本人（dollId）
function pieceSrc(p){if(p.dollId){const d=S.dolls.find(x=>x.id===p.dollId);return d&&d.photo}const it=S.items.find(x=>x.id===p.itemId);return it&&img(it)}
function pieceName(p){if(p.dollId)return (S.dolls.find(x=>x.id===p.dollId)||{}).name||'娃娃';return (S.items.find(x=>x.id===p.itemId)||{}).name||''}
const canvasItemIds=()=>UI.canvas.filter(p=>p.itemId).map(p=>p.itemId);
const canvasDoll=()=>{const p=UI.canvas.find(p=>p.dollId);return p?p.dollId:null};
function addDollToCanvas(id){
  UI.canvas=UI.canvas.filter(p=>!p.dollId);
  UI.canvas.unshift({dollId:id,x:50,y:56,scale:240,rot:0});
  UI.selPc=null;renderCanvas();toast('娃娃放在最底層，把衣服拖到身上試穿看看');
}
const pcTf=p=>`translate(-50%,-50%) rotate(${p.rot}deg)${p.flip?' scaleX(-1)':''}`;
function renderCanvas(){
  const c=document.getElementById('canvas');
  c.innerHTML=UI.canvas.map((p,n)=>{
    const src=pieceSrc(p);if(!src)return '';
    return `<div class="pc ${p.dollId?'doll':''} ${UI.selPc===n?'sel':''}" data-n="${n}" style="left:${p.x}%;top:${p.y}%;width:${p.scale}px;transform:${pcTf(p)};z-index:${n+1}">
      <img src="${src}" alt="">${UI.selPc===n?'<i class="rh" title="旋轉／縮放"></i>':''}</div>`;
  }).join('');
  bindDrag();
  const ct=document.getElementById('pcCtrl');
  if(UI.selPc!=null&&UI.canvas[UI.selPc]){
    const p=UI.canvas[UI.selPc];
    ct.style.display='block';
    document.getElementById('pcName').textContent=pieceName(p);
    document.getElementById('pcScale').value=p.scale;
    document.getElementById('pcRot').value=p.rot;
    document.getElementById('pcRotV').textContent=Math.round(p.rot)+'°';
  }else ct.style.display='none';
}
function bindDrag(){
  const c=document.getElementById('canvas');
  c.querySelectorAll('.pc').forEach(el=>{
    el.onpointerdown=e=>{
      if(e.target.classList.contains('rh'))return;
      e.preventDefault();
      const n=+el.dataset.n;
      if(UI.selPc!==n){UI.selPc=n;renderCanvas()}
      const box=c.getBoundingClientRect();
      const el2=c.querySelector(`.pc[data-n="${n}"]`);
      const move=ev=>{
        if(PINCH.on)return;
        const p=UI.canvas[n];
        p.x=Math.max(2,Math.min(98,((ev.clientX-box.left)/box.width)*100));
        p.y=Math.max(2,Math.min(98,((ev.clientY-box.top)/box.height)*100));
        el2.style.left=p.x+'%';el2.style.top=p.y+'%';
      };
      const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up)};
      document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
    };
  });
  // 右上角的把手：繞著中心拖動，同時旋轉和縮放
  const rh=c.querySelector('.pc.sel .rh');
  if(rh)rh.onpointerdown=e=>{
    e.preventDefault();e.stopPropagation();
    const n=UI.selPc,p=UI.canvas[n],el=rh.parentElement,r=el.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    const a0=Math.atan2(e.clientY-cy,e.clientX-cx),d0=Math.hypot(e.clientX-cx,e.clientY-cy),rot0=p.rot,sc0=p.scale;
    const move=ev=>{
      const a=Math.atan2(ev.clientY-cy,ev.clientX-cx),d=Math.hypot(ev.clientX-cx,ev.clientY-cy);
      p.rot=normDeg(rot0+(a-a0)*180/Math.PI);p.scale=Math.max(40,Math.min(480,sc0*d/Math.max(d0,1)));
      el.style.width=p.scale+'px';el.style.transform=pcTf(p);syncCtrl(p);
    };
    const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up)};
    document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
  };
  // 兩指：旋轉 + 縮放目前選到的那件
  if(!c._pinch){
    c._pinch=1;
    const pts=new Map();
    c.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){pts.set(e.pointerId,e);pinchStart()}});
    c.addEventListener('pointermove',e=>{if(pts.has(e.pointerId)){pts.set(e.pointerId,e);pinchMove()}});
    const end=e=>{pts.delete(e.pointerId);if(pts.size<2)PINCH.on=false};
    c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
    const pair=()=>{const [a,b]=[...pts.values()];return {ang:Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX),d:Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY)}};
    function pinchStart(){
      if(pts.size!==2||UI.selPc==null)return;
      const p=UI.canvas[UI.selPc],q=pair();Object.assign(PINCH,{on:true,a0:q.ang,d0:q.d,rot0:p.rot,sc0:p.scale});
    }
    function pinchMove(){
      if(!PINCH.on||pts.size!==2)return;
      const p=UI.canvas[UI.selPc];if(!p)return;const q=pair();
      p.rot=normDeg(PINCH.rot0+(q.ang-PINCH.a0)*180/Math.PI);p.scale=Math.max(40,Math.min(480,PINCH.sc0*q.d/Math.max(PINCH.d0,1)));
      const el=c.querySelector(`.pc[data-n="${UI.selPc}"]`);if(el){el.style.width=p.scale+'px';el.style.transform=pcTf(p)}
      syncCtrl(p);
    }
  }
}
const PINCH={on:false};
const normDeg=d=>{d=((d+180)%360+360)%360-180;return Math.round(d)};
function syncCtrl(p){
  const s=document.getElementById('pcScale'),r=document.getElementById('pcRot'),v=document.getElementById('pcRotV');
  if(s)s.value=p.scale;if(r)r.value=p.rot;if(v)v.textContent=Math.round(p.rot)+'°';
}
function turnPiece(d,flip,reset){
  const p=UI.canvas[UI.selPc];if(!p)return;
  if(reset)p.rot=0;else if(flip)p.flip=!p.flip;else p.rot=normDeg(p.rot+d);
  const el=document.querySelector(`.pc[data-n="${UI.selPc}"]`);if(el)el.style.transform=pcTf(p);
  syncCtrl(p);
}
function applyCtrl(){
  const p=UI.canvas[UI.selPc];if(!p)return;
  p.scale=+document.getElementById('pcScale').value;
  p.rot=+document.getElementById('pcRot').value;
  const el=document.querySelector(`.pc[data-n="${UI.selPc}"]`);

}
function layerPiece(d){

/* ============================================================

const isMember=()=>acctOn()?S.acct.tier!=='free':!!S.settings.member||trialOn();
// 正式會員（不含試用）
const isPaid=()=>acctOn()?S.acct.tier==='member':!!S.settings.member;

function matchStats(){
  const items=S.items.filter(i=>i.category!=='套裝'),ok=new Set(items.map(i=>i.id));
  const partners={},wearN={},pair={},sid={};items.forEach(i=>{if(i.setId)sid[i.id]=i.setId});
  // 同一套的單品合成一組：跟套裝一起穿只算搭了「一套」，套裝本身也只列一次
  S.wears.forEach(w=>{
    const gs=wearGroups(w).filter(k=>k.startsWith('set:')||ok.has(k));
    gs.forEach(a=>{wearN[a]=(wearN[a]||0)+1;partners[a]=partners[a]||new Set();gs.forEach(b=>{if(a!==b)partners[a].add(b)})});
    for(let i=0;i<gs.length;i++)for(let j=i+1;j<gs.length;j++){const k=[gs[i],gs[j]].sort().join('|');pair[k]=(pair[k]||0)+1}
  });
  const byId=id=>S.items.find(x=>x.id===id);
  // 一組要顯示成哪一件：套裝有「套裝」那筆就用它，沒有就用第一件單品
  const rep=k=>{if(!k.startsWith('set:'))return byId(k);const s0=k.slice(4);return S.items.find(x=>x.setId===s0&&x.category==='套裝')||S.items.find(x=>x.setId===s0)};
  const looks=S.looks.map(l=>({l,n:S.wears.filter(w=>w.lookId===l.id).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,3);
  const versatile=Object.entries(partners).map(([k,s])=>({it:rep(k),n:s.size,w:wearN[k],set:k.startsWith('set:')})).filter(x=>x.it&&x.n).sort((a,b)=>b.n-a.n||b.w-a.w).slice(0,5);
  const combos=Object.entries(pair).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,n])=>({ids:k.split('|').map(x=>(rep(x)||{}).id).filter(Boolean),n}));
  const fav=S.dolls.map(d=>{
    const ws=dollWears(d),cnt={};
    ws.forEach(w=>w.itemIds.forEach(i=>{if(ok.has(i))cnt[i]=(cnt[i]||0)+1}));
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    return top?{d,it:byId(top[0]),n:top[1]}:null;
  }).filter(Boolean);
  return {looks,versatile,combos,fav};
}

  return h;
}

// 免費版：先挑一件主角，再挑同風格／同色系的其他部位；壓箱底加權
function ideaRandom(){
  const pool=ideaPool();if(pool.length<2){toast('合身的娃衣還太少');return}
  const tf=new Set(HOL_FAMS[IDEA.theme]||[]);
  const sleepy=IDEA.scene==='睡覺前'&&!IDEA.custom;
  const dd=S.dolls.find(x=>x.id===IDEA.dollId);
  if(pickSetsOn()){const sets=fitSets(dd);if(sets.length&&Math.random()<.33){const l=sets[Math.floor(Math.random()*sets.length)],st=[...new Set(l.flatMap(i=>(i.styles||[]).map(x=>x.name)))].slice(0,2);
    showIdea({ai:false,ids:l.map(i=>i.id),title:`${setName(l[0].setId)||'整套'}・整套穿`,reason:`直接穿整套「${setName(l[0].setId)||l[0].name}」${st.length?`，是${st.join('、')}的感覺`:''}。想混搭的話，可以把「有套裝就整套」關掉。`,tip:SCENE_TIP[IDEA.scene]&&!IDEA.custom?SCENE_TIP[IDEA.scene]:''});return}}
  const w=i=>1+styleBonus(i,dd)+(IDEA.press&&isPressed(i)?3:0)+(sleepy&&(i.styles||[]).some(x=>x.name==='睡衣風')?8:0)+(IDEA.theme?(i.holiday===IDEA.theme?8:0)+(i.colors||[]).filter(c=>tf.has(colorFam(c))).length*2:0);
  const hist=colorPairs();
  // ctx：已經選好的衣服；新的一件跟它們顏色、風格越搭，越容易被抽中（撞色、風格打架的幾乎不會抽到）
  const pick=(list,ctx)=>{
    if(!list.length)return null;
    const base0=outfitScore(ctx||[],hist);
    const sc=list.map(i=>{let s=w(i);if(ctx&&ctx.length){const d=outfitScore([...ctx,i],hist)-base0;s=d<0?s*Math.max(.03,1+d/5):s+d}
      return s});
    let t=Math.random()*sc.reduce((a,b)=>a+b,0);
    for(let k=0;k<list.length;k++){t-=sc[k];if(t<=0)return list[k]}
    return list[list.length-1];
  };
  const by=slot=>pool.filter(i=>slotOf(i.category)===slot);
  const dress=by('dress'),top=by('top'),bottom=by('bottom');
  // 睡覺前先從睡衣挑、節日主題先從節日服挑，當作主角
  const lead=sleepy?pool.filter(i=>(i.styles||[]).some(x=>x.name==='睡衣風')):IDEA.theme?pool.filter(i=>i.holiday===IDEA.theme&&slotOf(i.category)&&['dress','top','bottom','outer'].includes(slotOf(i.category))):[];
  let useDress,base;
  if(lead.length){base=pick(lead);useDress=slotOf(base.category)==='dress'}
  else{useDress=dress.length&&(!top.length||!bottom.length||Math.random()<.4);base=useDress?pick(dress):pick(top.length?top:pool)}
  const out=[base];
  const add=(slot,p)=>{if(Math.random()<p){const x=pick(by(slot).filter(i=>!out.includes(i)),out);if(x)out.push(x)}};
  if(!useDress&&slotOf(base.category)==='top')add('bottom',1);
  add('outer',.3);add('head',.6);add('socks',.3);add('shoes',.5);add('bag',.3);add('acc',.3);
  const styles=[...new Set(out.flatMap(i=>(i.styles||[]).map(x=>x.name)))].slice(0,2);
  const pressed=out.filter(isPressed);
  const hol=IDEA.theme?out.filter(i=>i.holiday===IDEA.theme).length:0;
  showIdea({ai:false,ids:out.map(i=>i.id),title:IDEA.theme?`${IDEA.theme}${sceneName()}搭配`:HOME_SCENES.includes(sceneName())?`${sceneName()}的${styles[0]||'日常'}造型`:`${sceneName()}的${styles[0]||'日常'}搭配`,
    reason:`以「${base.name}」當主角${out.length>1?`，搭配${out.slice(1).map(i=>'「'+i.name+'」').join('、')}`:''}${styles.length?`，整體是${styles.join('、')}的感覺`:''}。${IDEA.theme?(hol?`用了 ${hol} 件${IDEA.theme}主題的娃衣。`:`衣櫃裡沒有${IDEA.theme}主題的娃衣，所以挑了${(HOL_FAMS[IDEA.theme]||[]).map(f=>famLabel[f]).join('、')}比較多的搭出節日感。`):''}${pressed.length?`其中 ${pressed.length} 件是壓箱底的，剛好讓它們出來透透氣。`:''}`,
    tip:SCENE_TIP[IDEA.scene]&&!IDEA.custom?SCENE_TIP[IDEA.scene]:''});
}

${prefs}下面是衣櫃裡合身的娃衣，格式 id|名稱|類型|顏色|風格|圖案|是否壓箱底：
${list}

${IDEA.theme?`這次是「${IDEA.theme}」主題：有${IDEA.theme}主題的娃衣請優先用，沒有的話用${(HOL_FAMS[IDEA.theme]||[]).map(f=>famLabel[f]).join('、')}等節日配色搭出節日感。
`:''}請搭一套適合${atHome?'今天在家':'這個地點拍照'}的造型，只回傳 JSON，不要其他文字：
{"title":"10字內的造型名稱","itemIds":["只能用清單裡的id"],"reason":"60字內，說明為什麼適合","tip":"40字內的拍照小建議"}
規則：通常是 上衣+下身 或 洋裝，再視情況加帽子、外套、鞋子、配件，3到6件；不要同一個部位放兩件；${IDEA.press?'有標記「壓箱底」的請優先考慮，讓它們有機會出場；':''}每次給不一樣的組合。`;
  try{
    const r=parseJSON(await callAI('idea',prompt));
    const ids=(r.itemIds||[]).filter(i=>pool.some(x=>x.id===i));

function geoGuess(lat,lon){
  const km=q=>Math.hypot((q[1]-lon)*Math.cos(lat*Math.PI/180),q[0]-lat)*111;
  const near=G=>Object.entries(G).map(([r,ps])=>[r,Math.min(...ps.map(km))]).sort((a,b)=>a[1]-b[1])[0];
  const t=near(GEO_TW);if(t&&t[1]<(t[0]==='金門縣'||t[0]==='連江縣'?12:35))return {c:'台灣',r:t[0]};
  const a=near(GEO_ABROAD);return a&&a[1]<500?{c:a[0],r:''}:null;
}
// 讀 JPEG 的 EXIF GPS（很多手機選照片時會拿掉定位，讀不到就算了）
// 照片的拍攝地點和日期（EXIF）；都讀不到就是 null
async function photoMeta(file){return {gps:await photoGPS(file),date:await photoDate(file)}}
async function photoDate(file){
  try{
    const v=new DataView(await file.slice(0,262144).arrayBuffer());if(v.getUint16(0)!==0xFFD8)return null;
    let o=2;
    while(o<v.byteLength-4){
      const mk=v.getUint16(o),len=v.getUint16(o+2);
      if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966){
        const t=o+10,le=v.getUint16(t)===0x4949,u16=p=>v.getUint16(t+p,le),u32=p=>v.getUint32(t+p,le);
        const ifd=(p,want)=>{const n=u16(p),r={};for(let k=0;k<n;k++){const e=p+2+k*12,tag=u16(e);if(want.includes(tag))r[tag]={cnt:u32(e+4),val:e+8}}return r};
        const str=x=>{let q=u32(x.val),s='';for(let k=0;k<19;k++)s+=String.fromCharCode(v.getUint8(t+q+k));return s};
        const i0=ifd(u32(4),[0x8769,0x0132]);let raw='';
        if(i0[0x8769]){const e=ifd(u32(i0[0x8769].val),[0x9003,0x9004]);const x=e[0x9003]||e[0x9004];if(x)raw=str(x)}
        if(!raw&&i0[0x0132])raw=str(i0[0x0132]);
        const m=raw.match(/^(\d{4}):(\d\d):(\d\d)/);return m?`${m[1]}-${m[2]}-${m[3]}`:null;
      }
      if((mk&0xFF00)!==0xFF00)break;o+=2+len;
    }
  }catch(e){}
  return null;
}
async function photoGPS(file){
  try{
    const v=new DataView(await file.slice(0,262144).arrayBuffer());
    if(v.getUint16(0)!==0xFFD8)return null;
    let o=2;
    while(o<v.byteLength-4){
      const mk=v.getUint16(o),len=v.getUint16(o+2);
      if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966){
        const t=o+10,le=v.getUint16(t)===0x4949,u16=p=>v.getUint16(t+p,le),u32=p=>v.getUint32(t+p,le);
        const ifd=(p,want)=>{const n=u16(p),r={};for(let k=0;k<n;k++){const e=p+2+k*12,tag=u16(e);if(want.includes(tag))r[tag]={type:u16(e+2),cnt:u32(e+4),val:e+8}}return r};
        const g0=ifd(u32(4),[0x8825])[0x8825];if(!g0)return null;
        const g=ifd(u32(g0.val),[1,2,3,4]);
        const rat=x=>{const p=u32(x.val);return [0,1,2].map(k=>u32(p+k*8)/(u32(p+k*8+4)||1))};
        const dms=a=>a[0]+a[1]/60+a[2]/3600,ch=x=>String.fromCharCode(v.getUint8(t+x.val));
        if(!g[2]||!g[4])return null;
        let lat=dms(rat(g[2])),lon=dms(rat(g[4]));
        if(g[1]&&ch(g[1])==='S')lat=-lat;if(g[3]&&ch(g[3])==='W')lon=-lon;
        return (lat||lon)?{lat,lon}:null;
      }
      if((mk&0xFF00)!==0xFF00)break;o+=2+len;
    }
  }catch(e){}
  return null;
}
function spotText(sp){
  sp=spNorm(sp);if(!sp)return '';
  const place=sp.c===homeCountry()?(sp.r||sp.c):(sp.r?`${sp.c} ${sp.r}`:sp.c);
  return sp.n?`${place}・${sp.n}`:place;
}
// 所有出門紀錄：娃娃身上的出門日＋沒選娃娃的出門穿搭
function footprints(){
  const out=[];
  S.dolls.forEach(d=>(d.outs||[]).forEach(date=>out.push({d,date,sp:spNorm((d.outPlaces||{})[date])})));
  S.wears.filter(w=>w.place==='出門'&&!w.dollId).forEach(w=>out.push({d:null,date:w.date,sp:spNorm(w.spot),name:w.dollName}));
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}
// 解鎖用的 key：自己國家算到縣市，國外算到國家
const spKey=sp=>sp?(isAbroad(sp)?'c:'+sp.c:(sp.r?'r:'+sp.r:'')):'';
function recentSpots(){
  const c={},v={};
  footprints().forEach(f=>{if(!f.sp)return;const k=f.sp.c+'|'+(f.sp.r||'');c[k]=(c[k]||0)+1;v[k]={c:f.sp.c,r:f.sp.r||''}});
  return Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,6).map(k=>v[k]);
}

let TRIP={};
// 補記以前的出門：從照片讀拍攝日期和地點，照片也放進相簿
async function tripPhoto(ev){
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  const [ph,meta]=await Promise.all([compress(f),photoMeta(f)]);
  TRIP.photo=ph;const found=[];
  if(meta.date&&meta.date<=today()){TRIP.date=meta.date;found.push('日期 '+meta.date.replace(/-/g,'/'))}
  if(meta.gps){const g=geoGuess(meta.gps.lat,meta.gps.lon);if(g){TRIP.sp={...TRIP.sp,c:g.c,r:g.r||''};found.push('地點 '+spotText(g))}}
  TRIP.found=found.length?`從照片帶入了${found.join('、')}。`:'這張照片沒有日期和地點資訊，請自己選。';
  redrawTrip();toast(found.length?'已從照片帶入':'照片沒有日期和地點資訊');
}
function openTrip(dollId,date,from){
  const d=S.dolls.find(x=>x.id===dollId);if(!d)return;
  const old=date&&(d.outPlaces||{})[date];
  TRIP={dollId,date:date||today(),orig:date&&(d.outs||[]).includes(date)?date:null,sp:spNorm(old)?{...spNorm(old)}:{c:'',r:'',n:''},from:from||'doll'};
  redrawTrip();
}
function redrawTrip(){
  const dollId=TRIP.dollId,from=TRIP.from,d=S.dolls.find(x=>x.id===dollId);if(!d)return;
  openSheet(`${from==='doll'?`<div class="sethead"><button onclick="openDoll('${dollId}')">‹ ${esc(d.name)}</button></div>`:''}

}
async function saveTrip(){
  const d=S.dolls.find(x=>x.id===TRIP.dollId);if(!d||!TRIP.date)return;
  d.outs=d.outs||[];d.outPlaces=d.outPlaces||{};
  if(TRIP.orig&&TRIP.orig!==TRIP.date){d.outs=d.outs.filter(x=>x!==TRIP.orig);delete d.outPlaces[TRIP.orig]}
  if(!d.outs.includes(TRIP.date))d.outs.push(TRIP.date);
  const sp=spSave(TRIP.sp);
  if(sp)d.outPlaces[TRIP.date]=sp;else delete d.outPlaces[TRIP.date];
  if(TRIP.photo)S.wears.push({id:uid('w'),date:TRIP.date,dollId:d.id,dollName:d.name,itemIds:[],photo:TRIP.photo,place:'出門',spot:sp||null,createdAt:Date.now()});
  await save();tripDone(d,sp?`${d.name} 去了 ${spotText(sp)}！`:`${d.name} 出門了！`);
}
async function delTrip(){
  const d=S.dolls.find(x=>x.id===TRIP.dollId);if(!d||!confirm('刪除這次出門紀錄？'))return;
  d.outs=(d.outs||[]).filter(x=>x!==TRIP.orig);if(d.outPlaces)delete d.outPlaces[TRIP.orig];
  await save();tripDone(d,'已刪除');

// 足跡地圖：maps/ 裡是預先投影好的 SVG 路徑（台灣縣市、世界各國）。去越多次顏色越深
const MAPS={};
function loadMap(k){return MAPS[k]||(MAPS[k]=fetch('maps/'+k+'.json?v='+APP_VER).then(r=>r.json()).catch(e=>{delete MAPS[k];throw e}))}
const heat=n=>n>=7?4:n>=4?3:n>=2?2:n?1:0;

function fillMaps(){
  document.querySelectorAll('.fmap[data-map]:not(.done)').forEach(async el=>{
    el.classList.add('done');
    try{
      const m=await loadMap(el.dataset.map),cnt=JSON.parse(el.dataset.cnt||'{}'),home=el.dataset.home,world=el.dataset.map==='world';
      const hit=f=>world?(f.n||[]).reduce((a,n)=>a+(cnt[n]||0),0):(cnt[f.n]||0);

function candSet(){
  const sure=WEAR.cands.filter(c=>c.score>=70).map(c=>S.items.find(i=>i.id===c.id)).filter(i=>i&&i.setId);
  if(!sure.length)return null;
  const cnt={};sure.forEach(i=>cnt[i.setId]=(cnt[i.setId]||0)+1);
  const [sid,n]=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const conf=WEAR.cands.filter(c=>c.score>=70).length;
  if(n<2&&!(n===1&&conf===1))return null;
  if(n<conf/2)return null;
  const got=new Set(WEAR.cands.map(c=>c.id));
  const rest=S.items.filter(i=>i.setId===sid&&i.category!=='套裝'&&!got.has(i.id));
  return rest.length?{sid,name:setName(sid),n,rest}:null;
}

function togglePick(id){
  WEAR.picked=WEAR.picked.includes(id)?WEAR.picked.filter(x=>x!==id):[...WEAR.picked,id];
  if(WEAR.cands){drawWearSheet();return}
  document.querySelectorAll(`#wlist button[data-id="${id}"]`).forEach(b=>b.classList.toggle('on',WEAR.picked.includes(id)));
  const p=document.getElementById('wpicked');if(p)p.innerHTML=wearPickedHTML();

// 某隻娃娃某天的出門，如果已經沒有任何出門的穿搭紀錄撐著，就從足跡拿掉（編輯改日期／改在家時用）
function unlinkOuting(dollId,date,exceptId){
  const d=S.dolls.find(x=>x.id===dollId);if(!d||!date)return;
  if(S.wears.some(w=>w.id!==exceptId&&w.dollId===dollId&&w.date===date&&w.place==='出門'))return;
  d.outs=(d.outs||[]).filter(t=>t!==date);if(d.outPlaces)delete d.outPlaces[date];
}
async function commitWear(){
  if(!WEAR.picked.length&&WEAR.place!=='上班'){toast('至少選一件');return}
  const sp=WEAR.place==='出門'?spSave(WEAR.sp):null;
  if(WEAR.editId){
    const w=S.wears.find(x=>x.id===WEAR.editId);if(!w)return;
    const old={date:w.date,dollId:w.dollId,place:w.place};
    const d0=WEAR.dollId&&S.dolls.find(x=>x.id===WEAR.dollId);
    Object.assign(w,{note:(WEAR.note||'').trim(),date:WEAR.date,dollId:WEAR.dollId||null,dollName:d0?d0.name:WEAR.doll,itemIds:WEAR.picked.slice(),photo:WEAR.photo,place:WEAR.place||'',rid:WEAR.place==='上班'?(rById(WEAR.rid)||R0()).id:undefined,spot:sp});
    if(old.place==='出門'&&old.dollId&&(old.date!==w.date||old.dollId!==w.dollId||w.place!=='出門'))unlinkOuting(old.dollId,old.date,w.id);
    if(w.place==='出門'&&w.dollId){const d=S.dolls.find(x=>x.id===w.dollId);if(d){d.outs=d.outs||[];if(!d.outs.includes(w.date))d.outs.push(w.date);if(sp){d.outPlaces=d.outPlaces||{};d.outPlaces[w.date]=sp}}}
    await save();
    if(UI.tab==='home')renderHome();else if(UI.tab==='wear')renderWears();else if(UI.tab==='album')renderAlbum();
    openWearDetail(w.id);toast('已更新這筆紀錄');return;
  }
  S.wears.push({id:uid('w'),date:WEAR.date,dollName:WEAR.doll,dollId:WEAR.dollId||null,itemIds:WEAR.picked.slice(),lookId:null,photo:WEAR.photo,note:(WEAR.note||'').trim(),place:WEAR.place||'',...(WEAR.place==='上班'?{rid:(rById(WEAR.rid)||R0()).id}:{}),spot:sp});
  // 選「出門」就順便記一次帶出門，地點也記到娃娃的足跡
  if(WEAR.place==='出門'&&WEAR.dollId){const d=S.dolls.find(x=>x.id===WEAR.dollId);if(d){d.outs=d.outs||[];if(!d.outs.includes(WEAR.date))d.outs.push(WEAR.date);if(sp){d.outPlaces=d.outPlaces||{};d.outPlaces[WEAR.date]=sp}}}
  const wid=S.wears[S.wears.length-1].id;
  await save();if(UI.tab==='home')renderHome();else renderWears();
  const nw=S.wears[S.wears.length-1];
  if(WEAR.place==='上班'&&!WEAR.picked.length&&!WEAR.photo){const wr=rById(WEAR.rid)||R0();if(isOT(nw)){openOtCheer(wid);return}closeSheet();toast(`已記錄：今天一起${workLbl(wr)} ${workIcon(wr)}`);return}
  openShare('wear',wid);toast(isOT(nw)?otCheer(nw.dollName||'娃娃',rOf(nw)):'已記錄！要不要做成小卡分享？');
}

/* ---- 會員：年度回顧「娃娃的一年」----

function yearStats(y){
  y=String(y);const wsAll=S.wears.filter(w=>(w.date||'').startsWith(y)),ws=wsAll.filter(isOutfit);
  const fp=footprints().filter(f=>f.date.startsWith(y)),places=new Set(fp.map(f=>spKey(f.sp)).filter(Boolean));
  const items=S.items.filter(i=>i.category!=='套裝'&&(i.homeDate||i.buyDate||ymd(i.createdAt||0)).startsWith(y));
  const dolls=S.dolls.filter(d=>(d.home||'').startsWith(y));
  const ic={},dc={},mc={},grp={};
  // 整套都穿到才算整套一筆；只穿一部分就算那幾件
  ws.forEach(w=>{wearGroups(w).forEach(k=>{if(!grp[k])grp[k]=k.startsWith('set:')?grpRep(k):anyItem(k);ic[k]=(ic[k]||0)+1});
    const m=+w.date.slice(5,7);mc[m]=(mc[m]||0)+1});
  wsAll.forEach(w=>{if(w.dollId)dc[w.dollId]=(dc[w.dollId]||0)+1});
  const fav=Object.entries(ic).map(([k,n])=>{let it=grp[k],name=it&&it.name;
      if(k.startsWith('set:')){const sid=k.slice(4),par=S.items.find(i=>i.setId===sid&&i.category==='套裝');name=setName(sid)||(par&&par.name)||name;if(par&&img(par))it=par}
      return {it,n,name}}).filter(x=>x.it&&!(x.it.category==='套裝'&&!x.name)).sort((a,b)=>b.n-a.n).slice(0,3);
  const mvp=Object.entries(dc).map(([id,n])=>({d:S.dolls.find(d=>d.id===id),n})).filter(x=>x.d).sort((a,b)=>b.n-a.n)[0]||null;
  const busy=Object.entries(mc).sort((a,b)=>b[1]-a[1])[0];
  const spend=[...S.items,...S.memory].filter(i=>(i.homeDate||i.buyDate||ymd(i.createdAt||0)).startsWith(y)).reduce((a,i)=>a+priceOf(i),0);
  // 陪上班：這一年一起去了幾天、最佳同事
  // 每個日常各自算（天數多的在前）
  const works=routines().map(rt=>{const wk=wsAll.filter(w=>isWork(w)&&rOf(w).id===rt.id),wkc={};
    wk.forEach(w=>{if(w.dollId)(wkc[w.dollId]=wkc[w.dollId]||new Set()).add(w.date)});
    const mate=Object.entries(wkc).map(([id,st])=>({d:S.dolls.find(d=>d.id===id),n:st.size})).filter(x=>x.d).sort((a,b)=>b.n-a.n)[0]||null;
    const oc={};wk.filter(isOT).forEach(w=>{if(w.dollId)(oc[w.dollId]=oc[w.dollId]||new Set()).add(w.date)});
    const otMate=Object.entries(oc).map(([id,st])=>({d:S.dolls.find(d=>d.id===id),n:st.size})).filter(x=>x.d).sort((a,b)=>b.n-a.n)[0]||null;
    return {r:rt,days:new Set(wk.map(w=>w.date)).size,mate,ot:new Set(wk.filter(isOT).map(w=>w.date)).size,otMate}}).filter(x=>x.days).sort((a,b)=>b.days-a.days);
  return {works,work:works[0]||null,y:+y,newDolls:dolls.slice().sort((a,b)=>(a.home||'').localeCompare(b.home||'')),months:Array.from({length:12},(_,i)=>mc[i+1]||0),wears:ws.length,outs:fp.length,places:places.size,items:items.length,dolls:dolls.length,fav,mvp,busy:busy?+busy[0]:0,spend};
}

// 在預覽上拖曳照片，調整裁切的位置
function scDragInit(){
  const im=document.getElementById('scImg');if(!im||!SC.photo||SC.ann)return;
  let st=null,t=0;
  im.style.touchAction='none';im.style.cursor='grab';
  im.onpointerdown=e=>{st={x:e.clientX,y:e.clientY,p:{...(SC.pos||{x:.5,y:.5})}};im.setPointerCapture(e.pointerId)};
  im.onpointermove=e=>{if(!st)return;const r=im.getBoundingClientRect();
    SC.pos={x:Math.min(1,Math.max(0,st.p.x-(e.clientX-st.x)/r.width*1.6)),y:Math.min(1,Math.max(0,st.p.y-(e.clientY-st.y)/r.height*1.6))};
    const n=Date.now();if(n-t>140){t=n;scRender(true)}};
  im.onpointerup=im.onpointercancel=()=>{if(st){st=null;scRender()}};
}
async function scRender(){

async function scDownload(){

async function scShare(){

const FAM_HEX={'粉':'#F2A7BC','紅':'#D9534F','橘':'#F0A04B','黃':'#F2D14B','綠':'#7FB77E','藍':'#6C9BD2','紫':'#A98BC9','米':'#E8D8BE','棕':'#9C7456','白':'#FFFFFF','黑':'#2B2B2B','灰':'#A7A7A7'};
// 每隻娃娃的穿搭輪廓：穿過哪些類型、風格、顏色（用穿搭紀錄算）
function dollProfile(d){
  const ws=dollWears(d),cat={},sty={},fam={},seen=new Set();
  ws.filter(isOutfit).forEach(w=>{wearGroups(w).forEach(k=>{const id=k;
    const i=k.startsWith('set:')?grpRep(k):anyItem(k);if(!i)return;
    cat[i.category]=(cat[i.category]||0)+1;
    (i.styles||[]).forEach(x=>sty[x.name]=(sty[x.name]||0)+1);
    new Set((i.colors||[]).map(colorFam)).forEach(f=>{if(famLabel[f])fam[f]=(fam[f]||0)+1});
    seen.add(id);
  })});
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
  return {d,wears:ws.length,outs:outCount(d),items:seen.size,cats:top(cat),styles:top(sty),fams:top(fam),total:Object.values(cat).reduce((a,b)=>a+b,0)};
}

// 名稱裡的關鍵字（中文兩個字一組），例如「暖呼呼小狗毛呢大衣」→ 小狗、毛呢、大衣…
const NAME_STOP=new Set(['套裝','娃衣','一套','單品','公分','系列','同款']);
function nameGrams(n){
  const out=new Set();String(n||'').split(/[^一-鿿A-Za-z0-9]+/).forEach(w=>{
    if(/^[A-Za-z0-9]+$/.test(w)){if(w.length>=3)out.add(w.toLowerCase());return}
    for(let k=0;k+1<w.length;k++){const g=w.slice(k,k+2);if(!NAME_STOP.has(g))out.add(g)}});
  return out;
}
// 本機比對：名稱關鍵字、類型、顏色、風格、圖案重疊越多分數越高
function buyScore(t,i){
  let s=0;
  // 名稱關鍵字最能分出「是不是同一件」，比風格、顏色重要
  if(!t._g)t._g=nameGrams(t.name);
  const ig=nameGrams(i.name+' '+setName(i.setId));
  s+=Math.min(12,[...t._g].filter(g=>ig.has(g)).length*4);
  if(t.isSet&&i.category==='套裝')s+=5;
  if(t.category!=='套裝'){
    if(i.category===t.category)s+=4;else if(slotOf(i.category)&&slotOf(i.category)===slotOf(t.category))s+=2;
  }
  const tc=new Set(t.colors.map(colorFam));
  s+=Math.min(4,(i.colors||[]).filter(c=>tc.has(colorFam(c))).length*2);
  const ts=new Set(t.styles.map(x=>x.name));
  s+=(i.styles||[]).filter(x=>ts.has(x.name)).length*1.5;
  const tm=new Set(t.motifs);
  s+=(i.motifs||[]).filter(m=>tm.has(m)).length*2;
  return s;
}

async function buyCompare(){
  const t=BUY.t,z=BUY.size;
  const pool=S.items.filter(i=>(i.category!=='套裝'||t.isSet)&&sizeOK(i.sizes,z));
  // 別的尺寸有很像的：不送 AI 看圖，只用名稱和標籤找，另外列出來
  BUY.other=z?S.items.filter(i=>(i.category!=='套裝'||t.isSet)&&!sizeOK(i.sizes,z)).map(i=>({i,s:buyScore(t,i)})).filter(x=>x.s>=10&&img(x.i)).sort((a,b)=>b.s-a.s).slice(0,3):[];
  // 選到整套時，它拆出來的單品就不用再比一次（省下位置給其他候選）
  const ranked=pool.map(i=>({i,s:buyScore(t,i)})).filter(x=>x.s>=3&&img(x.i)).sort((a,b)=>b.s-a.s),cands=[],usedSet=new Set();
  for(const x of ranked){if(cands.length>=10)break;if(x.i.setId&&usedSet.has(x.i.setId))continue;if(x.i.category==='套裝'&&x.i.setId)usedSet.add(x.i.setId);cands.push(x)}
  // 以前賣掉／送走的也拿來比：很像的話提醒，避免買了又賣
  const sold=S.memory.filter(i=>GONE_REASONS.includes(i.reason)&&(i.category!=='套裝'||t.isSet)&&sizeOK(i.sizes,z))
    .map(i=>({i,s:buyScore(t,i)})).filter(x=>x.s>=3&&img(x.i)).sort((a,b)=>b.s-a.s).slice(0,3);
  let verdict=[];
  const all=[...cands,...sold];
  if(all.length){
    buyStep(`跟衣櫃裡${sold.length?'和以前賣掉的':''}最像的 ${all.length} 件比對中…`);
    // 一次送太多張容易失敗：失敗就自動少送幾張再試一次
    const run=async(list,big,small)=>{
      const imgs=[await thumb(BUY.photo,big),...await Promise.all(list.map(x=>thumb(img(x.i),small)))];
      const out=parseJSON(await callAIImgs('buy',buyPrompt(list.length),imgs));
      const arr=Array.isArray(out)?out:(Object.values(out||{}).find(Array.isArray)||[]);
      if(!arr.length)throw new Error('AI 沒有回傳比對結果');
      return arr;
    };
    BUY.cmpErr='';
    try{
      const arr=await run(all,512,320);
      verdict=arr.map(v=>({...v,it:all[(+v.n)-1]?.i,sold:(+v.n)>cands.length})).filter(v=>v.it);
    }catch(e){
      try{
        const few=[...cands.slice(0,5),...sold.slice(0,1)];
        buyStep(`再試一次，這次只比最像的 ${few.length} 件…`);
        const arr=await run(few,448,256),nc=Math.min(cands.length,5);
        verdict=arr.map(v=>({...v,it:few[(+v.n)-1]?.i,sold:(+v.n)>nc})).filter(v=>v.it);
      }catch(e2){BUY.cmpErr=e2.message||e.message||'未知錯誤'}
    }
  }
  BUY.verdict=verdict.filter(v=>!v.sold);BUY.soldV=verdict.filter(v=>v.sold);BUY.cands=cands;BUY.sold=sold;
  renderBuy();
  // 比對失敗就不扣次數（上面還是會先顯示標籤算出來的結果）
  return !BUY.cmpErr;
}

/* ============================================================
   10b. 花費分析（會員功能）
   ============================================================ */
const money=v=>+String(v??'').replace(/[^\d.]/g,'')||0;
const fmt$=n=>'$'+Math.round(n).toLocaleString();
function spendStats(){
  // 花費：衣櫃裡的＋回憶箱裡的（錢已經花了）；一套只算一次
  const all=[...S.items,...S.memory],pi=all.filter(i=>priceOf(i)>0);
  const clothes=pi.reduce((a,i)=>a+priceOf(i),0);
  const dolls=S.dolls.reduce((a,d)=>a+money(d.price),0);
  const saved=S.wish.filter(w=>w.status==='skip').reduce((a,w)=>a+money(w.price),0);
  // 最近 12 個月，娃衣看購入日期（沒填就用建檔日），娃娃看到家日
  const now=new Date(),months=[];
  for(let k=11;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,m:d.getMonth()+1,v:0})}
  const add=(date,v)=>{const b=months.find(x=>x.key===(date||'').slice(0,7));if(b)b.v+=v};
  const ds=t=>t?new Date(t).toISOString().slice(0,10):'';
  pi.forEach(i=>add(i.buyDate||ds(i.createdAt),priceOf(i)));
  S.dolls.forEach(d=>{if(money(d.price))add(d.home||ds(d.createdAt),money(d.price))});
  // 每穿一次的成本：衣櫃裡的，以「組」算（套裝整套一個價格，穿到其中任何一件就算穿了一次）
  const gw=setUseCount(),seen=new Set(),cpw=[];
  S.items.filter(i=>priceOf(i)>0).forEach(i=>{const k=grpKey(i);if(seen.has(k))return;seen.add(k);
    const it=grpRep(k)||i,w=gw[k]||0,p=priceOf(i);cpw.push({it,p,w,c:p/Math.max(w,1),set:k.startsWith('set:')})});
  const worn=cpw.filter(x=>x.w>0),wornSum=worn.reduce((a,x)=>a+x.p,0),wornN=worn.reduce((a,x)=>a+x.w,0);
  const byCat={};pi.forEach(i=>{const c=i.category;byCat[c]=(byCat[c]||0)+priceOf(i)});
  return {clothes,dolls,saved,months,priced:pi.length,
    avg:wornN?wornSum/wornN:0,
    best:worn.sort((a,b)=>a.c-b.c).slice(0,3),
    idle:cpw.filter(x=>x.w===0).sort((a,b)=>b.p-a.p).slice(0,3),
    cats:Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,5)};
}
// 回血：賣掉的娃衣收回多少錢（買價算整套那一筆，一起移進來的單品不重複算）
function soldStats(){
  const sold=S.memory.filter(i=>i.reason==='賣掉了'&&!i.groupOf);
  const back=sold.reduce((a,i)=>a+money(i.soldPrice),0);
  const withBoth=sold.filter(i=>priceOf(i)>0&&money(i.soldPrice)>0);
  const cost=withBoth.reduce((a,i)=>a+priceOf(i),0),got=withBoth.reduce((a,i)=>a+money(i.soldPrice),0);
  const spentAll=[...S.items,...S.memory].reduce((a,i)=>a+priceOf(i),0);
  const y=today().slice(0,4),yearBack=sold.filter(i=>(i.archivedAt||'').startsWith(y)).reduce((a,i)=>a+money(i.soldPrice),0);
  return {n:sold.length,back,yearBack,rate:cost?got/cost:0,spentAll,net:spentAll-back,
    list:sold.filter(i=>money(i.soldPrice)>0).sort((a,b)=>(b.archivedAt||'').localeCompare(a.archivedAt||'')).slice(0,5)};
}
function soldSection(){
  const r=soldStats();if(!r.n)return `<p class="mh">賣出回血</p><div class="hint">賣掉的娃衣移到回憶箱時填上賣出價格，這裡會算回收了多少。只算娃衣，娃娃離開不算回血。</div>`;
  const th=it=>`<div class="th">${img(it)?`<img src="${img(it)}" alt="">`:''}</div>`;
  return `<p class="mh">賣出回血</p><p class="hint" style="margin:-4px 0 10px">只算娃衣。娃娃離開不是回血，賣出的價格只留在那隻娃娃的道別紀錄裡。</p>
  <div class="stat">
    <div><b>${fmt$(r.back)}</b><span>賣出回收・${r.n} 筆</span></div>
    <div><b>${r.rate?Math.round(r.rate*100)+'%':'—'}</b><span>平均回收買價</span></div>
    <div><b>${fmt$(r.yearBack)}</b><span>今年回收</span></div>
    <div><b>${fmt$(Math.max(0,r.net))}</b><span>扣掉回血的淨花費</span></div></div>
  ${r.list.length?`<div class="blist">${r.list.map(i=>{const p=priceOf(i),sp=money(i.soldPrice);return `<div class="rowitem" onclick="go('memory')">${th(i)}
    <div class="tx"><b>${esc(nameOf(i))}</b><span>${p?`買 ${fmt$(p)} → `:''}賣 ${fmt$(sp)}${p?`・回收 ${Math.round(sp/p*100)}%`:''}・${esc(i.archivedAt||'')}</span></div><div class="rt">›</div></div>`}).join('')}</div>`:''}`;
}
function spendSection(){
  const head=`<h2 class="sec" data-sec="spend">花費分析 <span class="vip">會員</span></h2>`;
  if(!isMember())return head+`<div class="locked">
    <div class="lk-blur">
      <div class="rowitem"><div class="th"></div><div class="tx"><b>娃衣花費 $12,480</b><span>平均每穿一次 $86</span></div></div>
      <div class="rowitem"><div class="th"></div><div class="tx"><b>最划算：白色蕾絲襯衫</b><span>每穿一次 $24</span></div></div>
      <div class="rowitem"><div class="th"></div><div class="tx"><b>買了還沒穿：小熊斗篷</b><span>$780</span></div></div>
    </div>
    <div class="lk-cover"><b>這件衣服，每穿一次花多少錢？</b>
      <span>每月花費、平均每穿一次的成本、最划算和買了還沒穿的娃衣，還有賣掉娃衣回血多少</span>
      <button class="btn" onclick="openMember()">了解會員</button></div></div>`;
  const s=spendStats(),max=Math.max(...s.months.map(m=>m.v),1),tot=s.months.reduce((a,m)=>a+m.v,0);
  if(!s.priced&&!s.dolls&&!soldStats().n)return head+`<div class="hint">在單品的「編輯」填上價格，或在娃娃資料填金額，這裡就會開始計算。</div>`;
  const peak=s.months.reduce((a,m)=>m.v>a.v?m:a,s.months[0]);
  let h=head+`<div class="stat">
    <div><b>${fmt$(s.clothes)}</b><span>娃衣花費・${s.priced} 筆有價格（套裝算一筆）</span></div>
    <div><b>${fmt$(s.dolls)}</b><span>娃娃花費</span></div>
    <div><b>${s.avg?fmt$(s.avg):'—'}</b><span>平均每穿一次</span></div>
    <div><b>${fmt$(s.saved)}</b><span>忍住沒買省下</span></div></div>
  <div class="mchart">
    <div class="mcap" id="mcap">最近 12 個月共 <b>${fmt$(tot)}</b></div>
    <div class="mbars">${s.months.map(m=>`<button class="mcol" data-t="${m.m} 月：${fmt$(m.v)}" aria-label="${m.m} 月花費 ${fmt$(m.v)}"
      onmouseenter="mcap(this)" onfocus="mcap(this)" onclick="mcap(this)" onmouseleave="mcap()">
      <i style="height:${m.v?Math.max(3,m.v/max*88):0}%">${m===peak&&m.v?`<em>${fmt$(m.v)}</em>`:''}</i></button>`).join('')}</div>
    <div class="mlab">${s.months.map((m,i)=>`<span>${i%2?'':m.m+'月'}</span>`).join('')}</div>
  </div>`;
  const th=it=>`<div class="th">${img(it)?`<img src="${img(it)}" alt="">`:''}</div>`;
  if(s.best.length)h+=`<p class="mh">最划算的娃衣</p><div class="blist">${s.best.map(x=>`<div class="rowitem" onclick="openItem('${x.it.id}')">${th(x.it)}
    <div class="tx"><b>${esc(nameOf(x.it))}</b><span>每穿一次 ${fmt$(x.c)}・穿了 ${x.w} 次・${fmt$(x.p)}</span></div><div class="rt">›</div></div>`).join('')}</div>`;
  if(s.idle.length)h+=`<p class="mh">買了還沒穿過</p><div class="blist">${s.idle.map(x=>`<div class="rowitem" onclick="openItem('${x.it.id}')">${th(x.it)}
    <div class="tx"><b>${esc(nameOf(x.it))}</b><span>${fmt$(x.p)}・穿一次就回本一點</span></div><div class="rt">›</div></div>`).join('')}</div>`;
  if(s.cats.length){const cm=s.cats[0][1];h+=`<p class="mh">花最多的類型</p>${s.cats.map(([k,v])=>`<div class="bar"><div class="lb"><span>${esc(k)}</span><em>${fmt$(v)}</em></div>
    <div class="track"><i class="worn" style="width:${v/cm*100}%"></i></div></div>`).join('')}`}
  h+=soldSection();
  return h;
}
function mcap(el){
  const c=document.getElementById('mcap');if(!c)return;
  if(el){c.innerHTML=`<b>${el.dataset.t}</b>`;document.querySelectorAll('.mcol').forEach(b=>b.classList.toggle('on',b===el))}
  else{c.innerHTML=c.dataset.d||c.innerHTML;document.querySelectorAll('.mcol').forEach(b=>b.classList.remove('on'))}
}

function applyTheme(){
  const t=S.settings.theme||'light';
  const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.querySelector('meta[name=theme-color]').content=dark?'#1C1719':'#F5F0EB';
  try{localStorage.setItem('theme',t)}catch(e){}
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.settings.theme==='auto')applyTheme()});
async function setTheme(t){
  S.settings.theme=t;applyTheme();
  document.querySelectorAll('#s_theme button').forEach((b,i)=>b.classList.toggle('on',['light','dark','auto'][i]===t));
  await save();
}
async function toggleCat(btn,f){
  const h=S.settings.hiddenCats=S.settings.hiddenCats||[];
  if(h.includes(f))h.splice(h.indexOf(f),1);else h.push(f);
  btn.classList.toggle('on',!h.includes(f));
  await save();
}
async function addCat(){
  const el=document.getElementById('s_newcat'),c=el.value.trim();
  if(!c)return;
  if(allCats().includes(c)||filterNames().includes(c)){toast('已經有這個類別');return}
  readForm();S.settings.customCats=[...customCats(),c];await save();openSettings('cats');toast('已新增 '+c);
}
async function delCat(c){
  const used=S.items.filter(i=>i.category===c).length;
  if(!confirm(used?`有 ${used} 件娃衣是「${c}」，刪除後會改成「其他」。確定嗎？`:`刪除類別「${c}」？`))return;
  readForm();
  S.settings.customCats=customCats().filter(x=>x!==c);
  S.settings.hiddenCats=(S.settings.hiddenCats||[]).filter(x=>x!==c);
  S.items.forEach(i=>{if(i.category===c)i.category='其他'});
  await save();openSettings('cats');
}
async function addSize(){
  const el=document.getElementById('s_newsize'),z=el.value.trim();
  if(!z)return;
  if(sizes().includes(z)){toast('已經有這個尺寸');return}
  readForm();S.settings.sizes.push(z);await save();openSettings('sizes');toast('已新增 '+z);
}
async function delSize(z){
  const used=S.items.filter(i=>(i.sizes||[]).includes(z)).length;
  if(!confirm(used?`有 ${used} 件娃衣標記為 ${z}，刪除後這些娃衣會拿掉這個尺寸。確定嗎？`:`刪除尺寸 ${z}？`))return;
  readForm();
  S.settings.sizes=sizes().filter(x=>x!==z);
  S.items.forEach(i=>{if(i.sizes)i.sizes=i.sizes.filter(x=>x!==z)});
  S.dolls.forEach(d=>{if(d.size===z)d.size=''});
  await save();openSettings('sizes');
}

  try{const e=await navigator.storage.estimate();const el=document.getElementById('s_usage');
    if(el&&e.usage)el.innerHTML=`・已使用 ${(e.usage/1048576).toFixed(1)} MB`}catch(e){}
}
function toggleSticker(v){

function pickModel(btn,m){

function readForm(){
  const v=k=>{const e=document.getElementById(k);return e?e.value:''};
  const c=cfg();
  // 開發者欄位沒顯示時不要把舊值蓋成空的
  if(document.getElementById('s_endpoint')){
    c.name=v('s_name')||'未命名';
    c.endpoint=v('s_endpoint').trim();
    c.key=v('s_key').trim();
    c.model=v('s_model').trim();
    S.settings.backendUrl=v('s_backend').trim();
  }
  const has=k=>!!document.getElementById(k);
  if(has('s_smode'))S.settings.stickerMode=v('s_smode');
  if(has('s_bgtol'))S.settings.bgTol=+v('s_bgtol')||42;
  if(has('s_edge'))S.settings.stickerEdge=+v('s_edge');
  if(has('s_bgurl')){S.settings.bgUrl=v('s_bgurl')||S.settings.bgUrl;S.settings.bgKey=v('s_bgkey')||S.settings.bgKey}
}

      h=(miss.length?'還沒填：'+miss.join('、'):'必填的都填好了')+'　記帳資料庫'+(j.db?'有':'沒')+'綁・兌換碼 '+(j.codes||0)+' 個・網址白名單'+(j.origins?'有':'沒')+'設';
    }catch(e){h='連不上後台　檢查網址有沒有打對、Worker 有沒有按 Deploy'}

  }

    out.push(['能不能碰到伺服器',reach]);
    let g;
    try{const r=await fetch(apiURL(c.endpoint,'/models'));g='HTTP '+r.status+(r.ok?'　可以讀清單':'　伺服器回了錯誤碼')}
    catch(e){g='被 CORS 擋下　伺服器沒允許這個來源讀 /models'}
    out.push(['讀模型清單',g]);
    let p;

        body:JSON.stringify({model:c.model||'test',max_tokens:8,messages:[{role:'user',content:'hi'}]})});

    }catch(e){p='被 CORS 擋下　伺服器沒回 Access-Control-Allow-Origin'}
    out.push(['對話請求',p]);
  }
