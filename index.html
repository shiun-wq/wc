<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAF6F7">
<title>娃衣衣櫃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3B2E39;
  --ink-2:#6B5A66;
  --muted:#9A8E96;
  --paper:#FAF6F7;
  --card:#FFFFFF;
  --line:#E7DEE3;
  --berry:#C4527A;
  --berry-soft:#F7E9EF;
  --blue:#6E7BA8;
  --sage:#7A9478;
  --amber:#C08A3E;
  --r:14px;
  --tab-h:62px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Hiragino Sans TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","Songti TC","PingFang TC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);background:var(--paper);color:var(--ink);
  font-size:15px;line-height:1.6;overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
img{display:block;max-width:100%}

/* ---------- shell ---------- */
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative}
header.top{
  position:sticky;top:0;z-index:40;background:rgba(250,246,247,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex;align-items:baseline;gap:10px;
}
header.top h1{font-family:var(--serif);font-weight:700;font-size:20px;margin:0;letter-spacing:.02em}
header.top .sub{font-size:12px;color:var(--muted);margin-left:auto}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:active{background:var(--berry-soft)}

main{padding:14px 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 24px)}
.view{display:none}
.view.on{display:block}

nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  max-width:520px;margin:0 auto;background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button.on{color:var(--berry)}

/* ---------- bits ---------- */
h2.sec{font-family:var(--serif);font-size:17px;font-weight:700;margin:26px 0 10px}
h2.sec:first-child{margin-top:4px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card + .card{margin-top:10px}
label.f{display:block;margin-bottom:10px}
label.f > span{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;
}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--berry);outline-offset:-1px;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:11px;background:var(--berry);color:#fff;font-weight:600;font-size:14px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.quiet{background:var(--berry-soft);color:var(--berry)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 2px;margin:0 -16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty strong{display:block;font-family:var(--serif);font-size:16px;color:var(--ink);margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 22px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:120;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1}

/* ---------- wardrobe grid: die-cut on swatch ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.piece{position:relative;text-align:left}
.piece .sw{
  aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;
  background:var(--berry-soft);display:grid;place-items:center;
}
.piece .sw img{width:100%;height:100%;object-fit:contain;padding:9px}
.piece .tag{
  position:absolute;left:7px;bottom:7px;background:rgba(255,255,255,.93);
  border-radius:6px;padding:2px 6px;font-size:10.5px;color:var(--ink-2);letter-spacing:.03em;
}
.piece .keep{position:absolute;right:7px;top:7px;font-size:13px}
.piece .nm{font-size:12.5px;margin-top:6px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.piece .mt{font-size:11px;color:var(--muted)}
.piece.dim .sw{opacity:.55}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:100;display:none}
.sheet.on{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(59,46,57,.42)}
.sheet .panel{
  position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;
  background:var(--paper);border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;
  padding:0 16px calc(24px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(28px)}}
@media (prefers-reduced-motion:reduce){.sheet .panel{animation:none}}
.sheet .grab{position:sticky;top:0;background:var(--paper);padding:10px 0 8px;z-index:2}
.sheet .grab i{display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet h3{font-family:var(--serif);font-size:19px;margin:2px 0 12px}

/* ---------- detail ---------- */
.hero{border-radius:14px;overflow:hidden;background:var(--berry-soft);aspect-ratio:1;display:grid;place-items:center;margin-bottom:12px}
.hero img{width:100%;height:100%;object-fit:contain;padding:16px}
.swap{display:flex;gap:6px;margin-bottom:14px}
.swap button{flex:1;padding:7px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink-2)}
.swap button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
dl.meta{display:grid;grid-template-columns:88px 1fr;gap:7px 12px;margin:0;font-size:13.5px}
dl.meta dt{color:var(--muted);font-size:12.5px}
dl.meta dd{margin:0}
.tagline{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tg{font-size:11.5px;padding:3px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.tg.st{background:var(--berry-soft);border-color:transparent;color:var(--berry)}

/* ---------- intake ---------- */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;background:#fff}
.drop strong{font-family:var(--serif);display:block;margin-bottom:4px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px;margin-bottom:10px;display:flex;gap:11px}
.qcard .th{width:78px;height:78px;flex:0 0 78px;border-radius:10px;background:var(--berry-soft);overflow:hidden}
.qcard .th img{width:100%;height:100%;object-fit:contain}
.qcard .bd{flex:1;min-width:0}
.qcard input[type=text],.qcard select{padding:6px 9px;font-size:13px;border-radius:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.parts button{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink-2)}
.parts button.on{background:var(--berry);border-color:var(--berry);color:#fff}

/* ---------- studio ---------- */
#canvas{position:relative;width:100%;aspect-ratio:3/4;background:
  repeating-linear-gradient(45deg,#fff 0 12px,#FDF9FA 12px 24px);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:none}
.pc{position:absolute;width:120px;transform-origin:center;touch-action:none;user-select:none}
.pc img{width:100%;pointer-events:none;filter:drop-shadow(0 3px 6px rgba(59,46,57,.13))}
.pc.sel{outline:1.5px dashed var(--berry);outline-offset:3px;border-radius:4px}
.ctrl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px;margin-top:10px}
.ctrl input[type=range]{width:100%;accent-color:var(--berry)}
.drawer{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-height:196px;overflow-y:auto;margin-top:10px}
.drawer button{aspect-ratio:1;border-radius:9px;background:var(--berry-soft);overflow:hidden;border:1px solid transparent}
.drawer button img{width:100%;height:100%;object-fit:contain;padding:4px}

/* ---------- picker ---------- */
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{position:relative;aspect-ratio:1;border-radius:10px;background:var(--berry-soft);overflow:hidden;border:2px solid transparent}
.pick button img{width:100%;height:100%;object-fit:contain;padding:5px}
.pick button.on{border-color:var(--berry)}
.pick button.on::after{content:"✓";position:absolute;right:4px;top:2px;color:var(--berry);font-weight:700;font-size:13px}
.pick .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);font-size:9.5px;padding:2px 3px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- insight ---------- */
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{font-family:var(--serif);font-size:26px;display:block;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted)}
.bar{margin-bottom:11px}
.bar .lb{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar .lb em{font-style:normal;color:var(--muted);font-size:12px}
.track{height:9px;border-radius:5px;background:var(--berry-soft);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track i.worn{background:var(--sage)}
.track i.idle{background:#E3D5DC}
.legend{font-size:11.5px;color:var(--muted);display:flex;gap:12px;margin:-4px 0 12px}
.legend s{text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.legend s::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--sage)}
.legend s.b::before{background:#E3D5DC}
.note{background:var(--berry-soft);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.65}
.note + .note{margin-top:9px}
.note strong{color:var(--berry)}

.rowitem{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rowitem:last-child{border:none}
.rowitem .th{width:46px;height:46px;flex:0 0 46px;border-radius:9px;background:var(--berry-soft);overflow:hidden}
.rowitem .th img{width:100%;height:100%;object-fit:contain;padding:3px}
.rowitem .tx{flex:1;min-width:0}
.rowitem .tx b{display:block;font-size:13.5px;font-weight:600}
.rowitem .tx span{font-size:11.5px;color:var(--muted)}
.rowitem .rt{font-size:12px;color:var(--muted);text-align:right;flex:0 0 auto}

.conf{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.conf i{display:block;height:100%;background:var(--sage)}
.conf.low i{background:var(--amber)}

.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.divider{height:1px;background:var(--line);margin:18px 0}
.warn{font-size:12.5px;color:var(--amber);line-height:1.55}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>娃衣衣櫃</h1>
    <span class="sub" id="topsub"></span>
    <button class="iconbtn" onclick="openSettings()" aria-label="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="20" height="20"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H2a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.4-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V2a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H22a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main>
    <!-- 衣櫃 -->
    <section class="view on" id="v-closet">
      <div class="row" style="margin-bottom:10px">
        <input type="text" id="q" placeholder="搜尋名稱、品牌、標籤" oninput="renderCloset()">
      </div>
      <div class="chips" id="catchips"></div>
      <div class="chips" id="viewchips"></div>
      <div id="closetGrid"></div>
    </section>

    <!-- 建檔 -->
    <section class="view" id="v-intake">
      <div class="drop" onclick="document.getElementById('files').click()">
        <strong>選擇照片開始建檔</strong>
        <span class="hint">可一次選多張。照片會在你的裝置上壓縮，不會自動上傳。</span>
      </div>
      <input type="file" id="files" accept="image/*" multiple hidden onchange="onFiles(event)">
      <div id="queue"></div>
      <div id="queueActions"></div>
    </section>

    <!-- 搭配 -->
    <section class="view" id="v-studio">
      <div id="canvas"></div>
      <div class="ctrl" id="pcCtrl" style="display:none">
        <div class="row" style="margin-bottom:8px">
          <b class="grow" id="pcName" style="font-size:13.5px"></b>
          <button class="btn sm ghost" onclick="layerPiece(1)">上移</button>
          <button class="btn sm ghost" onclick="layerPiece(-1)">下移</button>
          <button class="btn sm ghost" onclick="removePiece()">移除</button>
        </div>
        <label class="f"><span>大小</span><input type="range" id="pcScale" min="40" max="300" oninput="applyCtrl()"></label>
        <label class="f" style="margin:0"><span>旋轉</span><input type="range" id="pcRot" min="-180" max="180" oninput="applyCtrl()"></label>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn quiet grow" onclick="openDrawer()">加入娃衣</button>
        <button class="btn ghost" onclick="clearCanvas()">清空</button>
        <button class="btn" onclick="saveLook()">存成 Look</button>
      </div>
      <h2 class="sec">我的 Look</h2>
      <div id="lookList"></div>
    </section>

    <!-- 紀錄 -->
    <section class="view" id="v-wear">
      <button class="btn wide" onclick="openWear()">記錄今天穿了什麼</button>
      <h2 class="sec">穿著紀錄</h2>
      <div id="wearList"></div>
    </section>

    <!-- 洞察 -->
    <section class="view" id="v-insight">
      <div id="insight"></div>
    </section>
  </main>

  <nav class="tabs" id="tabs"></nav>
</div>

<div class="sheet" id="sheet"><div class="scrim" onclick="closeSheet()"></div><div class="panel"><div class="grab"><i></i></div><div id="sheetBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   1. 儲存層
   在 Claude 內用 window.storage；自行架站時自動改用 IndexedDB。
   ============================================================ */
const DB={
  mode:null,idb:null,
  async init(){
    if(window.storage){this.mode='host';return}
    try{
      this.idb=await new Promise((res,rej)=>{
        const r=indexedDB.open('dollcloset',1);
        r.onupgradeneeded=()=>r.result.createObjectStore('kv');
        r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
      });
      this.mode='idb';
    }catch(e){ this.mode='mem'; this.mem={}; }
  },
  async get(k){
    if(this.mode==='host'){ try{const r=await window.storage.get(k);return r?JSON.parse(r.value):null}catch(e){return null} }
    if(this.mode==='idb'){ return new Promise(res=>{const t=this.idb.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result??null);t.onerror=()=>res(null)}) }
    return this.mem[k]??null;
  },
  async set(k,v){
    if(this.mode==='host'){ try{await window.storage.set(k,JSON.stringify(v))}catch(e){toast('儲存空間已滿，請匯出備份')} return }
    if(this.mode==='idb'){ return new Promise(res=>{const t=this.idb.transaction('kv','readwrite').objectStore('kv').put(v,k);t.onsuccess=()=>res();t.onerror=()=>res()}) }
    this.mem[k]=v;
  }
};

/* ============================================================
   2. 資料
   ============================================================ */
const CATS=[
 ['套裝',null],['上衣','top'],['襯衫','top'],['毛衣','top'],['背心','top'],['T-shirt','top'],
 ['裙子','bottom'],['褲子','bottom'],['吊帶裙','bottom'],['吊帶褲','bottom'],
 ['洋裝','dress'],['連身衣','dress'],['爬爬衣','dress'],['睡衣','dress'],
 ['外套','outer'],['披風','outer'],['斗篷','outer'],
 ['帽子','head'],['髮飾','head'],['頭帶','head'],['耳罩','head'],
 ['襪子','socks'],['長襪','socks'],['褲襪','socks'],
 ['鞋子','shoes'],['靴子','shoes'],['拖鞋','shoes'],
 ['包包','bag'],['小包','bag'],
 ['圍巾','acc'],['項鍊','acc'],['領結','acc'],['腰帶','acc'],['手套','acc'],['眼鏡','acc'],['翅膀','acc'],['尾巴','acc'],['配件','acc'],
 ['道具',null],['其他',null]
];
const FILTERS=['全部','套裝','上衣','下身','洋裝','外套','帽子','襪子','鞋子','包包','配件'];
const FMAP={'上衣':['top'],'下身':['bottom'],'洋裝':['dress'],'外套':['outer'],'帽子':['head'],'襪子':['socks'],'鞋子':['shoes'],'包包':['bag'],'配件':['acc']};
const COMMON_PARTS=['帽子','上衣','裙子','褲子','吊帶裙','洋裝','外套','襪子','鞋子','包包','髮飾','配件'];
const SIZES=['10cm 棉花娃','15cm 棉花娃','20cm 棉花娃','OB11','黏土娃','BJD','其他'];

let S={items:[],sets:[],looks:[],wears:[],settings:{}};
let UI={tab:'closet',cat:'全部',mode:'全部',queue:[],canvas:[],selPc:null,detailImg:'cutout'};

const uid=p=>p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const today=()=>new Date().toISOString().slice(0,10);
const days=d=>d?Math.floor((Date.now()-new Date(d))/864e5):null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slotOf=c=>(CATS.find(x=>x[0]===c)||[])[1]||null;

async function save(){ await DB.set('data',S); }
async function load(){
  const d=await DB.get('data');
  if(d) S=Object.assign(S,d);
  S.settings=Object.assign({presets:[],activeId:'',bgMode:'local',bgTol:42,stickerEdge:6,stickerMode:'ai',stickerModel:'',bgUrl:'https://api.remove.bg/v1.0/removebg',bgKey:''},S.settings||{});
  if(!S.settings.presets.length){
    S.settings.presets=[{id:uid('p'),name:'New Preset',endpoint:'',key:'',model:'',models:[]}];
    S.settings.activeId=S.settings.presets[0].id;
  }
  if(!S.settings.presets.some(p=>p.id===S.settings.activeId))S.settings.activeId=S.settings.presets[0].id;
}

/* ============================================================

function fileToImg(file,max){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}
function drawScaled(im,max){
  const s=Math.min(1,max/Math.max(im.width,im.height));
  const c=document.createElement('canvas');
  c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  return c;
}
async function compress(file){
  const im=await fileToImg(file);
  return drawScaled(im,1000).toDataURL('image/jpeg',.82);
}
// 白/純色底的簡易去背：從四邊往內做泛洪，顏色接近背景就變透明
function localCutout(dataURL,tol){
  tol=tol??(S.settings.bgTol||42);
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      const c=drawScaled(im,760),x=c.getContext('2d'),W=c.width,H=c.height;
      const d=x.getImageData(0,0,W,H),p=d.data;
      const at=(i,j)=>(j*W+i)*4;
      let r=0,g=0,b=0,n=0;
      for(const [i,j] of [[0,0],[W-1,0],[0,H-1],[W-1,H-1],[W>>1,0],[W>>1,H-1]]){
        const k=at(i,j);r+=p[k];g+=p[k+1];b+=p[k+2];n++;
      }
      r/=n;g/=n;b/=n;
      const seen=new Uint8Array(W*H),q=new Int32Array(W*H);let h=0,t=0;
      const push=(i,j)=>{const id=j*W+i;if(seen[id])return;
        const k=id*4,dd=Math.abs(p[k]-r)+Math.abs(p[k+1]-g)+Math.abs(p[k+2]-b);
        if(dd>tol*3)return; seen[id]=1;q[t++]=id;};
      for(let i=0;i<W;i++){push(i,0);push(i,H-1)}
      for(let j=0;j<H;j++){push(0,j);push(W-1,j)}
      while(h<t){const id=q[h++],i=id%W,j=(id/W)|0;
        p[id*4+3]=0;
        if(i>0)push(i-1,j); if(i<W-1)push(i+1,j);
        if(j>0)push(i,j-1); if(j<H-1)push(i,j+1);
      }
      // 邊緣柔化一圈
      for(let j=1;j<H-1;j++)for(let i=1;i<W-1;i++){
        const id=j*W+i;if(seen[id])continue;
        if(seen[id-1]||seen[id+1]||seen[id-W]||seen[id+W])p[id*4+3]=150;
      }
      x.putImageData(d,0,0);
      res(c.toDataURL('image/png'));
    };
    im.src=dataURL;
  });
}
// 遠端去背（remove.bg 或任何回傳圖片的自訂 endpoint）
async function remoteCutout(dataURL){
  const st=S.settings;
  if(!st.bgKey) throw new Error('尚未設定去背 API 密鑰');
  const blob=await (await fetch(dataURL)).blob();
  const fd=new FormData();
  fd.append('image_file',blob,'a.jpg');fd.append('size','auto');
  const r=await fetch(st.bgUrl||'https://api.remove.bg/v1.0/removebg',{method:'POST',headers:{'x-api-key':st.bgKey},body:fd});
  if(!r.ok) throw new Error('去背服務回應 '+r.status);
  const out=await r.blob();
  return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(out)});
}
// 貼圖化：沿著輪廓往外長一圈白邊，順便蓋掉去背的毛邊
function makeSticker(dataURL,w){
  w=w??(S.settings.stickerEdge??6);
  if(!w)return Promise.resolve(dataURL);
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      const pad=w+2,W=im.width+pad*2,H=im.height+pad*2;
      const c=document.createElement('canvas');c.width=W;c.height=H;
      const x=c.getContext('2d');x.drawImage(im,pad,pad);
      const d=x.getImageData(0,0,W,H),p=d.data;
      const orig=new Uint8Array(W*H);
      for(let i=0;i<W*H;i++)orig[i]=p[i*4+3]>128?1:0;
      let cur=orig;
      for(let it=0;it<w;it++){
        const nx=cur.slice();
        for(let j=1;j<H-1;j++)for(let i=1;i<W-1;i++){
          const id=j*W+i;
          if(cur[id])continue;
          if(cur[id-1]||cur[id+1]||cur[id-W]||cur[id+W])nx[id]=1;
        }
        cur=nx;
      }
      for(let i=0;i<W*H;i++)if(cur[i]&&!orig[i]){
        p[i*4]=255;p[i*4+1]=255;p[i*4+2]=255;p[i*4+3]=255;
      }
      x.putImageData(d,0,0);
      res(c.toDataURL('image/png'));
    };
    im.onerror=()=>res(dataURL);
    im.src=dataURL;
  });
}
const STICKER_PROMPT='把圖中的娃娃衣服或配件單獨抽出來，去掉背景、手、娃娃本體和所有雜物，只留下這件單品本身。輸出一張圖片：單品置中且完整不裁切，背景填滿純白色 #FFFFFF，不要陰影、不要文字、不要邊框、不要浮水印，顏色圖案材質都要跟原圖一模一樣，不要重新設計。直接輸出圖片。';
// 從各種格式的回應裡把圖片挖出來
function extractImage(j){
  const s=JSON.stringify(j);
  let m=s.match(/data:image\/[a-zA-Z]+;base64,[A-Za-z0-9+/=]+/);
  if(m)return m[0].replace(/\\/g,'');
  m=s.match(/"(?:b64_json|inlineData|inline_data|image_base64|b64)"\s*:\s*(?:{[^{}]*"data"\s*:\s*)?"([A-Za-z0-9+/=]{500,})"/);
  if(m)return 'data:image/png;base64,'+m[1];
  m=s.match(/"data"\s*:\s*"([A-Za-z0-9+/=]{500,})"/);
  if(m)return 'data:image/png;base64,'+m[1];
  return null;
}
async function aiSticker(dataURL){
  const c=cfg();
  if(!c.endpoint)throw new Error('尚未設定 API');
  const model=(S.settings.stickerModel||'').trim()||c.model;
  const r=await fetch(apiURL(c.endpoint,'/chat/completions'),{
    method:'POST',headers:authHead(c.key),
    body:JSON.stringify({model,max_tokens:4000,messages:[{role:'user',content:[
      {type:'image_url',image_url:{url:dataURL}},
      {type:'text',text:STICKER_PROMPT}
    ]}]})
  });
  if(!r.ok){const t=await r.text();throw new Error(r.status+' '+t.slice(0,120))}
  const img=extractImage(await r.json());
  if(!img)throw new Error('這個模型沒有回傳圖片，請改用會出圖的模型');
  return img;
}
async function cutout(dataURL){
  const m=S.settings.stickerMode||'ai';
  let raw;
  if(m==='ai'){
    const white=await aiSticker(dataURL);
    raw=await localCutout(white,30);
  }else if(m==='api'){
    raw=await remoteCutout(dataURL);
  }else{
    raw=await localCutout(dataURL);
  }
  return makeSticker(raw);
}

const cfg=()=>S.settings.presets.find(p=>p.id===S.settings.activeId)||{};
const aiReady=()=>!!cfg().endpoint;
// 中轉站格式：填 base（.../v1）就好，路徑自動補
function apiURL(base,path){
  base=(base||'').trim().replace(/\/+$/,'');
  if(/\/(chat\/completions|messages|models)$/.test(base))base=base.replace(/\/[^/]+$/,'').replace(/\/chat$/,'');
  return base+path;
}
function authHead(key){
  const h={'content-type':'application/json'};
  if(key)h['authorization']='Bearer '+key;
  return h;
}
async function listModels(endpoint,key){
  const url=apiURL(endpoint,'/models');
  // 依序嘗試：無標頭（不觸發 preflight，成功率最高）→ Bearer → x-api-key → query string
  const tries=[
    [url,{}],
    [url,key?{authorization:'Bearer '+key}:{}],
    [url,key?{'x-api-key':key}:{}],
    [url+(key?(url.includes('?')?'&':'?')+'key='+encodeURIComponent(key):''),{}]
  ];
  let last='未知錯誤';
  for(const [u,h] of tries){
    try{
      const r=await fetch(u,{headers:h});
      if(!r.ok){last='HTTP '+r.status;continue}
      const j=await r.json();
      const arr=j.data||j.models||j;
      const out=(Array.isArray(arr)?arr:[]).map(m=>String(typeof m==='string'?m:(m.id||m.name||'')).replace(/^models\//,'')).filter(Boolean);
      if(out.length)return [...new Set(out)].sort();
      last='回應裡沒有模型清單';
    }catch(e){ last=/Failed to fetch|NetworkError|Load failed/i.test(e.message)?'CORS':'．'+e.message }
  }
  throw new Error(last==='CORS'?'中轉站沒開放跨域讀取模型清單，直接手動輸入模型名稱就好':'抓取失敗（'+last+'），可以手動輸入');
}
async function callAI(prompt,imageDataURL){
  const c=cfg();
  if(!c.endpoint)throw new Error('尚未設定 API 地址');
  const content=[{type:'text',text:prompt}];
  if(imageDataURL)content.unshift({type:'image_url',image_url:{url:imageDataURL}});
  const r=await fetch(apiURL(c.endpoint,'/chat/completions'),{
    method:'POST',headers:authHead(c.key),
    body:JSON.stringify({model:c.model,max_tokens:2000,messages:[{role:'user',content}]})
  });
  if(!r.ok){const t=await r.text();throw new Error(r.status+' '+t.slice(0,160))}
  const j=await r.json();
  const m=j.choices?.[0]?.message;
  return (typeof m?.content==='string'?m.content:(m?.content||[]).map(x=>x.text||'').join(''))||'';
}
function parseJSON(txt){
  const m=txt.replace(/```json|```/g,'').trim();
  const s=m.indexOf('{'),a=m.indexOf('[');
  const st=(a>-1&&(a<s||s===-1))?a:s;
  const en=Math.max(m.lastIndexOf('}'),m.lastIndexOf(']'));
  return JSON.parse(m.slice(st,en+1));
}

function togglePart(n,p){

async function analyze(n){
  const q=UI.queue[n];
  if(!aiReady()){toast('請先在設定填好 API 地址與模型');return}
  q.analyzing=true;renderQueue();
  try{
    const r=parseJSON(await callAI(TAG_PROMPT,q.photo));
    q.name=q.name||r.name||'';
    q.category=r.isSet?'套裝':(r.category||q.category);
    q.isSet=!!r.isSet;
    q.parts=(r.parts||[]).filter(p=>COMMON_PARTS.includes(p));
    q.colors=r.colors||[];q.styles=r.styles||[];q.motifs=r.motifs||[];
    q.season=r.season||'';q.material=r.material||'';

  q.analyzing=false;renderQueue();

async function analyzeAll(){for(let i=0;i<UI.queue.length;i++){if(!UI.queue[i].styles.length)await analyze(i)}}

async function commitQueue(){
  let n=0;
  for(const q of UI.queue){
    const base={photo:q.photo,cutout:q.cutout,colors:q.colors,styles:q.styles,motifs:q.motifs,
      season:q.season,material:q.material,sizes:[],brand:'',shop:'',buyDate:'',price:'',note:'',
      keepsake:false,keepsakeReason:'',createdAt:Date.now()};
    if(q.isSet){
      const sid=uid('s'),nm=q.name||'未命名套裝';
      S.sets.push({id:sid,name:nm,createdAt:Date.now()});
      S.items.push(Object.assign({id:uid('i'),setId:sid,name:nm,category:'套裝'},base));n++;
      const seen={};
      for(const p of q.parts){
        seen[p]=(seen[p]||0)+1;
        const sfx=seen[p]>1?' '+String.fromCharCode(64+seen[p]):'';
        S.items.push(Object.assign({id:uid('i'),setId:sid,name:`${nm}－${p}${sfx}`,category:p},base,{cutout:q.cutout}));n++;
      }
    }else{
      S.items.push(Object.assign({id:uid('i'),setId:null,name:q.name||'未命名',category:q.category},base));n++;
    }
  }
  UI.queue=[];renderQueue();await save();
  toast(`已建檔 ${n} 件`);go('closet');
}

function addToCanvas(id){
  if(UI.canvas.find(p=>p.itemId===id))return;
  UI.canvas.push({itemId:id,x:38,y:30,scale:120,rot:0});
  renderCanvas();
}
function renderCanvas(){
  const c=document.getElementById('canvas');
  c.innerHTML=UI.canvas.map((p,n)=>{
    const it=S.items.find(x=>x.id===p.itemId);if(!it)return '';
    return `<div class="pc ${UI.selPc===n?'sel':''}" data-n="${n}" style="left:${p.x}%;top:${p.y}%;width:${p.scale}px;transform:translate(-50%,-50%) rotate(${p.rot}deg);z-index:${n+1}">
      <img src="${img(it)}" alt=""></div>`;
  }).join('');
  bindDrag();
  const ct=document.getElementById('pcCtrl');
  if(UI.selPc!=null&&UI.canvas[UI.selPc]){
    const p=UI.canvas[UI.selPc],it=S.items.find(x=>x.id===p.itemId);
    ct.style.display='block';
    document.getElementById('pcName').textContent=it?it.name:'';
    document.getElementById('pcScale').value=p.scale;
    document.getElementById('pcRot').value=p.rot;
  }else ct.style.display='none';
}
function bindDrag(){
  const c=document.getElementById('canvas');
  c.querySelectorAll('.pc').forEach(el=>{
    el.onpointerdown=e=>{
      e.preventDefault();
      const n=+el.dataset.n;UI.selPc=n;renderCanvas();
      const box=c.getBoundingClientRect();
      const el2=c.querySelector(`.pc[data-n="${n}"]`);
      const move=ev=>{
        const p=UI.canvas[n];
        p.x=Math.max(2,Math.min(98,((ev.clientX-box.left)/box.width)*100));
        p.y=Math.max(2,Math.min(98,((ev.clientY-box.top)/box.height)*100));
        el2.style.left=p.x+'%';el2.style.top=p.y+'%';
      };
      const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up)};
      document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
    };
  });
}
function applyCtrl(){
  const p=UI.canvas[UI.selPc];if(!p)return;
  p.scale=+document.getElementById('pcScale').value;
  p.rot=+document.getElementById('pcRot').value;
  const el=document.querySelector(`.pc[data-n="${UI.selPc}"]`);
  el.style.width=p.scale+'px';el.style.transform=`translate(-50%,-50%) rotate(${p.rot}deg)`;
}

/* ============================================================
   10. 衣櫃洞察
   ============================================================ */
function renderInsight(){
  const el=document.getElementById('insight');
  const items=S.items.filter(i=>i.category!=='套裝');
  if(items.length<3){
    el.innerHTML='<div class="empty"><strong>還需要更多資料</strong>建檔幾件娃衣、記錄幾次穿搭之後，這裡會開始回答「我到底有什麼、真正常穿什麼」</div>';
    return;
  }
  const buyGroup={},wearGroup={};
  items.forEach(i=>{
    const k=i.category;
    buyGroup[k]=(buyGroup[k]||0)+1;
    wearGroup[k]=(wearGroup[k]||0)+wearCount(i.id);
  });
  const buyTop=Object.entries(buyGroup).sort((a,b)=>b[1]-a[1]);
  const wearTop=Object.entries(wearGroup).sort((a,b)=>b[1]-a[1]);
  const never=items.filter(i=>wearCount(i.id)===0);
  const cold=items.filter(i=>{const l=lastWear(i.id);return !i.keepsake&&(!l||days(l)>180)});
  const totalWears=S.wears.length;

  // 飽和度：同類型 >=4 件且半年未用比例 >=60%
  const sat=buyTop.filter(([k,n])=>{
    if(n<4)return false;
    const g=items.filter(i=>i.category===k);
    const idle=g.filter(i=>{const l=lastWear(i.id);return !l||days(l)>180}).length;
    return idle/n>=.6;
  });
  // 真正的偏好：最常穿的前 5 件的共同標籤
  const ranked=items.map(i=>({i,c:wearCount(i.id)})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,5);
  const tally={};
  ranked.forEach(({i})=>{[...(i.colors||[]),...(i.motifs||[]),...(i.styles||[]).map(s=>s.name)].forEach(t=>tally[t]=(tally[t]||0)+1)});
  const traits=Object.entries(tally).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([t])=>t);

  let h=`
  <div class="stat">
    <div><b>${S.sets.length}</b><span>套裝</span></div>
    <div><b>${items.length}</b><span>單品</span></div>
    <div><b>${totalWears}</b><span>穿搭紀錄</span></div>
    <div><b>${items.length?Math.round((items.length-never.length)/items.length*100):0}%</b><span>衣櫃使用率</span></div>
  </div>`;

  if(buyTop.length&&wearTop[0]&&wearTop[0][1]>0&&buyTop[0][0]!==wearTop[0][0]){
    h+=`<div class="note">你買最多的是<strong>${esc(buyTop[0][0])}</strong>（${buyTop[0][1]} 件），但真正最常穿的是<strong>${esc(wearTop[0][0])}</strong>。喜歡買的，不一定等於喜歡穿的。</div>`;
  }
  if(traits.length){
    h+=`<div class="note">你最常穿的那幾件，共同點是：<strong>${traits.map(esc).join('、')}</strong>。下次挑娃衣時可以拿這個當參考。</div>`;
  }

  h+=`<h2 class="sec">買了多少，穿了多少</h2>
  <div class="legend"><s>有穿過</s><s class="b">還沒穿</s></div>`;
  buyTop.slice(0,8).forEach(([k,n])=>{
    const g=items.filter(i=>i.category===k);
    const worn=g.filter(i=>wearCount(i.id)>0).length;
    h+=`<div class="bar"><div class="lb"><span>${esc(k)}</span><em>${worn} / ${n} 件穿過</em></div>
      <div class="track"><i class="worn" style="width:${worn/n*100}%"></i><i class="idle" style="width:${(n-worn)/n*100}%"></i></div></div>`;
  });

  if(sat.length){
    h+=`<h2 class="sec">已經很飽和的類型</h2>`;
    sat.forEach(([k,n])=>{
      const g=items.filter(i=>i.category===k);
      const idle=g.filter(i=>{const l=lastWear(i.id);return !l||days(l)>180}).length;
      h+=`<div class="note"><strong>${esc(k)}</strong>　共 ${n} 件，其中 ${idle} 件半年以上沒穿。想再買同類型之前，也許先翻翻這些。</div>`;
    });
  }

  if(cold.length){
    h+=`<h2 class="sec">最近被冷落的 ${cold.length} 件</h2>
      <div class="hint" style="margin-bottom:8px">標記為收藏／紀念品的不會出現在這裡。</div>`;
    h+=cold.slice(0,12).map(i=>{
      const l=lastWear(i.id);
      return `<div class="rowitem" onclick="openItem('${i.id}')">
        <div class="th"><img src="${img(i)}" alt=""></div>
        <div class="tx"><b>${esc(i.name)}</b><span>${esc(i.category)}</span></div>
        <div class="rt">${l?days(l)+' 天沒穿':'從未穿過'}</div></div>`;
    }).join('');
  }

  const dispose=cold.filter(i=>{
    const same=items.filter(x=>x.category===i.category).length;
    return same>=4&&wearCount(i.id)<=1;
  });
  if(dispose.length){
    h+=`<h2 class="sec">可以考慮整理</h2>
      <div class="hint" style="margin-bottom:8px">這只是資訊，不是建議你賣掉。覺得重要就標記成紀念品，之後就不會再出現。</div>`;
    h+=dispose.slice(0,8).map(i=>`<div class="rowitem" onclick="openItem('${i.id}')">
      <div class="th"><img src="${img(i)}" alt=""></div>
      <div class="tx"><b>${esc(i.name)}</b><span>同類型還有 ${items.filter(x=>x.category===i.category).length-1} 件・穿過 ${wearCount(i.id)} 次</span></div>
      <div class="rt">›</div></div>`).join('');
  }
  el.innerHTML=h;
}

/* ============================================================
   11. 設定 / 備份
   ============================================================ */
function openSettings(){
  const st=S.settings,c=cfg();
  openSheet(`
    <h3>設定</h3>

      <div class="row" style="margin-bottom:9px">
        <b class="grow" style="font-size:13.5px">預設配置</b>
        <button class="btn sm ghost" onclick="newPreset()">新增</button>
        <button class="btn sm ghost" onclick="delPreset()" style="color:var(--berry)">刪除</button>
      </div>
      <select id="s_active" onchange="switchPreset(this.value)">
        ${st.presets.map(p=>`<option value="${p.id}" ${p.id===st.activeId?'selected':''}>${esc(p.name)}</option>`).join('')}
      </select>
      <label class="f" style="margin:9px 0 0"><span>配置名稱</span><input type="text" id="s_name" value="${esc(c.name||'')}"></label>
    </div>

    <div class="card">
      <label class="f"><span>API 地址（Endpoint）</span>
        <input type="text" id="s_endpoint" value="${esc(c.endpoint||'')}" placeholder="https://your-relay.com/v1" autocapitalize="off" autocorrect="off"></label>
      <label class="f"><span>API 密鑰</span>
        <input type="password" id="s_key" value="${esc(c.key||'')}" autocapitalize="off" autocorrect="off"></label>
      <label class="f" style="margin-bottom:0"><span>模型</span>
        <div class="row">
          <input type="text" id="s_model" class="grow" value="${esc(c.model||'')}" placeholder="例如 gemini-3.1-pro-preview" autocapitalize="off" autocorrect="off" spellcheck="false">
          <button class="btn sm ghost" onclick="refreshModels(this)">抓清單</button>
        </div>
        ${(c.models||[]).length?`<div class="parts" style="margin-top:7px">${c.models.map(m=>`<button type="button" class="${m===c.model?'on':''}" onclick="pickModel(this,'${esc(m)}')">${esc(m)}</button>`).join('')}</div>`:''}
      </label>
    </div>

    <div class="row" style="margin-top:10px">
      <button class="btn grow" onclick="saveSettings(1)">保存配置</button>
      <button class="btn quiet grow" onclick="testAPI(this)">測試連接</button>
    </div>
    <button class="btn ghost wide" style="margin-top:8px" onclick="diagnose(this)">連不上？跑一次診斷</button>
    <p class="warn" style="margin-top:8px">${window.self!==window.top?'注意：這個頁面目前嵌在別的視窗裡執行。如果是在 Claude 的預覽視窗，對外連線會被沙箱擋掉，必須把 HTML 下載後用瀏覽器開啟。':'密鑰只存在這台裝置。'}</p>

    <h2 class="sec">貼圖</h2>
    <div class="card">
      <label class="f"><span>製作方式</span>
        <select id="s_smode" onchange="toggleSticker(this.value)">
          <option value="ai" ${(st.stickerMode||'ai')==='ai'?'selected':''}>AI 生成　用上面同一組 API，任何背景都行</option>
          <option value="local" ${st.stickerMode==='local'?'selected':''}>本機處理　免費，但背景要單純</option>
          <option value="api" ${st.stickerMode==='api'?'selected':''}>去背服務　另外申請的付費服務</option>
        </select></label>

      <div id="sk_ai" style="display:${(st.stickerMode||'ai')==='ai'?'block':'none'}">
        <label class="f"><span>出圖模型</span>
          <input type="text" id="s_smodel" value="${esc(st.stickerModel||'')}" placeholder="留空 = 用上面那個模型" autocapitalize="off" spellcheck="false"></label>
        <p class="hint" style="margin:-4px 0 12px">要填**會出圖**的模型，例如 gemini-3-pro-image-preview 這類名字裡有 image 的。純文字模型只會回你一段文字，做不出貼圖。可以在上面按「抓清單」看你的中轉站有哪些。</p>
      </div>

      <div id="sk_api" style="display:${st.stickerMode==='api'?'block':'none'}">
        <label class="f"><span>服務網址</span><input type="text" id="s_bgurl" value="${esc(st.bgUrl||'')}" autocapitalize="off"></label>
        <label class="f"><span>服務密鑰</span><input type="password" id="s_bgkey" value="${esc(st.bgKey||'')}" autocapitalize="off"></label>
      </div>

      <label class="f" style="margin-bottom:4px"><span>白邊粗細　<b id="s_edgev">${st.stickerEdge??6}</b></span>
        <input type="range" id="s_edge" min="0" max="16" value="${st.stickerEdge??6}" oninput="document.getElementById('s_edgev').textContent=this.value"></label>
      <p class="hint" style="margin:0 0 12px">像 LINE 貼圖那樣加一圈白框。設 0 就沒有白邊。</p>

      <label class="f" style="margin-bottom:4px"><span>去底強度　<b id="s_tolv">${st.bgTol||42}</b></span>
        <input type="range" id="s_bgtol" min="15" max="95" value="${st.bgTol||42}" oninput="document.getElementById('s_tolv').textContent=this.value"></label>
      <p class="hint" style="margin:0">底色沒清乾淨就調高，娃衣被吃掉就調低。用本機處理時才比較需要動它。</p>
    </div>

    <h2 class="sec">備份</h2>
    <div class="card">
      <p class="hint" style="margin:0 0 10px">資料全部存在這台裝置上。清掉瀏覽器資料就會消失，請定期匯出一份。</p>
      <div class="row">
        <button class="btn ghost grow" onclick="exportBackup(true)">完整備份（含照片）</button>
        <button class="btn ghost grow" onclick="exportBackup(false)">輕量備份（無照片）</button>
      </div>
      <button class="btn quiet wide" style="margin-top:8px" onclick="document.getElementById('imp').click()">從備份檔還原</button>
      <input type="file" id="imp" accept=".json,application/json" hidden onchange="importBackup(event)">
      <p class="hint" style="margin-top:10px">儲存方式：${DB.mode==='host'?'App 儲存空間':DB.mode==='idb'?'瀏覽器 IndexedDB':'僅此工作階段（無法保存，請務必匯出）'}</p>
    </div>
    <button class="btn ghost wide" style="margin-top:10px;color:var(--muted)" onclick="wipe()">清空所有資料</button>

}
function toggleSticker(v){
  document.getElementById('sk_ai').style.display=v==='ai'?'block':'none';
  document.getElementById('sk_api').style.display=v==='api'?'block':'none';
}
function pickModel(btn,m){
  document.getElementById('s_model').value=m;
  btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===btn));
}
function readForm(){
  const v=k=>{const e=document.getElementById(k);return e?e.value:''};
  const c=cfg();
  c.name=v('s_name')||'未命名';
  c.endpoint=v('s_endpoint').trim();
  c.key=v('s_key').trim();
  c.model=v('s_model').trim();
  S.settings.stickerMode=v('s_smode');S.settings.stickerModel=v('s_smodel');
  S.settings.bgTol=+v('s_bgtol')||42;S.settings.stickerEdge=+v('s_edge');
  S.settings.bgUrl=v('s_bgurl')||S.settings.bgUrl;S.settings.bgKey=v('s_bgkey')||S.settings.bgKey;
}
async function refreshModels(btn){
  readForm();
  const c=cfg();
  if(!c.endpoint){toast('請先填 API 地址');return}
  const old=btn.innerHTML;btn.innerHTML='<span class="spin"></span>';btn.disabled=true;
  try{
    c.models=await listModels(c.endpoint,c.key);
    await save();openSettings();toast(`找到 ${c.models.length} 個模型`);
  }catch(e){toast(e.message);btn.innerHTML=old;btn.disabled=false}
}
async function newPreset(){
  readForm();
  const p={id:uid('p'),name:'New Preset',endpoint:'',key:'',model:'',models:[]};
  S.settings.presets.push(p);S.settings.activeId=p.id;
  await save();openSettings();
}
async function delPreset(){
  if(S.settings.presets.length<2){toast('至少要保留一組');return}
  if(!confirm('刪除這組配置？'))return;
  S.settings.presets=S.settings.presets.filter(p=>p.id!==S.settings.activeId);
  S.settings.activeId=S.settings.presets[0].id;
  await save();openSettings();
}
async function switchPreset(id){
  readForm();S.settings.activeId=id;await save();openSettings();
}
async function saveSettings(loud){
  readForm();await save();
  if(loud)toast('設定已儲存');
}
async function testAPI(btn){
  await saveSettings(0);
  if(!cfg().model){toast('請先填模型名稱');return}
  const old=btn.innerHTML;btn.innerHTML='<span class="spin"></span> 測試中';btn.disabled=true;
  try{
    const r=await callAI('只回覆這兩個字：正常');
    toast('連接成功：'+r.trim().slice(0,30));
  }catch(e){toast('連接失敗：'+e.message)}
  btn.innerHTML=old;btn.disabled=false;
}
async function diagnose(btn){
  readForm();await save();
  const c=cfg(),out=[];
  const old=btn.innerHTML;btn.innerHTML='<span class="spin"></span> 檢查中';btn.disabled=true;
  const frame=window.self!==window.top;
  const file=location.protocol==='file:';
  out.push(['執行環境',file?'本機檔案 file://　網頁來源是 null，多數伺服器會直接擋':(frame?'嵌在 iframe 裡　如果這是 Claude 的預覽視窗，對外連線一定會被沙箱擋掉':'網頁 '+location.origin)]);
  if(!c.endpoint){out.push(['API 地址','還沒填']);}
  else{
    let reach;
    try{await fetch(apiURL(c.endpoint,'/models'),{mode:'no-cors'});reach='通　伺服器碰得到'}
    catch(e){reach='不通　封包根本出不去，多半是沙箱或網路環境擋的，跟 CORS 無關'}
    out.push(['能不能碰到伺服器',reach]);
    let g;
    try{const r=await fetch(apiURL(c.endpoint,'/models'));g='HTTP '+r.status+(r.ok?'　可以讀清單':'　伺服器回了錯誤碼')}
    catch(e){g='被 CORS 擋下　伺服器沒允許這個來源讀 /models'}
    out.push(['讀模型清單',g]);
    let p;
    try{
      const r=await fetch(apiURL(c.endpoint,'/chat/completions'),{method:'POST',headers:authHead(c.key),
        body:JSON.stringify({model:c.model||'test',max_tokens:8,messages:[{role:'user',content:'hi'}]})});
      const t=await r.text();
      p='HTTP '+r.status+'　'+t.slice(0,140);
    }catch(e){p='被 CORS 擋下　伺服器沒回 Access-Control-Allow-Origin'}
    out.push(['對話請求',p]);
  }
  btn.innerHTML=old;btn.disabled=false;
  let advice='';
  const j=out.map(o=>o[1]).join(' ');
  if(frame&&/不通/.test(j))advice='這個檔案現在跑在沙箱裡，不論你怎麼設定都連不出去。請把 HTML 下載下來，用 Safari 或 Chrome 開，或者放到 GitHub Pages、Cloudflare Pages 之類的地方。';
  else if(file)advice='用 file:// 開啟時網頁來源是 null，很多中轉站會拒絕。把檔案放上任何一個網址（GitHub Pages 免費且夠用）就會正常。';
  else if(/CORS/.test(j))advice='伺服器碰得到，但沒開放跨域。要在中轉站那邊回這幾個標頭：Access-Control-Allow-Origin、Access-Control-Allow-Headers: content-type,authorization、Access-Control-Allow-Methods: GET,POST,OPTIONS，而且 OPTIONS 要回 200。';
  else if(/HTTP 4/.test(j))advice='連線本身沒問題，是密鑰或模型名稱不對。看上面對話請求回傳的內容。';
  else if(/HTTP 200/.test(j))advice='一切正常，可以直接用了。';
  openSheet(`<h3>連線診斷</h3>
    ${out.map(([k,v])=>`<div class="rowitem" style="display:block"><b style="font-size:13px">${k}</b><div class="hint" style="word-break:break-all">${esc(v)}</div></div>`).join('')}
    ${advice?`<div class="note" style="margin-top:12px">${advice}</div>`:''}
    <button class="btn wide" style="margin-top:12px" onclick="openSettings()">回設定</button>`);
}
function exportBackup(withImages){
  const clone=JSON.parse(JSON.stringify({items:S.items,sets:S.sets,looks:S.looks,wears:S.wears}));
  if(!withImages){
    clone.items.forEach(i=>{i.photo=null;i.cutout=null});
    clone.wears.forEach(w=>w.photo=null);
  }
  const out={format:'doll-wardrobe',version:1,exportedAt:new Date().toISOString(),withImages,data:clone};
  const blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`娃衣衣櫃備份-${today()}${withImages?'':'-無照片'}.json`;
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('備份檔已下載');
}
async function importBackup(ev){
  const f=ev.target.files[0];ev.target.value='';
  if(!f)return;
  try{
    const j=JSON.parse(await f.text());
    if(j.format!=='doll-wardrobe')throw new Error('這不是娃衣衣櫃的備份檔');
    const mode=confirm('按「確定」覆蓋現有資料，按「取消」改成合併加入。');
    const d=j.data;
    if(mode){S.items=d.items||[];S.sets=d.sets||[];S.looks=d.looks||[];S.wears=d.wears||[]}
    else{
      const has=new Set(S.items.map(i=>i.id));
      S.items=S.items.concat((d.items||[]).filter(i=>!has.has(i.id)));
      const hs=new Set(S.sets.map(i=>i.id));
      S.sets=S.sets.concat((d.sets||[]).filter(i=>!hs.has(i.id)));
      const hl=new Set(S.looks.map(i=>i.id));
      S.looks=S.looks.concat((d.looks||[]).filter(i=>!hl.has(i.id)));
      const hw=new Set(S.wears.map(i=>i.id));
      S.wears=S.wears.concat((d.wears||[]).filter(i=>!hw.has(i.id)));
    }
    await save();closeSheet();go('closet');
    toast(`已還原 ${S.items.length} 件`);
  }catch(e){toast('還原失敗：'+e.message)}
}
async function wipe(){
  if(!confirm('這會刪掉所有娃衣、Look 和穿著紀錄。先匯出備份了嗎？'))return;
  S.items=[];S.sets=[];S.looks=[];S.wears=[];
  await save();closeSheet();go('closet');toast('已清空');
}

(async function(){
  await DB.init();
  await load();
  buildTabs();
  renderCloset();
  renderQueue();
