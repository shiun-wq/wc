  let advice='';
  const j=out.map(o=>o[1]).join(' ');
  if(frame&&/不通/.test(j))advice='這個檔案現在跑在沙箱裡，不論你怎麼設定都連不出去。請把 HTML 下載下來，用 Safari 或 Chrome 開，或者放到 GitHub Pages、Cloudflare Pages 之類的地方。';
  else if(file)advice='用 file:// 開啟時網頁來源是 null，很多 API 伺服器會拒絕。把檔案放上任何一個網址（GitHub Pages 免費且夠用）就會正常。';
  else if(/CORS/.test(j))advice='伺服器碰得到，但沒開放跨域。要在 API 伺服器那邊回這幾個標頭：Access-Control-Allow-Origin、Access-Control-Allow-Headers: content-type,authorization、Access-Control-Allow-Methods: GET,POST,OPTIONS，而且 OPTIONS 要回 200。';
  else if(/HTTP 4/.test(j))advice='連線本身沒問題，是密鑰或模型名稱不對。看上面對話請求回傳的內容。';
  else if(/HTTP 200|(^| )正常/.test(j))advice='一切正常，可以直接用了。';
  else if(/這個網址沒有被允許/.test(j))advice='後台的 ALLOWED_ORIGINS 沒有包含這個網址：'+location.origin+'，加進去再按 Deploy。';
  openSheet(`<h3>連線診斷</h3>
    ${out.map(([k,v])=>`<div class="rowitem" style="display:block"><b style="font-size:13px">${k}</b><div class="hint" style="word-break:break-all">${esc(v)}</div></div>`).join('')}
    ${advice?`<div class="note" style="margin-top:12px">${advice}</div>`:''}
    <button class="btn wide" style="margin-top:12px" onclick="openSettings('dev')">回設定</button>`);
}
// 備份：照片很多時，不能把整份資料複製好幾次再變成一個超長字串（iPhone 會記憶體不夠、整頁當掉）。
// 改成一筆一筆轉成小段文字，照片直接接在後面，最後交給 Blob 組成檔案。
const BK_IMG={items:['photo','cutout','cutSrc','cutMask'],memory:['photo','cutout','cutSrc','cutMask'],dolls:['photo','raw'],wears:['photo'],wish:['photo'],orders:['photo','photoSrc']};
function backupParts(withImages){
  const parts=[],data={items:S.items,sets:S.sets,looks:S.looks,wears:S.wears,dolls:S.dolls,wish:S.wish,memory:S.memory,orders:S.orders};
  // 裝置代碼也放進去：換手機還原時，可以把會員和點數一起搬過去
  parts.push(`{"format":"doll-wardrobe","version":1,"exportedAt":${JSON.stringify(new Date().toISOString())},"withImages":${withImages},"device":${JSON.stringify(deviceId())},"data":{`);
  let first=true;
  for(const [k,list] of Object.entries(data)){
    parts.push(`${first?'':','}${JSON.stringify(k)}:[`);first=false;
    const flds=BK_IMG[k]||[];
    (list||[]).forEach((o,i)=>{
      const c={...o};flds.forEach(f=>delete c[f]);
      let j=JSON.stringify(c);
      // 輕量備份：照片欄位都寫 null；完整備份：原本有的欄位原樣放回去
      const imgs=flds.filter(f=>!withImages||o[f]!==undefined);
      if(!imgs.length){parts.push((i?',':'')+j);return}
      parts.push((i?',':'')+j.slice(0,-1));
      imgs.forEach((f,n)=>{const v=withImages?o[f]:null,pre=(j.length>2||n)?',':'';
        if(typeof v!=='string'){parts.push(`${pre}"${f}":${JSON.stringify(v)}`);return}
        // data URL 只有英數和 +/=;:,，不用跳脫，直接接上去，省一次複製
        if(/^data:[\w/+.-]+;base64,[A-Za-z0-9+/=]*$/.test(v.slice(0,64))&&!/["\\]/.test(v.slice(-64)))parts.push(`${pre}"${f}":"`,v,'"');
        else parts.push(`${pre}"${f}":${JSON.stringify(v)}`)});
      parts.push('}');
    });
    parts.push(']');
  }
  parts.push(`,"sizes":${JSON.stringify(S.settings.sizes||[])},"customCats":${JSON.stringify(customCats())},"hiddenCats":${JSON.stringify(S.settings.hiddenCats||[])}}}`);
  return parts;
}
async function exportBackup(withImages){
  toast(withImages?'正在準備完整備份…照片多的話要等一下':'正在準備備份…');
  await new Promise(r=>setTimeout(r,60));
  let blob;
  try{blob=new Blob(backupParts(withImages),{type:'application/json'})}
  catch(e){toast('手機記憶體不夠，備份失敗。先關掉其他 App 再試一次，或先用輕量備份');return}
  const name=`哇娃衣櫃備份-${today()}${withImages?'':'-無照片'}.json`;
  if(!(await saveFiles([new File([blob],name,{type:'application/json'})])))return;
  if(withImages){S.settings.lastBackup=Date.now();save();if(UI.tab==='home')renderHome()}
  if(isApp())return;
  toast(`備份檔已下載（${blob.size>1048576?(blob.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(blob.size/1024))+' KB'}）`);
}
async function importBackup(ev){
  const f=ev.target.files[0];ev.target.value='';
  if(!f)return;
  try{
    const j=JSON.parse(await f.text());
    if(j.format!=='doll-wardrobe')throw new Error('這不是哇娃衣櫃的備份檔');
    const mode=confirm('按「確定」覆蓋現有資料，按「取消」改成合併加入。');
    const d=j.data;
    if(mode){S.items=d.items||[];S.sets=d.sets||[];S.looks=d.looks||[];S.wears=d.wears||[];S.dolls=d.dolls||[];S.wish=d.wish||[];S.memory=d.memory||[];S.orders=d.orders||[]}
    else{
      const has=new Set(S.items.map(i=>i.id));
      S.items=S.items.concat((d.items||[]).filter(i=>!has.has(i.id)));
      const hs=new Set(S.sets.map(i=>i.id));
      S.sets=S.sets.concat((d.sets||[]).filter(i=>!hs.has(i.id)));
      const hl=new Set(S.looks.map(i=>i.id));
      S.looks=S.looks.concat((d.looks||[]).filter(i=>!hl.has(i.id)));
      const hw=new Set(S.wears.map(i=>i.id));
      S.wears=S.wears.concat((d.wears||[]).filter(i=>!hw.has(i.id)));
      const hd=new Set(S.dolls.map(i=>i.id));
      S.dolls=S.dolls.concat((d.dolls||[]).filter(i=>!hd.has(i.id)));
      const hx=new Set(S.wish.map(i=>i.id));
      S.wish=S.wish.concat((d.wish||[]).filter(i=>!hx.has(i.id)));
      const ho=new Set(S.orders.map(i=>i.id));
      S.orders=S.orders.concat((d.orders||[]).filter(i=>!ho.has(i.id)));
      const hm=new Set(S.memory.map(i=>i.id));
      S.memory=S.memory.concat((d.memory||[]).filter(i=>!hm.has(i.id)));
    }
    (d.sizes||[]).forEach(z=>{if(!S.settings.sizes.includes(z))S.settings.sizes.push(z)});
    S.settings.customCats=[...new Set([...customCats(),...(d.customCats||[])])];
    if(mode&&d.hiddenCats)S.settings.hiddenCats=d.hiddenCats;
    // 別台手機做的備份：問要不要把那台的會員、點數、兌換紀錄一起搬過來
    let moved=false;
    if(/^[a-zA-Z0-9_-]{8,64}$/.test(j.device||'')&&j.device!==deviceId()&&confirm('這份備份是另一台手機（或重裝前）做的。要把那邊的會員、點數和兌換紀錄也一起搬過來嗎？\n\n按「確定」搬過來（這台原本的點數會換成那邊的）；按「取消」只還原衣櫃資料。')){
      S.settings.deviceId=j.device;S.acct=null;moved=true;
    }
    await save();closeSheet();go('home');
    if(moved)await acctLoad();
    toast(`已還原 ${S.items.length} 件${moved?'，會員和點數也搬過來了':''}`);
  }catch(e){toast('還原失敗：'+e.message)}
}
async function wipe(){
  if(!confirm('這會刪掉所有娃衣、娃娃、Look、穿著紀錄和考慮中清單。先匯出備份了嗎？'))return;
  S.items=[];S.sets=[];S.looks=[];S.wears=[];S.dolls=[];S.wish=[];S.memory=[];S.orders=[];
  await save();closeSheet();go('home');toast('已清空');
}

/* ============================================================
   12. 捲動淡入 / 頂欄陰影
   畫面多半由 innerHTML 重繪，所以用 MutationObserver 抓新節點，
   再交給 IntersectionObserver 在進入畫面時淡入。
   ============================================================ */
const Reveal=(()=>{
  const SEL='.guide,.notice,.idea,.memcard,.wcardbig,.pack,.qrow,.lookcard,.locked,.hhero,.qa,.hstat,.hcard,.hscroll,.wcard,.blist,.piece,.card,.rowitem,.note,.stat > div,.bar,h2.sec,.qcard,.empty,.drop,#canvas,.ctrl,.hero,dl.meta,.legend,#wearList';
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last={el:null,t:0};
  const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>{
    let n=0;
    es.forEach(e=>{
      if(!e.isIntersecting)return;
      e.target.style.setProperty('--d',Math.min(n++,6)*55+'ms');
      e.target.classList.add('in');
      io.unobserve(e.target);
    });
  },{rootMargin:'0px 0px -6% 0px',threshold:.08}):null;
  function tag(root,quick){
    const list=[];
    if(root.matches&&root.matches(SEL))list.push(root);
    if(root.querySelectorAll)list.push(...root.querySelectorAll(SEL));
    list.forEach(el=>{
      if(el.classList.contains('rv'))return;
      if(reduce||!io||quick){el.classList.add('rv','in');return}
      el.classList.add('rv');io.observe(el);
    });
  }
  function watch(root){
    new MutationObserver(ms=>{
      // 同一區塊短時間內連續重繪（例如搜尋框打字），直接顯示，避免一直閃
      const now=performance.now();
      ms.forEach(m=>{
        const quick=last.el===m.target&&now-last.t<700;
        last={el:m.target,t:now};
        m.addedNodes.forEach(nd=>nd.nodeType===1&&tag(nd,quick));
      });
    }).observe(root,{childList:true,subtree:true});
    tag(root);
  }
  return {watch};
})();
Reveal.watch(document.querySelector('main'));
Reveal.watch(document.getElementById('sheetBody'));
// 橫向標籤列：手機用手指滑；電腦可以用滾輪或按住拖曳
function chipEdge(el){
  el.classList.toggle('more-l',el.scrollLeft>4);
  el.classList.toggle('more-r',el.scrollLeft+el.clientWidth<el.scrollWidth-4);
}
document.addEventListener('scroll',e=>{if(e.target.classList&&e.target.classList.contains('chips'))chipEdge(e.target)},true);
addEventListener('resize',()=>document.querySelectorAll('.chips').forEach(chipEdge));
document.addEventListener('wheel',e=>{
  const el=e.target.closest&&e.target.closest('.chips');
  if(!el||el.scrollWidth<=el.clientWidth||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
  e.preventDefault();el.scrollLeft+=e.deltaY;
},{passive:false});
(function(){
  let el=null,x0=0,s0=0,moved=false;
  document.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse'||e.button!==0)return;
    el=e.target.closest('.chips');if(!el)return;
    x0=e.clientX;s0=el.scrollLeft;moved=false;
  });
  document.addEventListener('pointermove',e=>{
    if(!el)return;const dx=e.clientX-x0;
    if(!moved&&Math.abs(dx)>5){moved=true;el.classList.add('drag')}
    if(moved)el.scrollLeft=s0-dx;
  });
  document.addEventListener('pointerup',()=>{
    if(!el)return;
    const t=el;el=null;
    // 拖曳結束時不要順便觸發點擊
    if(moved)setTimeout(()=>t.classList.remove('drag'),0);
  });
})();
// 抓住抽屜上緣往下拖就能關閉
(function(){
  const g=document.querySelector('.sheet .grab'),panel=document.querySelector('.sheet .panel');
  let y0=null,dy=0;
  g.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;y0=e.clientY;dy=0;g.setPointerCapture(e.pointerId);panel.style.transition='none'});
  g.addEventListener('pointermove',e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);panel.style.transform=`translateY(${dy}px)`});
  const end=()=>{if(y0===null)return;y0=null;panel.style.transition='transform .25s ease';panel.style.transform='';if(dy>90)closeSheet()};
  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
})();
(function(){
  const h=document.querySelector('header.top');
  const on=()=>h.classList.toggle('scrolled',scrollY>4);
  addEventListener('scroll',on,{passive:true});on();
})();

/* ============================================================
   啟動
   ============================================================ */
(async function(){
  await DB.init();
  await load();
  applyTheme();
  go('home');
  acctLoad().then(()=>{if(UI.tab==='home')renderHome()});
  // 請瀏覽器不要自動清掉這個網站的資料（有支援的瀏覽器才會生效）
  try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))navigator.storage.persist()}catch(e){}
  if(!isApp()&&'serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
  setTimeout(checkUpdate,3000);
  if(!S.settings.welcomed&&!S.items.length&&!S.dolls.length)openWelcome();
  setTimeout(notifyAnniv,1500);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){notifyAnniv();if(UI.tab==='home')renderHome()}});
})();
